<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyfe · The Simulation by WindowDoom</title>
<style>
:root{
  --bg:#0a0612;
  --s1:#15102a;
  --s2:#1f1840;
  --b1:#2a2050;
  --b2:#3d2e6e;
  --t1:#f5f0ff;
  --t2:#c4b8e0;
  --t3:#8a7ab8;
  /* Vibrant palette — saturated, neon-leaning */
  --accent:#a855f7;
  --accent2:#d8b4fe;
  --teal:#06d6a0;
  --gold:#fbbf24;
  --crimson:#ef4444;
  --green:#22c55e;
  --orange:#fb923c;
  --pink:#ec4899;
  --blue:#3b82f6;
  --cyan:#22d3ee;
  --magenta:#d946ef;
  --lime:#a3e635;
  --font-h: 'Georgia', serif;
  --font-m: 'Courier New', monospace;
  --font-s: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --r:4px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font-s);
  font-size:14px;line-height:1.45;overflow:hidden;}
body{display:flex;flex-direction:column;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ─── Topbar ─── */
#topbar{height:54px;background:linear-gradient(180deg,#13131f,#0d0d18);
  border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 18px;gap:14px;
  flex-shrink:0;}
.brand-by{font-family:var(--font-m);font-size:9px;letter-spacing:.18em;color:var(--magenta);
  margin-left:6px;text-transform:uppercase;}
.brand-by-wd{font-family:var(--font-m);font-size:8px;letter-spacing:.32em;color:var(--cyan);
  margin-left:5px;text-transform:uppercase;opacity:.85;border:1px solid var(--cyan);
  padding:1px 5px;border-radius:3px;}
.brand{font-family:var(--font-h);font-size:22px;font-weight:900;letter-spacing:.04em;
  color:var(--accent);}
.brand-sub{font-family:var(--font-m);font-size:9px;color:var(--t3);letter-spacing:.32em;
  text-transform:uppercase;margin-left:2px;}
.tb-spacer{flex:1;}
.tb-chip{font-family:var(--font-m);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  padding:5px 11px;border-radius:11px;border:1px solid var(--b2);background:var(--s1);
  color:var(--t2);display:inline-flex;align-items:center;gap:6px;}
.tb-chip.money{color:var(--green);border-color:rgba(94,226,122,.3);}
.tb-chip.money.neg{color:var(--crimson);border-color:rgba(255,94,94,.4);}
.tb-chip.age{color:var(--gold);border-color:rgba(255,208,96,.3);}
.tb-chip.country{color:var(--teal);border-color:rgba(29,214,196,.3);}
.tb-btn{background:var(--s1);border:1px solid var(--b2);color:var(--t2);padding:5px 12px;
  border-radius:var(--r);font-family:var(--font-m);font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;cursor:pointer;transition:all .15s;}
.tb-btn:hover{color:var(--t1);border-color:var(--accent);}
.tb-btn.warn{color:var(--crimson);border-color:rgba(255,94,94,.4);}

/* ─── Main grid ─── */
#main{flex:1;display:grid;grid-template-columns:280px 1fr 320px;overflow:hidden;}
.col{display:flex;flex-direction:column;overflow:hidden;}
.col-l{background:var(--s1);border-right:1px solid var(--b1);}
.col-r{background:var(--s1);border-left:1px solid var(--b1);}
.col-c{background:var(--bg);overflow-y:auto;}
.col-head{padding:14px 18px;border-bottom:1px solid var(--b1);font-family:var(--font-m);
  font-size:10px;letter-spacing:.28em;color:var(--accent2);text-transform:uppercase;
  background:#0d0d18;}
.col-body{flex:1;overflow-y:auto;padding:14px 18px;}

/* ─── Stats bars (left) ─── */
.stat{margin-bottom:14px;}
.stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;
  font-size:12px;}
.stat-name{color:var(--t2);font-family:var(--font-m);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;}
.stat-val{color:var(--t1);font-weight:700;font-family:var(--font-m);font-size:13px;}
.stat-bar{height:7px;background:var(--s2);border-radius:4px;overflow:hidden;border:1px solid var(--b1);}
.stat-fill{height:100%;border-radius:3px;transition:width .55s ease;background:linear-gradient(90deg,var(--green),#7fff90);}
.stat-fill.happiness{background:linear-gradient(90deg,#ffd060,#ffa030);}
.stat-fill.health{background:linear-gradient(90deg,var(--crimson),#ff8a8a);}
.stat-fill.smarts{background:linear-gradient(90deg,var(--accent),var(--accent2));}
.stat-fill.looks{background:linear-gradient(90deg,var(--pink),#ffb0d0);}
.stat-fill.karma{background:linear-gradient(90deg,var(--teal),#5eeae0);}

/* ─── Character card (left) ─── */
.char-card{margin-bottom:20px;padding:14px;background:var(--s2);border:1px solid var(--b1);
  border-radius:var(--r);text-align:center;}
.char-avatar{font-size:48px;margin-bottom:6px;}
.char-name{font-family:var(--font-h);font-size:18px;color:var(--t1);font-weight:700;margin-bottom:3px;}
.char-occ{font-family:var(--font-m);font-size:10px;letter-spacing:.12em;color:var(--accent2);
  text-transform:uppercase;}
.char-loc{font-family:var(--font-m);font-size:9px;color:var(--t3);letter-spacing:.16em;
  text-transform:uppercase;margin-top:4px;}

/* ─── Timeline (center) ─── */
.year-block{margin-bottom:18px;padding:14px 18px;background:var(--s1);border:1px solid var(--b1);
  border-radius:var(--r);animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.year-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;
  padding-bottom:8px;border-bottom:1px solid var(--b1);}
.year-num{font-family:var(--font-h);font-size:20px;color:var(--gold);font-weight:900;}
.year-age{font-family:var(--font-m);font-size:10px;color:var(--t3);letter-spacing:.16em;
  text-transform:uppercase;}
.year-event{font-size:13.5px;color:var(--t1);margin:7px 0;line-height:1.5;
  padding-left:14px;border-left:2px solid var(--b2);}
.year-event.good{border-left-color:var(--green);color:#e0ffe6;}
.year-event.bad{border-left-color:var(--crimson);color:#ffe0e0;}
.year-event.milestone{border-left-color:var(--gold);color:#fff4d0;font-weight:600;}
.year-event.romantic{border-left-color:var(--pink);color:#ffe0ee;}
.year-event.career{border-left-color:var(--accent);color:#e8d8ff;}
.year-event.death{border-left-color:#ff3030;color:#ff8080;font-weight:700;}
.year-event-fx{font-family:var(--font-m);font-size:10px;color:var(--t3);margin-top:4px;
  margin-left:14px;letter-spacing:.05em;}

/* ─── Actions bar (bottom of center) ─── */
#actions-bar{padding:14px 18px;background:linear-gradient(180deg,#0a0a14,#08080f);
  border-top:1px solid var(--b1);display:flex;gap:9px;flex-wrap:wrap;align-items:center;
  position:sticky;bottom:0;flex-shrink:0;}
.act-btn{background:var(--s2);border:1px solid var(--b2);color:var(--t2);padding:8px 14px;
  border-radius:var(--r);font-family:var(--font-m);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;cursor:pointer;transition:all .15s;}
.act-btn:hover{color:var(--t1);border-color:var(--accent);background:#1a1a2e;}
.act-btn.primary{background:linear-gradient(180deg,var(--accent),#7d4be0);color:#fff;
  border-color:var(--accent);font-weight:700;padding:10px 22px;font-size:11px;}
.act-btn.primary:hover{background:linear-gradient(180deg,#b08aff,var(--accent));
  box-shadow:0 0 14px rgba(157,107,255,.45);}
.act-btn.disabled{opacity:0.4;cursor:not-allowed;}

/* ─── Family panel (right) ─── */
.fam-section{margin-bottom:18px;}
.fam-section-h{font-family:var(--font-m);font-size:9px;letter-spacing:.22em;color:var(--accent2);
  text-transform:uppercase;margin-bottom:7px;border-bottom:1px solid var(--b1);padding-bottom:4px;}
.fam-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--b1);
  font-size:12px;}
.fam-emoji{font-size:18px;}
.fam-info{flex:1;min-width:0;}
.fam-name{color:var(--t1);font-weight:600;font-size:12.5px;}
.fam-meta{color:var(--t3);font-size:10px;font-family:var(--font-m);letter-spacing:.06em;}
.fam-rel{color:var(--pink);font-size:10px;font-family:var(--font-m);}
.fam-rel.bad{color:var(--crimson);}
.fam-rel.good{color:var(--green);}
.fam-deceased{opacity:0.55;text-decoration:line-through;}
.fam-empty{color:var(--t3);font-style:italic;font-size:12px;padding:8px 0;text-align:center;}

/* ─── Assets ─── */
.asset-card{padding:10px 12px;background:var(--s2);border:1px solid var(--b1);
  border-radius:var(--r);margin-bottom:7px;}
.asset-name{font-size:12.5px;color:var(--t1);font-weight:600;margin-bottom:3px;}
.asset-meta{font-family:var(--font-m);font-size:9.5px;color:var(--t3);letter-spacing:.06em;}

/* ─── Modal overlay ─── */
.modal{position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.92);
  display:none;align-items:center;justify-content:center;padding:24px;animation:fadeIn .25s;}
.modal.show{display:flex;}
.modal-box{width:min(94vw,720px);max-height:90vh;background:linear-gradient(180deg,#13131f,#0a0a14);
  border:1px solid var(--accent);border-radius:8px;overflow:hidden;display:flex;
  flex-direction:column;box-shadow:0 0 70px rgba(157,107,255,.4);}
.modal-head{padding:14px 22px;border-bottom:1px solid var(--b1);
  background:linear-gradient(180deg,#1a1428,#0d0a18);display:flex;align-items:center;gap:12px;}
.modal-title{font-family:var(--font-h);font-size:18px;color:var(--accent2);flex:1;font-weight:700;}
.modal-x{background:none;border:1px solid var(--b2);color:var(--t2);padding:4px 11px;
  border-radius:3px;font-family:var(--font-m);font-size:9px;letter-spacing:.18em;
  cursor:pointer;text-transform:uppercase;}
.modal-x:hover{background:var(--s2);color:var(--t1);}
.modal-body{padding:18px 22px;overflow-y:auto;color:var(--t1);}
.modal-tabs{display:flex;border-bottom:1px solid var(--b1);background:#0d0d18;}
.modal-tab{flex:1;padding:10px;background:none;border:none;color:var(--t3);
  font-family:var(--font-m);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  cursor:pointer;border-bottom:2px solid transparent;}
.modal-tab.active{color:var(--accent2);border-bottom-color:var(--accent);background:var(--s1);}
.modal-tab:hover:not(.active){color:var(--t2);}

/* ─── Cards (jobs, dates, etc.) ─── */
.card{padding:14px 16px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);
  margin-bottom:9px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;}
.card:hover{border-color:var(--accent);background:#1a1a2e;}
.card-ico{font-size:32px;width:50px;text-align:center;}
.card-body{min-width:0;}
.card-title{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:3px;}
.card-meta{font-family:var(--font-m);font-size:10px;color:var(--t3);letter-spacing:.06em;}
.card-meta b{color:var(--t2);}
.card-act{display:flex;flex-direction:column;gap:5px;align-items:flex-end;}
.card-pay{font-family:var(--font-m);font-size:14px;color:var(--green);font-weight:700;}
.card-pay.neg{color:var(--crimson);}
.card-tag{font-family:var(--font-m);font-size:8.5px;letter-spacing:.16em;padding:2px 6px;
  border-radius:2px;background:var(--s1);color:var(--t3);text-transform:uppercase;}
.card-tag.req{color:var(--gold);background:rgba(255,208,96,.12);}
.card-tag.locked{color:var(--crimson);background:rgba(255,94,94,.12);}
.card-tag.illegal{color:#ff8080;background:rgba(255,40,40,.15);border:1px solid rgba(255,80,80,.3);}
.card-btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:3px;
  font-family:var(--font-m);font-size:10px;letter-spacing:.14em;cursor:pointer;
  text-transform:uppercase;font-weight:700;}
.card-btn:hover{background:var(--accent2);}
.card-btn.danger{background:var(--crimson);}
.card-btn.danger:hover{background:#ff8a8a;}
.card-btn.muted{background:var(--b2);}
.card-btn.muted:hover{background:var(--b1);color:var(--t1);}
.card-btn.green{background:var(--green);color:#031208;}
.card-btn.green:hover{background:#9aff9a;}
.card-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* ─── Dating card variant ─── */
.date-card{padding:18px 20px;background:linear-gradient(180deg,#1a1428,#0d0a18);
  border:1px solid var(--pink);border-radius:8px;margin-bottom:14px;
  box-shadow:0 0 24px rgba(255,141,180,.18);}
.date-head{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.date-pic{font-size:64px;width:90px;height:90px;display:flex;align-items:center;justify-content:center;
  background:var(--s2);border:2px solid var(--pink);border-radius:50%;}
.date-info-name{font-family:var(--font-h);font-size:22px;color:#fff;font-weight:700;margin-bottom:3px;}
.date-info-meta{font-family:var(--font-m);font-size:11px;color:var(--t2);letter-spacing:.06em;
  line-height:1.7;}
.date-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px;
  padding:10px;background:#0a0a14;border-radius:4px;}
.date-stat{text-align:center;}
.date-stat-l{font-family:var(--font-m);font-size:8px;color:var(--t3);letter-spacing:.18em;
  text-transform:uppercase;margin-bottom:2px;}
.date-stat-v{font-family:var(--font-m);font-size:14px;font-weight:700;}
.date-compat{padding:10px;background:rgba(255,141,180,.08);border:1px dashed var(--pink);
  border-radius:4px;font-size:13px;color:#ffdce6;margin-bottom:14px;font-style:italic;}
.date-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}

/* ─── Intro / character creation ─── */
#intro{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a1428,#000);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:5000;padding:30px;overflow-y:auto;}
.intro-title{font-family:var(--font-h);font-size:80px;font-weight:900;letter-spacing:.04em;
  background:linear-gradient(180deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 60px rgba(157,107,255,.4);
  margin-bottom:8px;}
.intro-sub{font-family:var(--font-m);font-size:11px;letter-spacing:.4em;color:var(--t3);
  text-transform:uppercase;margin-bottom:40px;}
.intro-form{width:min(94vw,600px);background:var(--s1);border:1px solid var(--b1);
  border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:14px;}
.intro-field{display:flex;flex-direction:column;gap:5px;}
.intro-label{font-family:var(--font-m);font-size:10px;letter-spacing:.2em;color:var(--accent2);
  text-transform:uppercase;}
.intro-input,.intro-select{background:var(--bg);border:1px solid var(--b2);color:var(--t1);
  padding:10px 12px;font-family:var(--font-s);font-size:14px;border-radius:3px;}
.intro-input:focus,.intro-select:focus{outline:none;border-color:var(--accent);}
.intro-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.country-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
.country-btn{padding:10px;background:var(--s2);border:1px solid var(--b2);border-radius:4px;
  cursor:pointer;text-align:center;transition:all .15s;}
.country-btn.selected{border-color:var(--accent);background:#1a1428;
  box-shadow:0 0 12px rgba(157,107,255,.3);}
.country-btn:hover{border-color:var(--accent2);}
.country-flag{font-size:30px;display:block;margin-bottom:4px;}
.country-name{font-family:var(--font-m);font-size:9.5px;letter-spacing:.08em;color:var(--t2);}
.intro-start{background:linear-gradient(90deg,var(--accent),#7d4be0);color:#fff;border:none;
  padding:14px;font-family:var(--font-m);font-size:13px;letter-spacing:.28em;text-transform:uppercase;
  font-weight:900;border-radius:4px;cursor:pointer;margin-top:6px;}
.intro-start:hover{background:linear-gradient(90deg,#b08aff,var(--accent));
  box-shadow:0 0 24px rgba(157,107,255,.5);}

/* ─── Death overlay ─── */
#death-screen{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a0808,#000);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:7000;padding:30px;text-align:center;}
#death-screen.show{display:flex;}
.death-title{font-family:var(--font-h);font-size:60px;color:var(--crimson);
  font-weight:900;letter-spacing:.1em;margin-bottom:14px;text-shadow:0 0 40px rgba(255,94,94,.5);}
.death-sub{font-family:var(--font-m);font-size:11px;color:var(--t3);letter-spacing:.32em;
  text-transform:uppercase;margin-bottom:30px;}
.death-summary{background:var(--s1);border:1px solid var(--b1);border-radius:6px;
  padding:22px 26px;max-width:540px;font-size:14px;color:var(--t1);margin-bottom:24px;}
.death-stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--b2);
  font-family:var(--font-m);font-size:12.5px;}
.death-stat-k{color:var(--t3);letter-spacing:.06em;}
.death-stat-v{color:var(--t1);font-weight:700;}
.death-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}

/* ─── Toast ─── */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:8000;
  background:var(--s2);border:1px solid var(--accent);border-radius:4px;padding:10px 18px;
  font-family:var(--font-m);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--t1);box-shadow:0 0 24px rgba(157,107,255,.5);display:none;}
#toast.show{display:block;animation:toast .25s ease;}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

/* ─── Family tree ancestor card ─── */
.gen-card{padding:10px 12px;margin-bottom:7px;background:var(--s2);border:1px solid var(--b1);
  border-radius:var(--r);font-size:12px;}
.gen-card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.gen-card-n{color:var(--t1);font-weight:700;}
.gen-card-y{font-family:var(--font-m);font-size:9.5px;color:var(--t3);letter-spacing:.08em;}
.gen-card-occ{font-family:var(--font-m);font-size:9.5px;color:var(--accent2);
  letter-spacing:.1em;text-transform:uppercase;}
.gen-card-wealth{font-family:var(--font-m);font-size:11px;color:var(--green);font-weight:600;margin-top:3px;}

/* ─── Responsive ─── */
@media (max-width:1200px){
  #main{grid-template-columns:240px 1fr 280px;}
}
@media (max-width:1000px){
  #main{grid-template-columns:200px 1fr;}
  .col-r{display:none;}
}
@media (max-width:720px){
  #main{grid-template-columns:1fr;}
  .col-l{display:none;}
  .intro-title{font-size:54px;}
}

/* ─── Home Scene (Virtual Families-style visual house) ─── */
#home-scene-wrap{position:relative;flex-shrink:0;background:#0a0a14;}
#home-scene{position:relative;height:180px;overflow:hidden;
  background:linear-gradient(180deg,#1a2540 0%,#2a3a5a 40%,#1a2030 55%,#0a0a14 100%);
  border-bottom:1px solid var(--b1);transition:height .3s ease;}
#home-scene.collapsed{height:0;border-bottom:none;}
.hs-sky{position:absolute;left:0;right:0;top:0;height:55%;
  background:radial-gradient(ellipse at 80% 0%, rgba(255,200,100,.18), transparent 50%),
             linear-gradient(180deg,#1a2540,#2a3a5a);}
.hs-sky::before{content:'⭐';position:absolute;top:12px;right:50px;font-size:8px;opacity:.5;}
.hs-sky::after{content:'☁️';position:absolute;top:20px;left:30%;font-size:18px;opacity:.4;
  animation:hs-cloud 80s linear infinite;}
@keyframes hs-cloud{from{transform:translateX(0);}to{transform:translateX(120vw);}}
.hs-house{position:absolute;left:0;right:0;bottom:30%;height:35%;
  background:linear-gradient(180deg,#3a2818 0%,#4a3020 50%,#3a2820 100%);
  border-top:6px solid #5a3018;border-image:linear-gradient(90deg,#3a2018,#7a4020,#3a2018) 1;}
.hs-house::before{content:'';position:absolute;left:20%;top:-20px;width:30px;height:20px;
  background:#1a1018;}
.hs-house::after{content:'';position:absolute;left:60%;top:-30px;width:60px;height:30px;
  background:#1a1018;border-radius:3px 3px 0 0;}

.hs-pet{position:absolute;bottom:0;font-size:22px;line-height:1;transition:left 1.5s linear;}
.hs-pet.bouncing{animation:hs-bounce 1.2s infinite;}
@keyframes hs-bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.hs-decor-item{position:absolute;bottom:0;font-size:24px;line-height:1;opacity:.85;

.hs-toggle{position:absolute;top:6px;right:8px;width:22px;height:22px;

  padding:2px 6px;border-radius:2px;pointer-events:none;text-transform:uppercase;}

<!-- ═══ Intro / Character Creation ═══ -->
<div id="intro">

    <div class="intro-field">

    </div>

          <option value="f">Female</option>
        </select>
      </div>

        <div class="intro-label">Name (or leave blank for random)</div>
        <input class="intro-input" id="intro-name" placeholder="Random" maxlength="30">
      </div>
    </div>
    <button class="intro-start" onclick="startNewLife()">Begin Life</button>
    <button class="intro-start" style="background:var(--b2);font-size:11px;letter-spacing:.18em;"
            onclick="continueLife()" id="intro-continue" style="display:none">
      Continue Saved Life
    </button>
  </div>
</div>

<!-- ═══ Game UI ═══ -->
<div id="topbar" style="display:none">
  <div>
    <span class="brand">Lyfe</span><span class="brand-by">— The Simulation</span><span class="brand-by-wd">by WindowDoom</span>
    <span class="brand-sub">v1</span>
  </div>
  <div class="tb-spacer"></div>
  <div class="tb-chip country" id="tb-country">🇺🇸 USA</div>
  <div class="tb-chip age" id="tb-age">Age 0</div>
  <div class="tb-chip money" id="tb-money">$0</div>
  <div class="tb-chip" id="tb-networth" title="Net worth — cash + savings + investments + real estate + companies + house + car + trust">Net $0</div>
  <button class="tb-btn" onclick="openFamilyTree()">Family Tree</button>
  <button class="tb-btn warn" onclick="confirmRestart()">New Life</button>
</div>

<div id="main" style="display:none">
  <!-- LEFT: character + stats -->
  <div class="col col-l">
    <div class="col-head">You</div>
    <div class="col-body">
      <div class="char-card">
        <div class="char-avatar" id="char-avatar">👶</div>
        <div class="char-name" id="char-name">—</div>
        <div class="char-occ" id="char-occ">Newborn</div>
        <div class="char-loc" id="char-loc">—</div>
      </div>
      <div id="stats-block"></div>
    </div>
  </div>

  <!-- CENTER: home scene + timeline + actions -->
  <div class="col col-c">
    <div id="home-scene-wrap">

        <div class="hs-sky"></div>
        <div class="hs-house" id="hs-house"></div>
        <div class="hs-floor"></div>
        <div class="hs-actors" id="hs-actors"></div>

    <div id="timeline-wrap" style="padding:18px;flex:1;overflow-y:auto;">
      <div id="timeline"></div>
    </div>
    <div id="actions-bar"></div>
  </div>

  <!-- RIGHT: family + assets -->
  <div class="col col-r">
    <div class="col-head">Family · Assets</div>
    <div class="col-body" id="family-panel"></div>
  </div>
</div>

<!-- ═══ Modal ═══ -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">—</div>
      <button class="modal-x" onclick="closeModal()">Close</button>
    </div>
    <div class="modal-tabs" id="modal-tabs"></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ═══ Death Screen ═══ -->
<div id="death-screen">

  <div class="death-actions" id="death-actions"></div>
</div>

// Currency formatting helper
function fmtMoney(n){
  const cur = COUNTRIES[LIFE.char.country].cur;
  if(Math.abs(n) >= 1000000){ return (n<0?'−':'') + cur + (Math.abs(n)/1000000).toFixed(1) + 'M'; }
  if(Math.abs(n) >= 1000){ return (n<0?'−':'') + cur + (Math.abs(n)/1000).toFixed(1) + 'k'; }
  return (n<0?'−':'') + cur + Math.abs(n).toLocaleString();
}

// Roll a forced-labor event for an at-risk child (poverty + young age)
function rollForcedLaborEvent(){
  const c = LIFE.char;
  if(!c) return;
  // Only fire for children in low-income contexts
  const country = COUNTRIES[c.country];
  if(!country) return;
  const inPoverty = country.salaryMult < 0.50 || (c.parents && c.parents.dad && /^Unemployed|Farm|Labor/i.test(c.parents.dad.occupation||''));
  if(c.age >= 18) return;
  if(!inPoverty) return;
  if(c.flags && c.flags.forcedLaborSeen) return;
  // Low probability — this is a rare, life-defining tragedy, not background noise
  if(Math.random() > 0.012) return;
  const eligible = FORCED_LABOR_EVENTS.filter(e =>
    c.age >= e.minAge && c.age <= e.maxAge);
  if(!eligible.length) return;
  const ev = eligible[Math.floor(Math.random()*eligible.length)];
  if(!GS_isSafeMode()){
    queueForcedLaborEvent(ev);
  }
}

// Player can disable difficult-content events from a settings toggle (default: enabled)
function GS_isSafeMode(){
  try { return localStorage.getItem('lyfe_safeMode') === '1'; } catch(e){ return false; }
}
function setSafeMode(v){
  try { localStorage.setItem('lyfe_safeMode', v ? '1' : '0'); } catch(e){}
}

let _pendingForcedLaborEvent = null;
function queueForcedLaborEvent(ev){
  _pendingForcedLaborEvent = ev;
  // Open as an event-decision modal (re-uses existing life-event UI if available)
  setTimeout(() => playForcedLaborEvent(ev), 200);
}

function playForcedLaborEvent(ev){
  const c = LIFE.char;
  const overlay = document.getElementById('life-event-overlay');
  const box = document.getElementById('life-event-box');
  if(!overlay || !box){
    // Fallback: apply first option silently and log the event
    if(ev.choices && ev.choices[0]){
      applyForcedLaborChoice(ev, 0);
    }
    return;
  }
  box.innerHTML =
    '<div class="le-tag dark">CHILDHOOD · HUMAN-RIGHTS WARNING</div>'
    + '<div class="le-title">A Dangerous Moment</div>'
    + '<div class="le-setting">' + ev.text + '</div>'
    + '<div class="le-choices" id="le-choices-block-fl">'
    + ev.choices.map((ch, i) => {
        const fx = ch.fx || {};
        const eff = [];
        if(fx.health)    eff.push('<span class="le-eff ' + (fx.health<0?'neg':'pos') + '">Health ' + (fx.health>0?'+':'') + fx.health + '</span>');
        if(fx.happiness) eff.push('<span class="le-eff ' + (fx.happiness<0?'neg':'pos') + '">Happiness ' + (fx.happiness>0?'+':'') + fx.happiness + '</span>');
        if(fx.smarts)    eff.push('<span class="le-eff ' + (fx.smarts<0?'neg':'pos') + '">Smarts ' + (fx.smarts>0?'+':'') + fx.smarts + '</span>');
        if(fx.karma)     eff.push('<span class="le-eff ' + (fx.karma<0?'neg':'pos') + '">Karma ' + (fx.karma>0?'+':'') + fx.karma + '</span>');
        return '<button class="le-choice" onclick="applyForcedLaborChoice(_pendingForcedLaborEvent, ' + i + ')">'
          + ch.label
          + (eff.length ? '<div class="le-effects">' + eff.join('') + '</div>' : '')
          + '</button>';
      }).join('')
    + '</div>';
  overlay.classList.add('show');
}

function applyForcedLaborChoice(ev, idx){
  const c = LIFE.char;
  const choice = ev.choices[idx];
  if(!choice){ closeForcedLaborEvent(); return; }
  const fx = choice.fx || {};
  if(fx.health    != null) c.health    = clamp(c.health + fx.health, 0, 100);
  if(fx.happiness != null) c.happiness = clamp(c.happiness + fx.happiness, 0, 100);
  if(fx.smarts    != null) c.smarts    = clamp(c.smarts + fx.smarts, 0, 100);
  if(fx.karma     != null) c.karma     = clamp(c.karma + fx.karma, 0, 100);
  if(fx.money) c.money += fx.money;
  if(choice.addTrait){
    if(!c.traits) c.traits = [];
    if(!c.traits.includes(choice.addTrait)) c.traits.push(choice.addTrait);
  }
  // Mark so a child can't experience multiple of these in a single childhood
  c.flags = c.flags || {};
  c.flags.forcedLaborSeen = true;
  if(typeof pushEvent === 'function'){
    pushEvent('death', 'A childhood ordeal: ' + choice.result);
  }
  // Replace choices with result text
  const block = document.getElementById('le-choices-block-fl');
  if(block){
    block.innerHTML = '<div class="le-result"><div class="le-result-h">Survivor\'s Aftermath</div>' + choice.result + '</div>'
      + '<button class="le-cont" onclick="closeForcedLaborEvent()">Continue</button>';
  }
  saveLife();
}
function closeForcedLaborEvent(){
  const ov = document.getElementById('life-event-overlay');
  if(ov) ov.classList.remove('show');
  _pendingForcedLaborEvent = null;
  if(typeof renderAll === 'function') renderAll();
}

// Adult perpetrator event — fires for low-karma adults rarely
function rollTraffickingAdultEvent(){
  const c = LIFE.char;
  if(!c || c.age < 22 || c.age > 75) return;

  if(Math.random() > 0.004) return;
  c.flags = c.flags || {};
  c.flags.trafficking_seen = true;
  // Reuse same modal flow
  queueForcedLaborEvent(TRAFFICKING_ADULT_EVENT);
}

function rollAlternateReality(){

  if(c.age !== 16) return;

let _pendingRealityFork = false;
function offerRealityFork(){
  if(_pendingRealityFork) return;
  _pendingRealityFork = true;
  let html = '<div style="color:var(--accent2);font-size:13px;margin-bottom:14px;text-align:center;font-style:italic;">'

      + '<div class="card-body"><div class="card-title">' + r.name + '</div>'

      + '</div>'

}

function pickReality(k){
  const c = LIFE.char;
  c.reality = k;
  const r = REALITIES[k];
  pushEvent('milestone', '⚡ You chose the ' + r.name + '. ' + r.desc);
  if(r.unlocks.length){
    pushEvent('milestone', '🔓 Unlocked careers: ' + r.unlocks.join(', '));
  }
  _pendingRealityFork = false;
  closeModal();
  renderAll();
  saveLife();
}

function makePerson(country, sex, ageRange){
  const c = country;
  const s = sex || (Math.random()<0.5?'m':'f');
  const fname = pickRand(NAMES[c][s]);
  const lname = pickRand(NAMES[c].l);
  return {
    firstName: fname,
    lastName:  lname,
    sex:       s,
    age:       ageRange ? rangeRand(ageRange[0], ageRange[1]) : 30,
    occupation: pickRand(PARTNER_OCCUPATIONS).title,
    alive:     true,
  };
}
function pickRand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rangeRand(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

function makeSeed(country, sex, customName){
  let firstName, lastName;
  if(customName && customName.trim()){
    const parts = customName.trim().split(/\s+/);
    firstName = parts[0];
    lastName  = parts.slice(1).join(' ') || pickRand(NAMES[country].l);
  } else {
    firstName = pickRand(NAMES[country][sex]);
    lastName  = pickRand(NAMES[country].l);
  }
  const mom = makePerson(country, 'f', [28,42]);
  const dad = makePerson(country, 'm', [28,48]);
  // children share dad's last name typically
  lastName = dad.lastName;
  mom.lastName = dad.lastName;
  // 0-3 siblings
  const sibCount = Math.random() < 0.3 ? 0 : Math.random() < 0.7 ? 1 : Math.random() < 0.9 ? 2 : 3;
  const siblings = [];
  for(let i=0; i<sibCount; i++){
    const sib = makePerson(country, null, [0,18]);
    sib.lastName = dad.lastName;
    siblings.push(sib);
  }
  return {
    firstName, lastName, sex, country,
    city: pickRand(CITIES[country]),
    parents: { mom, dad },
    siblings,
  };
}

function saveLife(){
  try { localStorage.setItem('lyfe_save', JSON.stringify(LIFE)); } catch(e){}
}
function loadLife(){
  try {
    const s = localStorage.getItem('lyfe_save');
    if(s){
      LIFE = JSON.parse(s);
      // Migrate old saves — fill missing fields so new code paths don't crash
      if(LIFE && !LIFE.world){
        LIFE.world = { economyHealth:60, peaceIndex:70, climateScore:55, ideology:0,
          techLevel:50, marsColonized:false, agiAchieved:false, ww3Happened:false,
          stablecoinIssued:false };
      }
      if(LIFE && !LIFE.legacy) LIFE.legacy = [];
      if(LIFE && LIFE.char){
        const c = LIFE.char;
        if(!c.traits) c.traits = [];
        if(!c.diseases) c.diseases = [];
        if(!c.degrees) c.degrees = [];
        if(!c.kids && c.children) c.kids = c.children;
        if(!c.children) c.children = [];
        if(!c.placesVisited) c.placesVisited = [];
        if(!c.bodyMods) c.bodyMods = [];
        if(!c.addictions) c.addictions = [];
        if(!c.surgeries) c.surgeries = [];
        if(!c.flags) c.flags = {};
        if(!c.pets) c.pets = [];
        if(!c.skills) c.skills = {};
        if(!c.friends) c.friends = [];
        if(!c.affairsHistory) c.affairsHistory = [];
        if(!c.neighbors) c.neighbors = {};
        if(c.fertility == null) c.fertility = 'normal';
        if(c.faith == null) c.faith = 30;
        if(c.fame == null) c.fame = 0;
        if(c.savings == null) c.savings = 0;
        if(c.investments == null) c.investments = 0;
        if(c.trust == null) c.trust = 0;
        if(!c.insurance) c.insurance = {home:false, health:false, life:false, auto:false};
        if(!c.properties) c.properties = [];
        if(!c.companies) c.companies = [];
        if(!c.hustles) c.hustles = {};
      }
      return true;
    }
  } catch(e){ console.error('loadLife failed:', e.message); }
  return false;
}

function pushBirthEvents(){
  const c = LIFE.char;
  const country = COUNTRIES[c.country];
  // Assign 2 random personality traits at birth (no conflicts: opt vs pess, intro vs extro)
  const conflicting = { optimist:'pessimist', pessimist:'optimist', introvert:'extrovert', extrovert:'introvert', generous:'greedy', greedy:'generous' };
  const pool = TRAITS.slice().sort(() => Math.random() - 0.5);
  const picked = [];
  for(const t of pool){
    if(picked.length >= 2) break;
    if(picked.some(p => conflicting[p.id] === t.id)) continue;
    picked.push(t);
  }
  c.traits = picked.map(t => t.id);
  // Assign fertility profile and inherited genetic diseases
  assignFertilityProfile();
  assignGeneticDiseases();
  pushEvent('milestone',
    'You were born in ' + c.city + ', ' + country.name + '. '
    + 'Your parents are ' + c.parents.mom.firstName + ' (' + c.parents.mom.occupation + ') '
    + 'and ' + c.parents.dad.firstName + ' (' + c.parents.dad.occupation + '). '
    + (c.siblings.length === 0 ? 'You are an only child.' :
       'You have ' + c.siblings.length + ' sibling' + (c.siblings.length>1?'s':'') + '.'));
  pushEvent('milestone',
    'Starting stats: Smarts ' + c.smarts + ' · Health ' + c.health + ' · Looks ' + c.looks
    + '. You are a ' + (c.sex==='m'?'baby boy':'baby girl') + '.');
  pushEvent('milestone', '✨ Personality traits: ' + picked.map(t => t.ico + ' ' + t.name).join(' · '));
}

function applyTraitDrifts(){
  const c = LIFE.char;
  if(!c.traits) return;
  for(const tid of c.traits){
    if(tid === 'optimist')   c.happiness = clamp(c.happiness + 2, 0, 100);
    if(tid === 'pessimist')  c.happiness = clamp(c.happiness - 1, 0, 100);
    if(tid === 'introvert' && c.age % 2 === 0)   c.smarts = clamp(c.smarts + 1, 0, 100);
    if(tid === 'extrovert' && c.age % 2 === 0)   c.looks  = clamp(c.looks + 1, 0, 100);
    if(tid === 'athletic' && c.age > 8)  c.health = clamp(c.health + 1, 0, 100);
    if(tid === 'brainy' && c.age > 5)    c.smarts = clamp(c.smarts + 1, 0, 100);
    if(tid === 'charismatic' && c.age > 12) c.looks = clamp(c.looks + 1, 0, 100);
  }
}

function processRooms(){
  const c = LIFE.char;
  if(!c.rooms || !c.rooms.length) return;
  c.rooms.forEach(rid => {
    const r = ROOMS.find(x => x.id === rid);
    if(!r || !r.passive) return;
    if(r.passive.health)    c.health    = clamp(c.health + r.passive.health, 0, 100);
    if(r.passive.happiness) c.happiness = clamp(c.happiness + r.passive.happiness, 0, 100);
    if(r.passive.smarts)    c.smarts    = clamp(c.smarts + r.passive.smarts, 0, 100);
    if(r.passive.looks)     c.looks     = clamp(c.looks + r.passive.looks, 0, 100);
    if(r.passive.faith)     c.faith     = clamp(c.faith + r.passive.faith, 0, 100);
  });
}

function processPets(){
  const c = LIFE.char;
  if(!c.pets || !c.pets.length) return;
  c.pets.forEach(pet => {
    if(!pet.alive) return;
    pet.age++;
    const p = PETS.find(x => x.id === pet.id);
    if(!p) return;
    // monthly cost x 12
    c.money -= Math.floor(p.monthly * 12 * (COUNTRIES[c.country].costMult || 1));
    // passive happiness/karma/etc
    if(p.fx.happiness) c.happiness = clamp(c.happiness + p.fx.happiness, 0, 100);
    if(p.fx.karma)     c.karma     = clamp(c.karma + p.fx.karma, 0, 100);
    if(p.fx.health)    c.health    = clamp(c.health + p.fx.health, 0, 100);
    if(p.fx.looks)     c.looks     = clamp(c.looks + p.fx.looks, 0, 100);
    if(p.fx.fame)      c.fame      = clamp((c.fame||0) + p.fx.fame, 0, 100);
    // death check
    if(pet.age >= p.span){
      pet.alive = false;
      pushEvent('death', '🕯️ Your ' + p.name.toLowerCase() + ' ' + pet.name + ' passed away after ' + pet.age + ' good years.');
      c.happiness = clamp(c.happiness - 8, 0, 100);
    }
  });
}

function pushEvent(tag, text, fx){
  const c = LIFE.char;
  let yearBlock = c.timeline[c.timeline.length-1];
  if(!yearBlock || yearBlock.age !== c.age){
    yearBlock = { age: c.age, year: c.born + c.age, events: [] };
    c.timeline.push(yearBlock);
  }
  yearBlock.events.push({ tag: tag, text: text, fx: fx||null });
  saveLife();
}

function ageUp(){
  if(!LIFE || !LIFE.char || !LIFE.char.alive) return;
  const c = LIFE.char;
  c.age++;
  const eventsBeforeRoll = (c.timeline[c.timeline.length-1] && c.timeline[c.timeline.length-1].age === c.age)
    ? c.timeline[c.timeline.length-1].events.length : 0;
  // age siblings, parents, partner, kids
  ageOthers();
  // automatic milestone for this age
  fireAutoMilestone();
  // career progression
  if(c.career) processCareer();
  // degree progression
  if(c.degree) processDegree();
  // money: salary - expenses
  processFinances();
  // random life event(s)
  rollLifeEvents();
  // At-risk forced-labor events for children in extreme poverty (rare).
  // Adult-perpetrator temptation event for low-karma adults (rare).
  // Both can be disabled via Safe Mode setting.
  rollForcedLaborEvent();
  rollTraffickingAdultEvent();
  // Real-estate portfolio tick — appreciation, condition, rent income, maintenance
  processRealEstate();
  // Companies tick — revenue growth, dividends, market shifts
  processCompanies();
  // child raising events
  rollChildEvents();
  // partner events
  rollPartnerEvents();
  // alternate-reality fork check
  rollAlternateReality();
  // housing disasters
  rollHousingDisaster();
  // apocalypse events for alt-realities
  rollApocalypseEvent();
  // banking interest tick
  processBankingInterest();
  processSideHustles();
  // faith decay/practice
  rollFaithEvent();
  // personality drift
  applyTraitDrifts();
  // room passive bonuses
  processRooms();
  // pets aging + cost + bonus
  processPets();
  // friends: aging, friendship drift, occasional new friend
  ageFriendsAndDrift();
  generateFriendIfNeeded();
  // addictions cost you money + health each year
  processAddictionsYearly();
  // genetic diseases tick health/happiness drift after onset age
  processGeneticDiseases();
  // annual taxes from the government
  processTaxes();
  // cultural festival / holiday flavor
  rollCulturalEvent();
  // residency counter for immigration
  if(c.birthCountry && c.country !== c.birthCountry){
    c.residencyYears = (c.residencyYears||0) + 1;
    if(c.residencyYears === 5){
      pushEvent('milestone', '🛂 You\'ve been in ' + COUNTRIES[c.country].name + ' for 5 years — now a naturalized citizen.');
      c.happiness = clamp(c.happiness + 10, 0, 100);
    }
  }
  // stat natural decay/growth
  applyAgeDrift();
  // Pad the year with a "quiet year" entry if nothing happened so every year is visible
  const lastBlock = c.timeline[c.timeline.length-1];
  if(!lastBlock || lastBlock.age !== c.age || lastBlock.events.length === 0){
    const flavor = pickRand(QUIET_YEAR_LINES);
    pushEvent('', flavor);
  }
  // death check
  if(!checkDeath()){
    renderAll();
    saveLife();
  }
}

  'A quiet year. Nothing of note.',
  'Life went on as usual.',
  'You blinked and the year was over.',
  'Same routine. Coffee. Work. Sleep.',
  'A year of steady, ordinary days.',
  'No drama, no disasters. You\'ll take it.',
  'The seasons turned. You aged.',
  'You spent the year keeping your head down.',
  'A year so ordinary you barely remember it.',

function ageOthers(){
  const c = LIFE.char;
  const country = COUNTRIES[c.country];
  // parents
  ['mom','dad'].forEach(p => {
    const par = c.parents[p];
    if(par && par.alive){
      par.age++;
      // chance to die after life expectancy
      if(par.age > country.lifeExp - 5){
        const chance = 0.04 + (par.age - country.lifeExp) * 0.02;
        if(Math.random() < chance){
          par.alive = false;
          pushEvent('death', 'Your ' + (p==='mom'?'mother':'father') + ' ' + par.firstName + ' passed away at age ' + par.age + '.');
          c.happiness = Math.max(0, c.happiness - 25);
          if(p==='mom' && !c.flags.momDeath){ c.flags.momDeath = true; c.money += 20000; pushEvent('milestone', 'You inherited ' + fmtMoney(20000) + ' from your mother.'); }
          if(p==='dad' && !c.flags.dadDeath){ c.flags.dadDeath = true; c.money += 15000; pushEvent('milestone', 'You inherited ' + fmtMoney(15000) + ' from your father.'); }
        }
      }
    }
  });
  // siblings
  c.siblings.forEach(s => { if(s.alive) s.age++; });
  // partner
  if(c.partner && c.partner.alive !== false) c.partner.age++;
  // children
  c.children.forEach(k => { if(k.alive) k.age++; });
}

function fireAutoMilestone(){
  const c = LIFE.char;
  const ms = LIFE_EVENTS.filter(e => e.auto && e.age === c.age);
  ms.forEach(m => {
    applyEvent(m);
  });
}

function processDegree(){
  const c = LIFE.char;
  c.degreeYearsLeft--;
  if(c.degreeYearsLeft <= 0){
    const d = DEGREES[c.degree];
    pushEvent('milestone', 'You graduated with your ' + d.name + '!');
    c.smarts = Math.min(100, c.smarts + 6);
    c.degrees.push(c.degree);
    c.degree = null;
    c.degreeYearsLeft = 0;
  }
}

function processCareer(){
  const c = LIFE.char;
  // Quick-job path: flat salary, no promotion logic, no risk
  if(c.career.quickJobId){
    c.career.totalYears++;
    c.career.yearsAtRung++;
    // 20-year veteran bonus on the same quick job
    if(c.career.totalYears === 20){
      c.career.currentSalary = Math.floor(c.career.currentSalary * 1.25);
      pushEvent('career', '🎖️ 20-year veteran bonus — +25% salary for sticking with it.');
    }
    return;
  }
  const cr = CAREERS[c.career.key];
  if(!cr) return;
  const rung = cr.rungs[c.career.rungIdx];
  c.career.yearsAtRung++;
  c.career.totalYears++;
  // 20-year veteran bonus
  if(c.career.totalYears === 20){
    c.career.currentSalary = Math.floor(c.career.currentSalary * 1.25);
    pushEvent('career', '🎖️ 20 years in the field — your salary jumped 25% for tenure.');
  }
  // performance ratings each year — promotion needs both years served AND stat thresholds
  // Real-world promotions: harder. Only attempts after full rung.years served.
  if(c.career.yearsAtRung >= rung.years && c.career.rungIdx < cr.rungs.length - 1){
    const nextRung = cr.rungs[c.career.rungIdx + 1];
    const needS = nextRung.minSmarts || 0;
    const needL = nextRung.minLooks  || 0;
    const needH = nextRung.minHealth || 0;
    // Roll a "performance review": only promotes if stats AND a luck roll succeed
    const meetsStats = c.smarts >= needS && c.looks >= needL && c.health >= needH;
    // Prestige careers (politician, judge, CEO) require harder rolls
    const prestige = rung.prestige || 5;
    const promoteChance = meetsStats ? Math.min(0.85, 0.35 + (c.smarts - needS)/60) : 0;
    if(Math.random() < promoteChance){
      c.career.rungIdx++;
      c.career.yearsAtRung = 0;
      const newRung = cr.rungs[c.career.rungIdx];
      c.career.currentSalary = Math.floor(newRung.salary * COUNTRIES[c.country].salaryMult);
      pushEvent('career', '🎉 Promoted to ' + newRung.title + '! New salary: ' + fmtMoney(c.career.currentSalary) + '/yr');
      c.happiness = Math.min(100, c.happiness + 10);
    } else if(c.career.yearsAtRung > rung.years + 4){
      // Got passed over — small morale hit
      if(c.career.yearsAtRung % 4 === 0){
        pushEvent('career', '😤 Passed over for promotion again. Frustration mounts.');
        c.happiness = Math.max(0, c.happiness - 4);
      }
    }
  }
  // criminal career — risk of getting caught
  if(cr.illegal){
    const caught = 0.04 + c.career.rungIdx * 0.015;
    if(Math.random() < caught){
      goToJail(2 + Math.floor(Math.random()*5), 'crime');
    }
  }
  // athlete retirement check
  if(rung.retireAt && c.age >= rung.retireAt){
    pushEvent('career', 'You retired from your athletic career at age ' + c.age + '.');
    c.career = null;
  }
  // happy bonus passive
  if(rung.happyBonus){
    c.happiness = Math.min(100, c.happiness + rung.happyBonus);
  }
}

function processFinances(){
  const c = LIFE.char;
  // salary in (teen jobs included — already part of c.career if they applied)
  let income = 0;
  if(c.career && !c.inJail){
    income = c.career.currentSalary;
    c.money += income;
  }
  // Children under 18 live with parents — no housing or living expenses
  if(c.age < 18){
    // Floor money at 0 so they never start adult life in debt from minor years
    if(c.money < 0) c.money = 0;
    return;
  }
  // housing
  const house = HOUSES.find(h => h.id === c.houseId) || HOUSES[0];
  const country = COUNTRIES[c.country];
  const housingAnnual = house.monthly * 12 * country.costMult;
  // living expenses scale with age + house status
  const livingAnnual = Math.floor((14000 + house.status*1800) * country.costMult);
  c.money -= Math.floor(housingAnnual + livingAnnual);
  // car maintenance
  const car = CARS.find(x => x.id === c.carId);
  if(car && car.status >= 6){ c.money -= Math.floor(2400 * country.costMult); }
  // kids cost
  c.children.forEach(k => {
    if(k.alive && k.age < 22){ c.money -= Math.floor(11000 * country.costMult); }
  });
}

function rollLifeEvents(){
  const c = LIFE.char;
  if(c.inJail) return;
  // Up to 2 random events per year
  const tries = 2;
  for(let i=0; i<tries; i++){
    const pool = LIFE_EVENTS.filter(e =>
      !e.auto &&
      e.minAge != null &&
      c.age >= e.minAge && c.age <= e.maxAge &&
      (!e.oneShot || !c.flags[e.oneShot]) &&
      (!e.requires || meetsRequires(e.requires))
    );
    if(!pool.length) continue;
    // pick weighted by probability
    const ev = pool[Math.floor(Math.random()*pool.length)];
    if(Math.random() < (ev.prob||0.04)){
      applyEvent(ev);
      if(ev.oneShot) c.flags[ev.oneShot] = true;
    }
  }
}

function meetsRequires(req){
  const c = LIFE.char;
  if(req.smarts && c.smarts < req.smarts) return false;
  if(req.health && c.health < req.health) return false;
  if(req.looks && c.looks < req.looks) return false;
  if(req.money && c.money < req.money) return false;
  if(req.career && !c.career) return false;
  if(req.houseOwned && (c.houseId === 'family' || c.houseId === 'studio')) return false;
  if(req.realityIs && c.reality !== req.realityIs) return false;
  return true;
}

function applyEvent(ev){
  const c = LIFE.char;
  const fx = ev.fx || {};
  if(fx.happiness){ c.happiness = clamp(c.happiness + fx.happiness, 0, 100); }
  if(fx.health){    c.health    = clamp(c.health + fx.health,       0, 100); }
  if(fx.smarts){    c.smarts    = clamp(c.smarts + fx.smarts,       0, 100); }
  if(fx.looks){     c.looks     = clamp(c.looks + fx.looks,         0, 100); }
  if(fx.karma){     c.karma     = clamp(c.karma + fx.karma,         0, 100); }
  if(fx.money){     c.money    += fx.money; }
  if(ev.money){     c.money    += ev.money; }
  pushEvent(ev.tag||'', ev.text, fx);
}

function rollChildEvents(){
  const c = LIFE.char;
  c.children.forEach(k => {
    if(!k.alive) return;
    // milestones
    if(k.age === 1) pushEvent('milestone', '👶 ' + k.name + ' took their first steps.');
    if(k.age === 5) pushEvent('milestone', '🎒 ' + k.name + ' started kindergarten.');
    if(k.age === 13) pushEvent('romantic', '🎂 ' + k.name + ' became a teenager.');
    if(k.age === 18) pushEvent('milestone', '🎓 ' + k.name + ' graduated high school.');
    if(k.age === 22) pushEvent('milestone', '💼 ' + k.name + ' moved out and started their career.');
  });
}

function rollPartnerEvents(){
  const c = LIFE.char;
  if(!c.partner) return;
  // random tiny ups and downs
  if(Math.random() < 0.15){
    c.partner.compat = clamp(c.partner.compat + (Math.random()<0.5?-3:+3), 0, 100);
  }
  // divorce chance if compat is low
  if(c.partner.married && c.partner.compat < 25){
    const country = COUNTRIES[c.country];
    if(Math.random() < country.divorceRate * 0.15){
      pushEvent('romantic', '💔 ' + c.partner.firstName + ' filed for divorce. Assets were split.');
      c.money = Math.floor(c.money / 2);
      c.happiness = Math.max(0, c.happiness - 30);
      c.partner = null;
    }
  }
  // try-for-baby success only if active flag set elsewhere (manual via Relationships menu)
}

function applyAgeDrift(){
  const c = LIFE.char;
  // tiny natural decline after 30
  if(c.age > 30){
    if(c.age % 3 === 0) c.health = clamp(c.health - 1, 0, 100);
    if(c.age > 45 && c.age % 4 === 0) c.looks  = clamp(c.looks  - 1, 0, 100);
  }
  // jail year tick
  if(c.inJail){
    c.jailYearsLeft--;
    if(c.jailYearsLeft <= 0){
      c.inJail = false;
      pushEvent('milestone', '🔓 You were released from prison after serving your sentence.');
    }
  }
}

function checkDeath(){
  const c = LIFE.char;
  const country = COUNTRIES[c.country];
  const lifeExp = country.lifeExp + (c.isVampire ? 250 : 0);
  // Forced death conditions
  if(c.health <= 0){
    killCharacter('failing health');
    return true;
  }
  // Hard cap at 115 (no immortals except vampires)
  if(!c.isVampire && c.age >= 115){
    killCharacter('extreme old age');
    return true;
  }
  // Vampires can still die past 400
  if(c.isVampire && c.age >= 450){
    killCharacter('vampiric exhaustion');
    return true;
  }
  // Probabilistic death past life expectancy minus 12, ramps fast
  if(c.age >= lifeExp - 12){
    const overshoot = Math.max(0, c.age - lifeExp + 12);
    const baseChance = 0.02 + overshoot * 0.025; // ~2% at lifeExp-12, +2.5% per year over
    const healthMod = (100 - c.health) / 100;
    const chance = baseChance * (1 + healthMod * 1.5);
    if(Math.random() < chance){
      killCharacter('old age');
      return true;
    }
  }
  // Accidental death — slightly higher than before so it shows up
  if(c.age > 5 && Math.random() < 0.0015){
    killCharacter(pickRand(['a car accident','a sudden cardiac event','a freak accident','complications from a fall','an unexpected illness']));
    return true;
  }
  return false;
}

function killCharacter(cause){
  const c = LIFE.char;
  c.alive = false;
  c.cause = cause;
  pushEvent('death', '☠ You died at age ' + c.age + ' of ' + cause + '.');
  // archive to ancestors
  LIFE.ancestors.push({
    name: c.firstName + ' ' + c.lastName,
    born: c.born,
    died: c.born + c.age,
    occupation: c.career ? CAREERS[c.career.key].rungs[c.career.rungIdx].title : 'No career',
    finalWealth: c.money,
    country: c.country,
    cause: c.cause,
    generation: LIFE.generation,
    children: c.children.map(k => k.name).filter(Boolean),
  });
  saveLife();
  showDeathScreen();
  return true;
}

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

// Universal stat-effect applier — accepts shorthand keys like {happy:5} or full keys like {happiness:5}.
// Was missing in Lyfe, which silently broke cheating, baby drama, and dowry.
function applyFx(fx){
  if(!LIFE || !LIFE.char || !fx) return;
  const c = LIFE.char;
  const map = { happy:'happiness', happiness:'happiness',
                health:'health', smarts:'smarts', looks:'looks',
                karma:'karma', faith:'faith', fame:'fame',
                energy:'energy', hunger:'hunger',
                rapport:null };
  Object.keys(fx).forEach(k => {
    const target = map[k] !== undefined ? map[k] : k;
    if(target === null){
      // Rapport spreads across all unlocked NPCs (kept compatible with old code)
      if(typeof adjustRel === 'function' && typeof NPCS === 'object'){
        Object.keys(NPCS).forEach(n => adjustRel(n, Math.sign(fx[k])));
      }
      return;
    }
    if(target === 'money'){ c.money += fx[k]; return; }
    if(c[target] != null){
      c[target] = clamp(c[target] + fx[k], 0, 100);
    }
  });
}

// Age-gated dynamic action bar — progressive disclosure replaces the 20-button wall.
function renderActionBar(){
  const c = LIFE.char;
  const a = c.age;
  const bar = document.getElementById('actions-bar');
  if(!bar) return;
  const btns = [];
  btns.push({pri:1, lbl:'Age Up › <span style="opacity:.6;font-size:9px;">[Space]</span>', fn:'ageUp()'});
  // Activities + Family-ish always available (covers childhood)
  btns.push({lbl:'🏋️ Activities', fn:'openActivities()'});
  // Quick jobs unlocked at 13 (teen jobs), Career at 16+
  if(a >= 13 && a < 16) btns.push({lbl:'💼 Teen Jobs', fn:'openQuickJobs()'});
  if(a >= 16) btns.push({lbl:'💼 Career', fn:'openCareerHub()'});
  if(a >= 13 && c.career && c.career.key) btns.push({lbl:'🎯 Work Action', fn:'openCareerAction()'});
  if(a >= 13) btns.push({lbl:'💞 Relationships', fn:'openRelationships()'});
  if(a >= 14) btns.push({lbl:'🦹 Crime', fn:'openCrime()'});
  // School/college appears around HS/college age
  if(a >= 14) btns.push({lbl:'🎓 Education', fn:'openColleges()'});
  // Money + civic from adulthood
  if(a >= 16) btns.push({lbl:'🏦 Bank', fn:'openBanking()'});
  if(a >= 16) btns.push({lbl:'🏠 Assets', fn:'openShop()'});
  if(a >= 18) btns.push({lbl:'🏘️ Real Estate', fn:'openRealEstate()'});
  if(a >= 18) btns.push({lbl:'🏢 Companies', fn:'openCompanies()'});
  // Office of Power unlocks at 35 once the politician career has been entered
  if(a >= 35 && c.career && c.career.key === 'politician'){
    btns.push({lbl:'🏛️ Office of Power', fn:'openOfficeOfPower()'});
  }
  if(a >= 18) btns.push({lbl:'🏛️ Gov', fn:'openGovernment()'});
  // City + Faith for anyone who can leave the house
  if(a >= 6) btns.push({lbl:'🏙️ City', fn:'openCityMap()'});
  if(a >= 6) btns.push({lbl:'🕊️ Faith', fn:'openReligion()'});
  // More: always, hosts everything else (Prefs/Risky/Drama/Rituals/etc)
  btns.push({lbl:'✨ More', fn:'openMore()'});
  bar.innerHTML = btns.map(b =>
    '<button class="act-btn' + (b.pri?' primary':'') + '" onclick="' + b.fn + '">' + b.lbl + '</button>'
  ).join('');
}

function renderCharCard(){

  if(c.age >= 13) av = c.sex==='m' ? '🧒' : '🧒';
  if(c.age >= 18) av = c.sex==='m' ? '🧑' : '👩';
  if(c.age >= 40) av = c.sex==='m' ? '👨' : '👩';

    + '<div class="year-head"><span class="year-num">' + y.year + '</span>'
    + '<span class="year-age">Age ' + y.age + '</span></div>'
    + y.events.map(e => {
        const cls = 'year-event ' + (e.tag||'');

        if(e.fx){
          const parts = [];
          if(e.fx.happiness) parts.push('Happiness ' + (e.fx.happiness>0?'+':'') + e.fx.happiness);
          if(e.fx.health) parts.push('Health ' + (e.fx.health>0?'+':'') + e.fx.health);
          if(e.fx.smarts) parts.push('Smarts ' + (e.fx.smarts>0?'+':'') + e.fx.smarts);
          if(e.fx.looks) parts.push('Looks ' + (e.fx.looks>0?'+':'') + e.fx.looks);
          if(e.fx.karma) parts.push('Karma ' + (e.fx.karma>0?'+':'') + e.fx.karma);
          if(e.fx.money) parts.push((e.fx.money>0?'+':'') + fmtMoney(e.fx.money));
          if(parts.length) fxStr = '<div class="year-event-fx">' + parts.join(' · ') + '</div>';
        }
        return '<div class="' + cls + '">' + e.text + fxStr + '</div>';
      }).join('')
    + '</div>'
  )).join('') || '<div style="color:var(--t3);text-align:center;padding:40px;">Press Age Up to begin.</div>';
  // auto-scroll to top so newest year visible
  const tw = document.getElementById('timeline-wrap');
  if(tw) tw.scrollTop = 0;
}

function renderFamily(){
  const c = LIFE.char;
  const wrap = document.getElementById('family-panel');
  let html = '';

  // Partner section
  html += '<div class="fam-section"><div class="fam-section-h">Partner</div>';
  if(c.partner){
    const p = c.partner;
    const status = p.married ? '💍 Spouse' : '💕 Dating';
    const compatCls = p.compat >= 70 ? 'good' : p.compat <= 40 ? 'bad' : '';
    html += '<div class="fam-row">'
      + '<div class="fam-emoji">' + (p.sex==='m'?'🧔':'👩') + '</div>'
      + '<div class="fam-info"><div class="fam-name">' + p.firstName + ' ' + p.lastName + '</div>'
      + '<div class="fam-meta">' + status + ' · Age ' + p.age + '</div>'
      + '<div class="fam-meta">' + p.occupation + '</div>'
      + '<div class="fam-rel ' + compatCls + '">Compatibility ' + p.compat + '%</div>'
      + '</div></div>';
  } else {
    html += '<div class="fam-empty">No partner yet.</div>';
  }
  html += '</div>';

  // Children
  html += '<div class="fam-section"><div class="fam-section-h">Children</div>';
  if(c.children.length){
    html += c.children.map(k => {
      const av = !k.alive ? '🕯' : k.age < 1 ? '👶' : k.age < 13 ? '🧒' : k.age < 18 ? '🧑' : k.sex==='m'?'👨':'👩';
      return '<div class="fam-row ' + (k.alive?'':'fam-deceased') + '">'
        + '<div class="fam-emoji">' + av + '</div>'
        + '<div class="fam-info"><div class="fam-name">' + k.name + '</div>'
        + '<div class="fam-meta">Age ' + k.age + ' · ' + (k.sex==='m'?'Son':'Daughter') + '</div></div></div>';
    }).join('');
  } else {
    html += '<div class="fam-empty">No children.</div>';
  }
  html += '</div>';

  // Parents
  html += '<div class="fam-section"><div class="fam-section-h">Parents</div>';
  ['mom','dad'].forEach(p => {
    const par = c.parents[p];
    if(par){
      html += '<div class="fam-row ' + (par.alive?'':'fam-deceased') + '">'
        + '<div class="fam-emoji">' + (p==='mom'?'👩':'🧔') + '</div>'
        + '<div class="fam-info"><div class="fam-name">' + par.firstName + ' ' + par.lastName + '</div>'
        + '<div class="fam-meta">' + (par.alive?'Age '+par.age:'Deceased') + ' · ' + par.occupation + '</div>'
        + '</div></div>';
    }
  });
  html += '</div>';

  // Siblings
  if(c.siblings.length){
    html += '<div class="fam-section"><div class="fam-section-h">Siblings</div>';
    html += c.siblings.map(s => (
      '<div class="fam-row ' + (s.alive?'':'fam-deceased') + '">'
      + '<div class="fam-emoji">' + (s.sex==='m'?(s.age<18?'👦':'🧔'):(s.age<18?'👧':'👩')) + '</div>'
      + '<div class="fam-info"><div class="fam-name">' + s.firstName + ' ' + s.lastName + '</div>'
      + '<div class="fam-meta">' + (s.alive?'Age '+s.age:'Deceased') + ' · ' + s.occupation + '</div>'
      + '</div></div>'
    )).join('');
    html += '</div>';
  }

  // Personality traits
  if(c.traits && c.traits.length){
    html += '<div class="fam-section"><div class="fam-section-h">Personality</div>';
    c.traits.forEach(tid => {
      const t = TRAITS.find(x => x.id === tid);
      if(!t) return;
      html += '<div class="fam-row"><div class="fam-emoji">' + t.ico + '</div>'
        + '<div class="fam-info"><div class="fam-name">' + t.name + '</div>'
        + '<div class="fam-meta">' + t.desc + '</div></div></div>';
    });
    if(c.isVampire){
      html += '<div class="fam-row"><div class="fam-emoji">🧛</div>'
        + '<div class="fam-info"><div class="fam-name">Vampire</div>'
        + '<div class="fam-meta">Immortal. Aging slows. Thirsts.</div></div></div>';
    }
    html += '</div>';
  }
  // Genetic conditions
  if(c.diseases && c.diseases.length){
    html += '<div class="fam-section"><div class="fam-section-h">Genetic Profile</div>';
    c.diseases.forEach(did => {
      const d = GENETIC_DISEASES.find(x => x.id === did);
      if(!d) return;
      const onset = c.age >= d.onset;
      html += '<div class="fam-row"><div class="fam-emoji">' + d.ico + '</div>'
        + '<div class="fam-info"><div class="fam-name">' + d.name + (d.beneficial?' ✨':'') + '</div>'
        + '<div class="fam-meta">' + (onset?'Active':'Latent — onset at age '+d.onset) + '</div></div></div>';
    });
    html += '</div>';
  }
  // Fertility profile (only show once they're adult and partnered, or post-attempt)
  if(c.age >= 18 && c.fertility){
    const fertText = {
      infertile:'Medically infertile',
      low:'Low fertility',
      normal:'Normal fertility',
      high:'High fertility',
      multiparous:'Multiparous — prone to multiples',
    }[c.fertility] || 'Unknown';
    if(c.fertility !== 'normal'){
      html += '<div class="fam-section"><div class="fam-section-h">Fertility</div>'
        + '<div class="fam-row"><div class="fam-emoji">🧬</div>'
        + '<div class="fam-info"><div class="fam-name">' + fertText + '</div></div></div>'
        + '</div>';
    }
  }
  // Pets
  const alivePets = (c.pets || []).filter(p => p.alive);
  if(alivePets.length){
    html += '<div class="fam-section"><div class="fam-section-h">Pets</div>';
    alivePets.forEach(pet => {
      const p = PETS.find(x => x.id === pet.id);
      html += '<div class="fam-row"><div class="fam-emoji">' + (p?p.ico:'🐾') + '</div>'
        + '<div class="fam-info"><div class="fam-name">' + pet.name + '</div>'
        + '<div class="fam-meta">' + (p?p.name:'Pet') + ' · Age ' + pet.age + '</div></div></div>';
    });
    html += '</div>';
  }

  // Assets
  html += '<div class="fam-section"><div class="fam-section-h">Assets</div>';
  const house = HOUSES.find(h => h.id === c.houseId);
  html += '<div class="asset-card">'
    + '<div class="asset-name">🏠 ' + house.name + '</div>'
    + '<div class="asset-meta">' + (house.monthly ? fmtMoney(house.monthly) + '/mo · ' : '') + house.rooms + ' rooms · Status ' + house.status + '/10</div>'
    + (c.rooms && c.rooms.length ? '<div class="asset-meta" style="color:var(--accent2);margin-top:3px;">+' + c.rooms.length + ' upgrades</div>' : '')
    + '</div>';
  const car = CARS.find(x => x.id === c.carId);
  if(car){
    html += '<div class="asset-card">'
      + '<div class="asset-name">🚗 ' + car.name + '</div>'
      + '<div class="asset-meta">' + (car.mph ? car.mph + ' mph top speed · ' : '') + 'Status ' + car.status + '/10</div>'
      + '</div>';
  }
  if(c.savings > 0 || c.investments > 0){
    html += '<div class="asset-card">'
      + '<div class="asset-name">🏦 Bank</div>'
      + '<div class="asset-meta">Savings ' + fmtMoney(c.savings||0) + ' · Investments ' + fmtMoney(c.investments||0) + '</div>'
      + '</div>';
  }
  html += '</div>';

  wrap.innerHTML = html;
}

function openModal(title, body, tabs){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  const tabsWrap = document.getElementById('modal-tabs');
  if(tabs && tabs.length){
    tabsWrap.style.display = 'flex';
    tabsWrap.innerHTML = tabs.map((t,i) => (
      '<button class="modal-tab ' + (i===0?'active':'') + '" onclick="' + t.onclick + '">' + t.label + '</button>'
    )).join('');
  } else {
    tabsWrap.style.display = 'none';
    tabsWrap.innerHTML = '';
  }
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

//  OCCUPATION MENU — degrees + jobs
// ═══════════════════════════════════════════════════════════════════════
function openOccupation(){
  const c = LIFE.char;
  if(c.age < 13){ toast('You\'re too young to think about a career.'); return; }
  let html = '';

  // Current status
  if(c.career){
    if(c.career.quickJobId){
      html += '<div class="card" style="background:#1a1428;border-color:var(--accent);">'
        + '<div class="card-ico">' + (c.career.icon||'💼') + '</div>'
        + '<div class="card-body"><div class="card-title">' + c.career.title + '</div>'
        + '<div class="card-meta">Quick Job · ' + c.career.totalYears + ' years worked</div>'
        + '</div>'
        + '<div class="card-act"><div class="card-pay">' + fmtMoney(c.career.currentSalary) + '/yr</div>'
        + '<button class="card-btn danger" onclick="quitJob()">Quit</button></div></div>';
    } else {
      const cr = CAREERS[c.career.key];
      if(cr){
        const rung = cr.rungs[c.career.rungIdx];
        html += '<div class="card" style="background:#1a1428;border-color:var(--accent);">'
          + '<div class="card-ico">' + cr.icon + '</div>'
          + '<div class="card-body"><div class="card-title">' + rung.title + '</div>'
          + '<div class="card-meta">' + cr.name + ' · ' + c.career.totalYears + ' years total · ' + c.career.yearsAtRung + ' years at this rung</div>'
          + '</div>'
          + '<div class="card-act"><div class="card-pay">' + fmtMoney(c.career.currentSalary) + '/yr</div>'
          + '<button class="card-btn danger" onclick="quitJob()">Quit</button></div></div>';
      }
    }
    html += '<div style="margin:14px 0;color:var(--t3);font-size:12px;text-align:center;">You can quit and start a new career anytime.</div>';
  } else if(c.degree){
    const d = DEGREES[c.degree];
    html += '<div class="card" style="background:#1a1428;border-color:var(--accent);">'
      + '<div class="card-ico">📚</div>'
      + '<div class="card-body"><div class="card-title">' + d.name + '</div>'
      + '<div class="card-meta">' + c.degreeYearsLeft + ' years remaining</div>'
      + '</div>'
      + '<div class="card-act"><button class="card-btn danger" onclick="dropOut()">Drop Out</button></div></div>';
  }

  // Available career rungs (entry-level only — must work way up)
  html += '<div style="margin-top:16px;font-family:var(--font-m);font-size:10px;letter-spacing:.2em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;">Available Careers</div>';
  Object.keys(CAREERS).forEach(k => {
    const cr = CAREERS[k];
    if(c.career && c.career.key === k) return;
    // Reality gating: alt-reality careers locked unless player picked that reality
    if(cr.realityGate && c.reality !== cr.realityGate) return;
    const rung = cr.rungs[0];
    const reqDeg = cr.requiresDegree || rung.requiresDegree;
    const hasDeg = !reqDeg || c.degrees.includes(reqDeg);
    const meetsStats = (!rung.minSmarts || c.smarts >= rung.minSmarts)
                    && (!rung.minLooks  || c.looks  >= rung.minLooks)
                    && (!rung.minHealth || c.health >= rung.minHealth)
                    && (c.age >= 16);
    const eligible = hasDeg && meetsStats && !c.inJail;
    const reqs = [];
    if(rung.minSmarts) reqs.push('Smarts ' + rung.minSmarts + '+');
    if(rung.minLooks)  reqs.push('Looks ' + rung.minLooks + '+');
    if(rung.minHealth) reqs.push('Health ' + rung.minHealth + '+');
    if(reqDeg) reqs.push((hasDeg?'✓':'✗') + ' ' + DEGREES[reqDeg].name);
    if(cr.illegal) reqs.push('⚠ Illegal');
    const tags = reqs.map(r => '<span class="card-tag ' + (r.includes('Illegal')?'illegal':eligible?'':'locked') + '">' + r + '</span>').join(' ');
    const salary = Math.floor(rung.salary * COUNTRIES[c.country].salaryMult);
    html += '<div class="card">'
      + '<div class="card-ico">' + cr.icon + '</div>'
      + '<div class="card-body"><div class="card-title">' + rung.title + '</div>'
      + '<div class="card-meta">' + cr.name + ' · ' + (cr.illegal?'High risk':'Long-term path') + '</div>'
      + (tags ? '<div style="margin-top:5px;">' + tags + '</div>' : '')
      + '</div>'
      + '<div class="card-act"><div class="card-pay">' + fmtMoney(salary) + '/yr</div>'
      + '<button class="card-btn ' + (eligible?'':'muted') + '" ' + (eligible?'':'disabled') + ' onclick="acceptJob(\'' + k + '\')">Apply</button></div></div>';
  });

  // University
  html += '<div style="margin-top:16px;font-family:var(--font-m);font-size:10px;letter-spacing:.2em;color:var(--accent2);text-transform:uppercase;margin-bottom:10px;">University Programs</div>';
  if(c.age < 18){
    html += '<div style="color:var(--t3);padding:14px;text-align:center;">You must be at least 18 to enroll.</div>';
  } else {
    Object.keys(DEGREES).forEach(k => {
      if(c.degrees.includes(k)) return;
      if(c.degree === k) return;
      const d = DEGREES[k];
      const meetsS = c.smarts >= d.minSmarts;
      const cost = Math.floor(d.cost * COUNTRIES[c.country].costMult);
      const canAfford = c.money >= cost || c.money >= 0; // assume loans available
      html += '<div class="card">'
        + '<div class="card-ico">📚</div>'
        + '<div class="card-body"><div class="card-title">' + d.name + '</div>'
        + '<div class="card-meta">' + d.years + ' years · Min Smarts ' + d.minSmarts + (meetsS?' ✓':' ✗')
        + '</div></div>'
        + '<div class="card-act"><div class="card-pay neg">−' + fmtMoney(cost) + '</div>'
        + '<button class="card-btn ' + (meetsS && !c.degree?'':'muted') + '" '
        + (meetsS && !c.degree?'':'disabled') + ' onclick="enrollDegree(\'' + k + '\')">Enroll</button></div></div>';
    });
  }

  openModal('Occupation', html);
}

function acceptJob(key){
  const c = LIFE.char;
  const cr = CAREERS[key];
  const rung = cr.rungs[0];
  c.career = {
    key: key,
    rungIdx: 0,
    yearsAtRung: 0,
    totalYears: 0,
    currentSalary: Math.floor(rung.salary * COUNTRIES[c.country].salaryMult),
  };
  pushEvent('career', '💼 You started a new career as ' + rung.title + '. Salary: ' + fmtMoney(c.career.currentSalary) + '/yr');
  closeModal();
  renderAll();
  saveLife();
}

function quitJob(){
  const c = LIFE.char;
  if(c.career){
    const title = c.career.quickJobId
      ? c.career.title
      : (CAREERS[c.career.key] && CAREERS[c.career.key].rungs[c.career.rungIdx].title) || 'your job';
    pushEvent('career', '🚪 You quit your job as ' + title + '.');
    c.career = null;
    closeModal();
    renderAll();
    saveLife();
  }
}

function enrollDegree(k){
  const c = LIFE.char;
  const d = DEGREES[k];
  const cost = Math.floor(d.cost * COUNTRIES[c.country].costMult);
  c.money -= cost;
  c.degree = k;
  c.degreeYearsLeft = d.years;
  pushEvent('milestone', '📚 You enrolled in ' + d.name + '. Cost: −' + fmtMoney(cost) + ' (loans).');
  closeModal();
  renderAll();
  saveLife();
}

function dropOut(){
  const c = LIFE.char;
  if(c.degree){
    pushEvent('milestone', 'You dropped out of ' + DEGREES[c.degree].name + '.');
    c.degree = null;
    c.degreeYearsLeft = 0;
    closeModal();
    renderAll();
    saveLife();
  }
}

//  RELATIONSHIPS — dating, kids, family
// ═══════════════════════════════════════════════════════════════════════
let _datePool = [];
function openRelationships(){
  const c = LIFE.char;
  if(c.age < 13){ toast('Too young for that.'); return; }
  // Tab structure
  let html = renderRelationshipsTab('partner');
  openModal('Relationships', html, [
    { label:'Partner', onclick:'switchRelTab(\'partner\')' },
    { label:'Family', onclick:'switchRelTab(\'family\')' },
  ]);
}
function switchRelTab(t){
  document.getElementById('modal-body').innerHTML = renderRelationshipsTab(t);
  Array.from(document.querySelectorAll('.modal-tab')).forEach((b,i) => {
    b.classList.toggle('active', (t==='partner' && i===0) || (t==='family' && i===1));
  });
}

function renderRelationshipsTab(t){
  const c = LIFE.char;
  if(t === 'partner'){
    if(c.partner){
      return renderPartnerStatus();
    } else {
      // Generate fresh date pool if needed
      if(!_datePool.length){ generateDatePool(); }
      let html = '<div style="color:var(--t3);font-size:12px;margin-bottom:14px;text-align:center;">Potential matches in ' + c.city + '. Tap to interact.</div>';
      html += _datePool.map(renderDateCard).join('');
      html += '<button class="card-btn muted" style="width:100%;margin-top:10px;padding:10px;" onclick="generateDatePool();switchRelTab(\'partner\')">🔄 Refresh Matches</button>';
      return html;
    }
  } else {
    return renderFamilyTab();
  }
}

function generateDatePool(){
  const c = LIFE.char;
  _datePool = [];
  for(let i=0; i<5; i++){
    const sex = Math.random() < 0.7 ? (c.sex==='m'?'f':'m') : c.sex; // 70% opposite, 30% same
    const fname = pickRand(NAMES[c.country][sex]);
    const lname = pickRand(NAMES[c.country].l);
    const occ = pickRand(PARTNER_OCCUPATIONS);
    const partner = {
      firstName: fname,
      lastName:  lname,
      sex:       sex,
      age:       Math.max(18, c.age + rangeRand(-6, +8)),
      looks:     rangeRand(20, 95),
      smarts:    rangeRand(20, 95),
      occupation: occ.title,
      income:    Math.floor(occ.salary * COUNTRIES[c.country].salaryMult),
      compat:    rangeRand(20, 95),
      married:   false,
      yearsMet:  0,
      alive:     true,
    };
    _datePool.push(partner);
  }
}

function renderDateCard(p){
  const idx = _datePool.indexOf(p);
  const compatText = p.compat >= 80 ? 'You have great chemistry.'
                    : p.compat >= 60 ? 'You get along well.'
                    : p.compat >= 40 ? 'It\'s civil. Not magnetic.'
                    : 'Something is off between you.';
  return ''
    + '<div class="date-card">'
    + '  <div class="date-head">'
    + '    <div class="date-pic">' + (p.sex==='m'?'🧔':'👩') + '</div>'
    + '    <div>'
    + '      <div class="date-info-name">' + p.firstName + ' ' + p.lastName + '</div>'
    + '      <div class="date-info-meta">' + p.occupation + ' · Age ' + p.age + ' · ' + fmtMoney(p.income) + '/yr</div>'
    + '    </div>'
    + '  </div>'
    + '  <div class="date-stats">'
    + '    <div class="date-stat"><div class="date-stat-l">Looks</div><div class="date-stat-v" style="color:var(--pink)">' + p.looks + '</div></div>'
    + '    <div class="date-stat"><div class="date-stat-l">Smarts</div><div class="date-stat-v" style="color:var(--accent2)">' + p.smarts + '</div></div>'
    + '    <div class="date-stat"><div class="date-stat-l">Compat</div><div class="date-stat-v" style="color:' + (p.compat>=60?'var(--green)':p.compat>=40?'var(--gold)':'var(--crimson)') + '">' + p.compat + '%</div></div>'
    + '    <div class="date-stat"><div class="date-stat-l">Age</div><div class="date-stat-v">' + p.age + '</div></div>'
    + '  </div>'
    + '  <div class="date-compat">' + compatText + '</div>'
    + '  <div class="date-actions">'
    + '    <button class="card-btn muted" onclick="dateAction(' + idx + ',\'flirt\')">Flirt</button>'
    + '    <button class="card-btn" onclick="dateAction(' + idx + ',\'date\')">Take on Date</button>'
    + '    <button class="card-btn green" onclick="dateAction(' + idx + ',\'commit\')">Start Dating</button>'
    + '  </div>'
    + '</div>';
}

function dateAction(idx, action){
  const c = LIFE.char;
  const p = _datePool[idx];
  if(!p) return;
  if(action === 'flirt'){
    if(p.compat + c.looks/2 + Math.random()*30 > 80){
      p.compat = clamp(p.compat + 6, 0, 100);
      toast(p.firstName + ' smiled. (Compat +6)');
    } else {
      p.compat = clamp(p.compat - 3, 0, 100);
      toast(p.firstName + ' did not seem interested. (Compat −3)');
    }
  } else if(action === 'date'){
    c.money -= 80;
    if(p.compat + Math.random()*30 > 60){
      p.compat = clamp(p.compat + 10, 0, 100);
      toast('Great date with ' + p.firstName + '. (Compat +10)');
    } else {
      p.compat = clamp(p.compat - 5, 0, 100);
      toast('The date was awkward. (Compat −5)');
    }
  } else if(action === 'commit'){
    if(p.compat < 50){ toast(p.firstName + ' is not interested in committing.'); return; }
    c.partner = p;
    p.yearsMet = 0;
    pushEvent('romantic', '💕 You started dating ' + p.firstName + ' ' + p.lastName + '. Compatibility: ' + p.compat + '%');
    _datePool = [];
    switchRelTab('partner');
    renderAll();
    saveLife();
    return;
  }
  switchRelTab('partner');
}

function renderPartnerStatus(){
  const c = LIFE.char;
  const p = c.partner;
  let html = '<div class="date-card">'
    + '<div class="date-head">'
    + '  <div class="date-pic">' + (p.sex==='m'?'🧔':'👩') + '</div>'
    + '  <div>'
    + '    <div class="date-info-name">' + p.firstName + ' ' + p.lastName + '</div>'
    + '    <div class="date-info-meta">' + (p.married?'💍 Spouse':'💕 Dating') + ' · Age ' + p.age + ' · ' + p.occupation + '</div>'
    + '  </div></div>'
    + '<div class="date-stats">'
    + '  <div class="date-stat"><div class="date-stat-l">Looks</div><div class="date-stat-v" style="color:var(--pink)">' + p.looks + '</div></div>'
    + '  <div class="date-stat"><div class="date-stat-l">Smarts</div><div class="date-stat-v" style="color:var(--accent2)">' + p.smarts + '</div></div>'
    + '  <div class="date-stat"><div class="date-stat-l">Compat</div><div class="date-stat-v" style="color:' + (p.compat>=60?'var(--green)':p.compat>=40?'var(--gold)':'var(--crimson)') + '">' + p.compat + '%</div></div>'

    + '</div>'
    + '<div class="date-actions">';
  if(!p.married){
    html += '<button class="card-btn green" onclick="proposeMarriage()">💍 Propose</button>';
    html += '<button class="card-btn muted" onclick="goOnDate()">Date Night (−$80)</button>';
    html += '<button class="card-btn" onclick="tryForBabyPremarital()">👶 Try for Baby (Pre-marital)</button>';
  } else {
    html += '<button class="card-btn muted" onclick="goOnDate()">Date Night (−$80)</button>';
    html += '<button class="card-btn green" onclick="tryForBaby()">Try for Baby</button>';
    html += '<button class="card-btn danger" onclick="initiateDivorce()">Divorce</button>';
  }
  html += '</div></div>';
  return html;
}

function goOnDate(){
  const c = LIFE.char;
  c.money -= 80;
  if(Math.random() < 0.7){
    c.partner.compat = clamp(c.partner.compat + 5, 0, 100);
    c.happiness = clamp(c.happiness + 3, 0, 100);
    toast('Lovely night. Compat +5');
  } else {
    c.partner.compat = clamp(c.partner.compat - 3, 0, 100);
    toast('Fight at the restaurant. Compat −3');
  }
  switchRelTab('partner');
  renderAll();
  saveLife();
}

function proposeMarriage(){
  const c = LIFE.char;
  const p = c.partner;
  if(p.compat < 60){ toast(p.firstName + ' said no. Compat too low.'); p.compat = clamp(p.compat - 8, 0, 100); switchRelTab('partner'); return; }
  c.money -= 8000;
  p.married = true;
  pushEvent('romantic', '💍 You married ' + p.firstName + ' ' + p.lastName + '. Wedding cost ' + fmtMoney(8000) + '.');
  c.happiness = clamp(c.happiness + 18, 0, 100);
  switchRelTab('partner');
  renderAll();
  saveLife();
}

function tryForBaby(){
  const c = LIFE.char;
  const p = c.partner;
  if(c.children.length >= 8){ toast('Eight kids is enough.'); return; }
  const success = Math.random() < (c.age < 35 ? 0.55 : c.age < 45 ? 0.25 : 0.08);
  if(success){
    const babySex = Math.random() < 0.5 ? 'm' : 'f';
    const babyName = prompt('You\'re having a baby ' + (babySex==='m'?'boy':'girl') + '! What\'s their name?', pickRand(NAMES[c.country][babySex]));
    if(babyName === null) return;
    c.children.push({
      name: babyName || pickRand(NAMES[c.country][babySex]),
      sex: babySex,
      age: 0,
      alive: true,
      lastName: c.lastName,
      smarts: Math.floor((c.smarts + p.smarts)/2 + rangeRand(-10,10)),
      looks:  Math.floor((c.looks + p.looks)/2 + rangeRand(-10,10)),
      health: rangeRand(60, 95),
    });
    pushEvent('milestone', '👶 ' + c.partner.firstName + ' gave birth to a baby ' + (babySex==='m'?'boy':'girl') + ', ' + (babyName||'') + '.');
    c.money -= 8000;
    c.happiness = clamp(c.happiness + 22, 0, 100);
  } else {
    toast('No luck this year.');
  }
  switchRelTab('partner');
  renderAll();
  saveLife();
}

function initiateDivorce(){
  const c = LIFE.char;
  if(!confirm('Initiate divorce? Assets will be split.')) return;
  pushEvent('romantic', '💔 You divorced ' + c.partner.firstName + '. Assets were split 50/50.');
  c.money = Math.floor(c.money / 2);
  c.happiness = clamp(c.happiness - 25, 0, 100);
  c.partner = null;
  switchRelTab('partner');
  renderAll();
  saveLife();
}
