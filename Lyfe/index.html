//  FERTILITY — barren / multiparity / twins / triplets
// ═══════════════════════════════════════════════════════════════════════
function assignFertilityProfile(){
  const c = LIFE.char;
  // Default normal fertility
  const roll = Math.random();
  if(roll < 0.06){ c.fertility = 'infertile'; }    // 6% cannot conceive
  else if(roll < 0.12){ c.fertility = 'low'; }     // 6% low fertility
  else if(roll < 0.85){ c.fertility = 'normal'; }  // 73% normal
  else if(roll < 0.95){ c.fertility = 'high'; }    // 10% high
  else { c.fertility = 'multiparous'; }            // 5% prone to twins/triplets
}

function getBabyOutcome(c){
  // Returns array of {sex} babies and odds/rolls
  const ageMod = c.age < 28 ? 1.0 : c.age < 35 ? 0.7 : c.age < 42 ? 0.3 : 0.08;
  const fert = c.fertility || 'normal';
  if(fert === 'infertile') return { success:false, msg:'Medically infertile — no conception possible.' };
  let conceiveChance =
    fert === 'low'         ? 0.18 * ageMod :
    fert === 'normal'      ? 0.45 * ageMod :
    fert === 'high'        ? 0.70 * ageMod :
    fert === 'multiparous' ? 0.55 * ageMod : 0.40;
  if(Math.random() >= conceiveChance) return { success:false, msg:'No luck this year.' };
  // Multiples?
  let count = 1;
  if(fert === 'multiparous'){
    const m = Math.random();
    if(m < 0.40) count = 2;
    else if(m < 0.55) count = 3;
    else if(m < 0.58) count = 4;
  } else if(Math.random() < 0.025){
    count = 2; // baseline twin rate
  }
  const babies = [];
  for(let i = 0; i < count; i++){
    babies.push({ sex: Math.random() < 0.5 ? 'm' : 'f' });
  }
  return { success:true, babies };
}

// Override tryForBaby to use new fertility outcomes
function tryForBaby(){
  const c = LIFE.char;
  const p = c.partner;
  if(!p){ toast('Need a partner first.'); return; }
  if(c.children && c.children.length >= 10){ toast('Ten kids is a lot.'); return; }
  const outcome = getBabyOutcome(c);
  if(!outcome.success){
    toast(outcome.msg);
    pushEvent('', '👶 ' + outcome.msg);
    closeModal();
    renderAll();
    saveLife();
    return;
  }
  outcome.babies.forEach((b, idx) => {
    const babyName = prompt('Baby ' + (idx+1) + '/' + outcome.babies.length + ' is a '
      + (b.sex==='m'?'boy':'girl') + '! Name them:', pickRand(NAMES[c.country][b.sex]));
    if(babyName === null) return;
    const inheritedDiseases = [];
    GENETIC_DISEASES.forEach(d => {
      if((c.diseases||[]).includes(d.id) && Math.random() < d.inherit){
        inheritedDiseases.push(d.id);
      }
    });
    c.children.push({
      name: babyName || pickRand(NAMES[c.country][b.sex]),
      sex: b.sex,
      age: 0,
      alive: true,
      lastName: c.lastName,
      smarts: Math.floor(((c.smarts + (p.smarts||60))/2) + rangeRand(-10,10)),
      looks:  Math.floor(((c.looks + (p.looks||60))/2) + rangeRand(-10,10)),
      health: rangeRand(60, 95),
      diseases: inheritedDiseases,
    });
  });
  const text = outcome.babies.length === 1
    ? '👶 ' + p.firstName + ' gave birth to a baby ' + (outcome.babies[0].sex==='m'?'boy':'girl') + '.'
    : '👶 ' + p.firstName + ' gave birth to ' + outcome.babies.length + ' babies' + (outcome.babies.length===3?' — triplets!':outcome.babies.length===2?' — twins!':' — quads!');
  pushEvent('milestone', text);
  c.money -= 8000 * outcome.babies.length;
  c.happiness = clamp(c.happiness + 22, 0, 100);
  closeModal();
  renderAll();
  saveLife();
}

    const fxParts = Object.keys(m.fx).map(k => '+' + m.fx[k] + ' ' + k).join(' · ');

function watchMovie(id, cost){
  const c = LIFE.char;
  const m = MOVIES.find(x => x.id === id);
  if(!m) return;
  c.money -= cost;
  Object.keys(m.fx).forEach(k => {
    if(k === 'happiness') c.happiness = clamp(c.happiness + m.fx[k], 0, 100);
    if(k === 'smarts')    c.smarts    = clamp(c.smarts + m.fx[k], 0, 100);
    if(k === 'health')    c.health    = clamp(c.health + m.fx[k], 0, 100);
  });
  pushEvent('good', '🎬 You saw ' + m.name + ' at the cinema.');
  closeModal();
  renderAll();
  saveLife();
}

  Object.keys(item.fx).forEach(k => {

//  TAXES — annual income, property, capital-gains
// ═══════════════════════════════════════════════════════════════════════
function processTaxes(){
  const c = LIFE.char;
  if(c.age < 18) return;
  const fis = fiscal(c.country);
  let taxes = 0;
  let breakdown = [];
  // Income tax on salary
  if(c.career && c.career.currentSalary > 0){
    const incomeT = Math.floor(c.career.currentSalary * fis.incomeTax);
    taxes += incomeT;
    breakdown.push('income ' + fmtMoney(incomeT));
  }
  // Property tax on owned home
  const house = HOUSES.find(h => h.id === c.houseId);
  if(house && house.price > 0){
    const country = COUNTRIES[c.country];
    const propT = Math.floor(house.price * country.costMult * fis.propertyTax);
    taxes += propT;
    breakdown.push('property ' + fmtMoney(propT));
  }
  // Capital-gains tax on investment growth (approximated yearly)
  // Already-realized gains we don't track precisely; approximate by 15% of recent investment yield
  if(c.investments > 0){
    const capG = Math.floor(c.investments * 0.008); // light approximation
    taxes += capG;
    breakdown.push('cap gains ' + fmtMoney(capG));
  }
  // Tax evasion check — if not enough cash, government audits
  if(taxes > 0){
    if(c.money >= taxes){
      c.money -= taxes;
      if(taxes > 2000){
        pushEvent('', '🏛️ Taxes paid: ' + fmtMoney(taxes) + ' (' + breakdown.join(' · ') + ').');
      }
    } else {
      // Can't pay — IRS audit + penalty
      const owed = taxes - Math.max(0, c.money);
      c.money -= taxes;
      c.happiness = Math.max(0, c.happiness - 6);
      pushEvent('bad', '🚨 You couldn\'t pay your taxes. The government took everything in your account and you owe ' + fmtMoney(owed) + '.');
      // Risk of jail for sustained tax evasion
      if(Math.random() < 0.04){
        pushEvent('bad', '⛓ You were convicted of tax evasion.');
        goToJail(rangeRand(1,3), 'tax evasion');
      }
    }
  }
}

function taxAdvice(){
  const c = LIFE.char;
  const fis = fiscal(c.country);
  const country = COUNTRIES[c.country];
  let total = 0;
  let detail = [];
  if(c.career && c.career.currentSalary > 0){
    const t = Math.floor(c.career.currentSalary * fis.incomeTax);
    detail.push('Income tax on ' + fmtMoney(c.career.currentSalary) + ': ' + fmtMoney(t));
    total += t;
  }
  const house = HOUSES.find(h => h.id === c.houseId);
  if(house && house.price > 0){
    const t = Math.floor(house.price * country.costMult * fis.propertyTax);
    detail.push('Property tax on home: ' + fmtMoney(t));
    total += t;
  }
  if(c.investments > 0){
    const t = Math.floor(c.investments * 0.008);
    detail.push('Capital gains (approx): ' + fmtMoney(t));
    total += t;
  }
  toast('Estimated taxes this year: ' + fmtMoney(total));
  pushEvent('', '📊 Your tax estimate: ' + fmtMoney(total) + ' (' + detail.join(' · ') + ').');
  closeModal();
  renderAll();
  saveLife();
}

function emigrate(toCountry){
  const c = LIFE.char;
  const fee = 8000;
  if(c.money < fee){ toast('Need ' + fmtMoney(fee) + ' for visa fees.'); return; }
  const fis = fiscal(toCountry);
  const dst = COUNTRIES[toCountry];
  const difficulty = fis.immigrationDifficulty;
  const approval = Math.max(0.02, (c.smarts - 30) / 100 * (1 - difficulty) + 0.1);
  if(Math.random() < approval){
    c.money -= fee;
    c.birthCountry = c.birthCountry || c.country;
    c.country = toCountry;
    c.city = pickRand(CITIES[toCountry]);
    c.residencyYears = 0;
    pushEvent('milestone', '🛂 Visa approved. You emigrated to ' + dst.name + ' and settled in ' + c.city + '.');
    c.happiness = clamp(c.happiness + 8, 0, 100);
  } else {
    c.money -= fee;
    pushEvent('bad', '🛂 Visa denied for ' + dst.name + '. Lost the ' + fmtMoney(fee) + ' application fee.');
    c.happiness = clamp(c.happiness - 6, 0, 100);
  }
  closeModal();
  renderAll();
  saveLife();
}

//  TRUST FUND — $10M+ option to lock wealth for next 2 generations
// ═══════════════════════════════════════════════════════════════════════
function setUpTrust(){
  const c = LIFE.char;
  const totalNetWorth = c.money + (c.savings||0) + (c.investments||0);
  if(totalNetWorth < 10000000){ toast('Trust funds require $10M+ in net worth.'); return; }
  if(c.trust){ toast('You already have a trust set up.'); return; }
  const fee = 50000;
  if(c.money < fee){ toast('Trust setup costs ' + fmtMoney(fee) + '.'); return; }
  c.money -= fee;
  c.trust = {
    amount: Math.floor((c.money + (c.savings||0) + (c.investments||0)) * 0.50),
    generations: 2,
    setUpAt: c.age,
  };
  // Move half the money into the trust (locked from taxes & creditors)
  const move = c.trust.amount;
  if(c.savings >= move){ c.savings -= move; }
  else { const rem = move - c.savings; c.savings = 0; c.money -= rem; }
  pushEvent('milestone', '🏛️ You set up a family trust with ' + fmtMoney(move) + '. It will pass tax-free to your descendants for 2 generations.');
  c.karma = clamp(c.karma + 3, 0, 100);
  closeModal();
  renderAll();
  saveLife();
}

//  INHERITANCE OVERHAUL — assets transfer, sibling distribution, court fights
// ═══════════════════════════════════════════════════════════════════════
function computeEstate(c){
  const fis = fiscal(c.country);
  const cash = c.money + (c.savings||0) + (c.investments||0);
  const house = HOUSES.find(h => h.id === c.houseId);
  const houseVal = (house && house.price > 0) ? Math.floor(house.price * (COUNTRIES[c.country].costMult||1) * 0.85) : 0;
  const car = CARS.find(x => x.id === c.carId);
  const carVal = (car && car.price > 0) ? Math.floor(car.price * 0.6) : 0;
  const trustVal = (c.trust && c.trust.amount) ? c.trust.amount : 0;
  // Estate tax only on non-trust assets
  const taxable = Math.max(0, (cash + houseVal + carVal) - fis.estateExempt);
  const tax = Math.floor(taxable * fis.estateTax);
  return { cash, houseVal, carVal, trustVal, tax, totalAfterTax: cash + houseVal + carVal - tax + trustVal, houseId:c.houseId, carId:c.carId };
}

// When the player chooses a child to continue as, the prior version was: liquidate, split cash only.
// New: enter inheritance decision flow with multiple living kids.
let _pendingInheritance = null;
function continueAs(kidName){
  const oldChar = LIFE.char;
  const liveKids = oldChar.children.filter(k => k.alive);
  if(liveKids.length === 0){ restartFromBirth(); return; }
  if(liveKids.length === 1){
    // Single heir — gets everything directly
    inheritAs(kidName, 'sole');
    return;
  }
  // Multiple heirs — show decision modal
  _pendingInheritance = { kidName: kidName };
  const estate = computeEstate(oldChar);
  let html = '<div style="padding:14px 18px;background:#1a1428;border:1px solid var(--accent);border-radius:6px;margin-bottom:14px;">'
    + '<div style="font-family:var(--font-m);font-size:10px;letter-spacing:.18em;color:var(--accent2);text-transform:uppercase;margin-bottom:8px;">Estate Summary</div>'
    + '<div style="font-size:13px;line-height:1.7;">'
    + 'Cash + savings + investments: ' + fmtMoney(estate.cash) + '<br>'
    + 'Home value: ' + fmtMoney(estate.houseVal) + '<br>'
    + 'Vehicle value: ' + fmtMoney(estate.carVal) + '<br>'
    + 'Trust (passes tax-free): ' + fmtMoney(estate.trustVal) + '<br>'
    + 'Estate tax owed: −' + fmtMoney(estate.tax) + '<br>'
    + '<b style="color:var(--green);">Total inheritable: ' + fmtMoney(estate.totalAfterTax) + '</b><br>'
    + 'Living heirs: ' + liveKids.length + '<br>'
    + '</div></div>'
    + '<div style="font-family:var(--font-m);font-size:10px;color:var(--accent2);letter-spacing:.22em;text-transform:uppercase;margin:14px 0 10px;">How should the estate be divided?</div>';
  html += '<div class="card" onclick="finalizeInheritance(\'equal\')" style="cursor:pointer;">'
    + '<div class="card-ico">🤝</div>'
    + '<div class="card-body"><div class="card-title">Equal Split Between Heirs</div>'
    + '<div class="card-meta">Each heir gets ' + fmtMoney(Math.floor(estate.totalAfterTax / liveKids.length)) + '. Clean. No litigation. Family stays intact.</div></div>'
    + '<div class="card-act"><button class="card-btn green">Choose</button></div></div>';
  html += '<div class="card" onclick="finalizeInheritance(\'court\')" style="cursor:pointer;">'
    + '<div class="card-ico">⚖️</div>'
    + '<div class="card-body"><div class="card-title">Court Fight Over the Estate</div>'
    + '<div class="card-meta">Legal fees consume 30% of the estate. You (as the chosen heir) win 55% of what remains, others split the rest. Siblings may resent you for life.</div></div>'
    + '<div class="card-act"><button class="card-btn danger">Fight</button></div></div>';
  html += '<div class="card" onclick="finalizeInheritance(\'leave_all\')" style="cursor:pointer;">'
    + '<div class="card-ico">📜</div>'
    + '<div class="card-body"><div class="card-title">Will Left Everything to Chosen Heir</div>'
    + '<div class="card-meta">Old character\'s will named ' + kidName + ' as sole heir. Other siblings get nothing. They will not forget.</div></div>'
    + '<div class="card-act"><button class="card-btn">Choose</button></div></div>';
  document.getElementById('death-screen').classList.remove('show');

function finalizeInheritance(mode){
  if(!_pendingInheritance) return;
  inheritAs(_pendingInheritance.kidName, mode);
  _pendingInheritance = null;
  closeModal();
}

function inheritAs(kidName, mode){
  const oldChar = LIFE.char;
  const kid = oldChar.children.find(k => k.name === kidName && k.alive);
  if(!kid){ restartFromBirth(); return; }
  const liveKids = oldChar.children.filter(k => k.alive);
  const estate = computeEstate(oldChar);

  let share = 0;
  let inheritsHouse = false;
  let inheritsCar = false;
  let resentment = 0;

  if(mode === 'sole' || liveKids.length === 1){
    share = estate.totalAfterTax;
    inheritsHouse = true;
    inheritsCar = true;
  } else if(mode === 'equal'){
    share = Math.floor(estate.totalAfterTax / liveKids.length);
    // Largest assets go to chosen heir, others get cash equivalent
    inheritsHouse = true;
    inheritsCar = true;
  } else if(mode === 'court'){
    const afterLegal = Math.floor(estate.totalAfterTax * 0.70);
    share = Math.floor(afterLegal * 0.55);
    inheritsHouse = true;
    inheritsCar = true;
    resentment = -25;
  } else if(mode === 'leave_all'){
    share = estate.totalAfterTax;
    inheritsHouse = true;
    inheritsCar = true;
    resentment = -40;
  }

  // Build the next-gen character
  const country = oldChar.country;
  const newSeed = {
    firstName: kid.name.split(' ')[0],
    lastName: kid.lastName || oldChar.lastName,
    sex: kid.sex,
    country: country,
    city: oldChar.city,
    parents: {
      mom: oldChar.sex==='f' ? {
        firstName:oldChar.firstName, lastName:oldChar.lastName, sex:'f',
        age:oldChar.age, occupation:'Deceased', alive:false,
        diseases: oldChar.diseases||[],
      } : (oldChar.partner ? {
        firstName:oldChar.partner.firstName, lastName:oldChar.partner.lastName, sex:'f',
        age:oldChar.partner.age, occupation:oldChar.partner.occupation, alive:!!oldChar.partner.alive,
      } : makePerson(country,'f',[40,55])),
      dad: oldChar.sex==='m' ? {
        firstName:oldChar.firstName, lastName:oldChar.lastName, sex:'m',
        age:oldChar.age, occupation:'Deceased', alive:false,
        diseases: oldChar.diseases||[],
      } : (oldChar.partner ? {
        firstName:oldChar.partner.firstName, lastName:oldChar.partner.lastName, sex:'m',
        age:oldChar.partner.age, occupation:oldChar.partner.occupation, alive:!!oldChar.partner.alive,
      } : makePerson(country,'m',[40,55])),
    },
    siblings: oldChar.children.filter(k => k.name !== kidName).map(s => ({
      firstName: s.name.split(' ')[0],
      lastName:  s.lastName || oldChar.lastName,
      sex: s.sex, age: s.age, occupation: 'Family',
      alive: s.alive,
      rapport: 50 + (resentment || 0),
    })),
    inheritance: share,
  };
  LIFE.generation++;
  const ch = defaultChar(newSeed);
  ch.age = kid.age;
  ch.smarts = kid.smarts || ch.smarts;
  ch.looks  = kid.looks  || ch.looks;
  ch.health = kid.health || ch.health;
  ch.money  = share;
  ch.born   = (new Date().getFullYear()) - ch.age;
  ch.diseases = kid.diseases || [];

  // Inherit real assets
  if(inheritsHouse && oldChar.houseId && oldChar.houseId !== 'family') ch.houseId = oldChar.houseId;
  if(inheritsCar && oldChar.carId && oldChar.carId !== 'none') ch.carId = oldChar.carId;
  // Trust pass-through
  if(oldChar.trust && oldChar.trust.generations > 0){
    ch.trust = {
      amount: oldChar.trust.amount,
      generations: oldChar.trust.generations - 1,
      setUpAt: oldChar.trust.setUpAt,
    };
    ch.money += ch.trust.amount;
  }
  // Rooms transfer if inheriting house
  if(inheritsHouse && oldChar.rooms){
    ch.rooms = oldChar.rooms.slice();
  }

  LIFE.char = ch;
  let modeText = '';
  if(mode === 'equal'){ modeText = 'The family agreed to an equal split — peace was kept.'; }
  else if(mode === 'court'){ modeText = 'The court fight cost the family 30% of the estate. Your siblings still aren\'t speaking to you.'; }
  else if(mode === 'leave_all'){ modeText = 'The will left you everything. Your siblings vowed never to speak to you again.'; }
  else { modeText = 'You inherited the estate as the only living heir.'; }
  pushEvent('milestone', '👑 You inherited ' + fmtMoney(share) + ' from ' + oldChar.firstName + ' ' + oldChar.lastName + '. ' + modeText
    + (inheritsHouse && oldChar.houseId !== 'family' ? ' You took over the family ' + (HOUSES.find(h=>h.id===oldChar.houseId)||{name:'home'}).name + '.' : '')
    + (oldChar.trust && oldChar.trust.generations > 0 ? ' The family trust passed to you, ' + (oldChar.trust.generations-1) + ' generation(s) of tax shelter remaining.' : ''));
  document.getElementById('death-screen').classList.remove('show');
  renderAll();
  saveLife();
}

}

function haveAffair(type){
  const c = LIFE.char;
  if(!c.partner) return;
  const params = {
    brief:    {happy:+10, karma:-12, discChance:0.20, compatLoss:25, secret:'You had a brief affair.'},
    long:     {happy:+18, karma:-20, discChance:0.45, compatLoss:45, secret:'You had a long-term affair partner.'},
    emotional:{happy:+8,  karma:-6,  discChance:0.15, compatLoss:15, secret:'You had an emotional affair.'},
  };
  const cfg = params[type] || params.brief;
  applyFx({happiness:cfg.happy, karma:cfg.karma});
  if(!c.affairsHistory) c.affairsHistory = [];
  c.affairsHistory.push({ type, atAge:c.age });
  c.flags = c.flags || {};
  c.flags.affair = true;
  // Discovery roll
  if(Math.random() < cfg.discChance){
    c.partner.compat = clamp(c.partner.compat - cfg.compatLoss, 0, 100);
    pushEvent('death', '💔 ' + c.partner.firstName + ' discovered your affair. Compatibility tanked.');
    if(c.partner.compat < 25 && Math.random() < 0.6){
      initiateDivorce();
      return;
    }
  } else {
    pushEvent('', '🙊 ' + cfg.secret + ' Not caught — yet.');
    if(typeof addSecret === 'function') addSecret(cfg.secret);
  }
  closeModal();
  renderAll();
  saveLife();
}

function computeChildSupport(kid){
  const c = LIFE.char;
  // ~17% of monthly income per child, scaled to country
  const monthly = ((c.career && c.career.currentSalary) || c.weeklySalary*52 || 50000) / 12;
  return Math.max(200, Math.floor(monthly * 0.17));
}

function payChildSupport(kidName){
  const c = LIFE.char;
  const k = (c.children||[]).find(x => x.name === kidName);
  if(!k) return;
  const amount = computeChildSupport(k);
  c.money -= amount * 12; // yearly
  pushEvent('career', '💸 Paid ' + fmtMoney(amount * 12) + ' in annual child support to ' + (k.otherParent || 'the other parent') + '.');
  closeModal();
  renderAll();
  saveLife();
}

function triggerBabyDrama(){
  const c = LIFE.char;
  const sex = Math.random() < 0.5 ? 'm' : 'f';
  const otherName = pickRand(NAMES[c.country] ? NAMES[c.country].f : NAMES.us.f) + ' ' + pickRand(NAMES[c.country] ? NAMES[c.country].l : NAMES.us.l);
  closeModal();
  openModal('👶 Unexpected Call',
    '<p style="font-family:var(--font-s);font-size:14px;line-height:1.6;">' + otherName + ' called. She says she\'s pregnant — and you\'re the father. DNA test pending. What do you do?</p>'
    + '<div class="btn-row" style="margin-top:14px;">'

    + '<button class="card-btn" onclick="babyDecide(\'dna\',\'' + otherName + '\',\'' + sex + '\')">Demand DNA Test ($800)</button>'
    + '<button class="card-btn red" onclick="babyDecide(\'deny\',\'' + otherName + '\',\'' + sex + '\')">Deny &amp; Fight</button>'
    + '</div>');
}

function babyDecide(mode, otherName, sex){
  const c = LIFE.char;
  closeModal();
  if(mode === 'accept'){
    const babyName = prompt('What\'s the baby\'s name?', pickRand(NAMES[c.country] ? NAMES[c.country][sex] : NAMES.us[sex]));
    if(babyName === null) return;
    c.children = c.children || [];
    c.children.push({
      name: babyName || 'Baby', sex, age: 0, alive: true,
      lastName: c.lastName,
      outOfWedlock: true,
      otherParent: otherName,
      smarts: rangeRand(40, 90), looks: rangeRand(40, 90), health: rangeRand(70, 95),
    });
    pushEvent('romantic', '👶 You accepted paternity of ' + (babyName||'a child') + ' with ' + otherName + '.');
    applyFx({happiness:+8, karma:+5});
    // Child support kicks in
    pushEvent('career', '💸 Child-support obligation begins: ~' + fmtMoney(computeChildSupport({age:0})) + '/mo');
  } else if(mode === 'dna'){
    c.money -= 800;
    if(Math.random() < 0.65){
      pushEvent('milestone', '🧬 The DNA test was positive. ' + otherName + ' awaits your response.');
      babyDecide('accept', otherName, sex);
    } else {
      pushEvent('good', '🧬 The DNA test was negative. You\'re off the hook.');
      applyFx({happiness:+10});
    }
  } else if(mode === 'deny'){
    if(Math.random() < 0.5){
      // Court orders DNA, found positive
      pushEvent('bad', '⚖️ The court ordered a paternity test. You\'re the father — and now you owe back-child-support.');
      const arrears = 25000 + Math.floor(Math.random()*40000);
      c.money -= arrears;
      pushEvent('bad', '💸 Back child support: ' + fmtMoney(arrears) + ' due immediately.');
      applyFx({karma:-8, happiness:-12});
    } else {
      pushEvent('', '⚖️ The case was dropped. You moved on.');
    }
  }
  renderAll();
  saveLife();
}

function negotiateDowry(){
  const c = LIFE.char;
  if(!c.partner){ toast('Need a partner first.'); return; }
  let html = '<p style="font-family:var(--font-s);font-size:13px;color:var(--t2);margin-bottom:14px;">'
    + 'A pre-marital financial obligation, depending on tradition. Higher amounts boost partner approval and signal commitment.</p>';
  const amounts = [3000, 8500, 18000, 35000, 75000];
  amounts.forEach(amt => {
    const can = c.money >= amt;
    html += '<div class="card"><div class="card-ico">💍</div>'
      + '<div class="card-body"><div class="card-title">' + fmtMoney(amt) + ' Mahr / Dowry</div>'
      + '<div class="card-meta">Partner compatibility +' + Math.floor(amt/2000) + '</div></div>'
      + '<div class="card-act"><button class="card-btn ' + (can?'green':'muted') + '" ' + (can?'':'disabled') + ' onclick="payDowry(' + amt + ')">Pay</button></div></div>';
  });
  openModal('💍 Set the Dowry / Mahr', html);
}

function payDowry(amt){
  const c = LIFE.char;
  if(c.money < amt){ toast('Not enough money.'); return; }
  c.money -= amt;
  c.partner.compat = clamp(c.partner.compat + Math.floor(amt/2000), 0, 100);
  if(!c.partner.dowryPaid) c.partner.dowryPaid = 0;
  c.partner.dowryPaid += amt;
  pushEvent('romantic', '💍 You paid ' + fmtMoney(amt) + ' as dowry. Partner approval rose.');
  applyFx({happiness:+8, karma:+3});
  closeModal();
  renderAll();
  saveLife();
}

function openReligiousCeremonies(){
  const c = LIFE.char;
  if(!c.religion){ toast('Adopt a religion first to access its ceremonies.'); return; }
  // Find matching law system
  const lawId = Object.keys(RELIGIOUS_LAWS).find(k => RELIGIOUS_LAWS[k].religion === c.religion);
  if(!lawId){ toast('No ceremonies catalogued for this religion.'); return; }
  const law = RELIGIOUS_LAWS[lawId];
  let html = '<p style="font-family:var(--font-s);font-size:13px;color:var(--accent2);margin-bottom:14px;text-transform:uppercase;letter-spacing:.18em;">'
    + law.ico + ' ' + law.name + '</p>';
  html += '<p style="font-family:var(--font-s);font-size:12px;color:var(--t3);margin-bottom:14px;font-style:italic;line-height:1.6;">'
    + 'Key tenets:<br>' + law.rules.map(r => '· ' + r).join('<br>') + '</p>';
  Object.keys(law.rituals).forEach(rid => {
    const r = law.rituals[rid];
    const can = c.money >= (r.cost || 0);
    const fxText = Object.keys(r.effect||{}).map(k => '+' + r.effect[k] + ' ' + k).join(' · ');
    html += '<div class="card"><div class="card-ico">' + r.ico + '</div>'
      + '<div class="card-body"><div class="card-title">' + r.name + '</div>'
      + '<div class="card-meta">' + r.desc + '</div>'
      + (fxText ? '<div class="card-meta" style="color:var(--green)">' + fxText + '</div>' : '')
      + '</div>'
      + '<div class="card-act">'
      + (r.cost ? '<div class="card-pay neg">−' + fmtMoney(r.cost) + '</div>' : '')
      + '<button class="card-btn ' + (can?'green':'muted') + '" ' + (can?'':'disabled') + ' onclick="performRitual(\'' + lawId + '\',\'' + rid + '\')">Perform</button>'
      + '</div></div>';
  });
  openModal('🕊️ Religious Ceremonies', html);
}

function performRitual(lawId, ritualId){
  const c = LIFE.char;
  const law = RELIGIOUS_LAWS[lawId];
  if(!law) return;
  const r = law.rituals[ritualId];
  if(!r) return;
  if(r.cost && c.money < r.cost){ toast('Not enough money.'); return; }
  if(r.cost) c.money -= r.cost;
  const fx = r.effect || {};
  Object.keys(fx).forEach(k => {
    if(c[k] != null){
      c[k] = clamp(c[k] + fx[k], 0, 100);
    }
  });
  pushEvent('milestone', r.ico + ' ' + r.name + ' completed.');
  closeModal();
  renderAll();
  saveLife();
}

// ─── SPONTANEOUS BABIES — kids arrive without manually trying ───
function rollSpontaneousBaby(){
  if(!LIFE || !LIFE.char) return;
  const c = LIFE.char;
  if(!c.partner) return;
  if(c.age < 18) return;
  if(c.children && c.children.length >= 10) return;
  if(c.fertility === 'infertile') return;
  // Birth-control flag check (if user explicitly turns it on, no babies)
  if(c.birthControl) return;
  // Married couples — much higher rate. Unmarried committed — lower.
  const ageMod = c.age < 30 ? 1.0 : c.age < 38 ? 0.55 : c.age < 44 ? 0.20 : 0.05;
  const fertMod = c.fertility === 'high' ? 1.4 : c.fertility === 'multiparous' ? 1.5 : c.fertility === 'low' ? 0.4 : 1.0;
  const marriedMod = (c.partner && c.partner.married) ? 1.0 : 0.35;
  const baseChance = 0.18 * ageMod * fertMod * marriedMod;
  if(Math.random() >= baseChance) return;
  // Multiples roll
  let count = 1;
  if(c.fertility === 'multiparous'){
    const m = Math.random();
    if(m < 0.40) count = 2;
    else if(m < 0.55) count = 3;
  } else if(Math.random() < 0.025){
    count = 2;
  }
  // Auto-generate names (no prompt — spontaneous = system picks)
  const babies = [];
  for(let i=0; i<count; i++){
    const sex = Math.random() < 0.5 ? 'm' : 'f';
    const pool = (typeof NAMES === 'object' && NAMES[c.country] && NAMES[c.country][sex]) ? NAMES[c.country][sex] : null;
    const name = pool ? pool[Math.floor(Math.random()*pool.length)] : (sex==='m'?'James':'Mary');
    const inheritedDiseases = [];
    if(typeof GENETIC_DISEASES !== 'undefined'){
      GENETIC_DISEASES.forEach(d => {
        if((c.diseases||[]).includes(d.id) && Math.random() < d.inherit){
          inheritedDiseases.push(d.id);
        }
      });
    }
    babies.push({
      name, sex, age:0, alive:true,
      lastName: c.lastName,
      smarts: Math.floor(((c.smarts + (c.partner.smarts||60))/2) + (Math.random()*20 - 10)),
      looks:  Math.floor(((c.looks + (c.partner.looks||60))/2) + (Math.random()*20 - 10)),
      health: 60 + Math.floor(Math.random()*35),
      diseases: inheritedDiseases,
    });
  }
  if(!c.children) c.children = [];
  c.children.push(...babies);
  c.money -= 8000 * babies.length;
  c.happiness = clamp(c.happiness + 18, 0, 100);
  const text = babies.length === 1
    ? '👶 SURPRISE: ' + c.partner.firstName + ' gave birth to a baby ' + (babies[0].sex==='m'?'boy':'girl') + ', ' + babies[0].name + '.'
    : '👶👶 SURPRISE: ' + c.partner.firstName + ' gave birth to ' + babies.length + ' babies — '
      + babies.map(b => b.name).join(', ') + '!';
  pushEvent('milestone', text);
}

// Birth-control toggle so the player has agency
function toggleBirthControl(){
  if(!LIFE || !LIFE.char) return;
  LIFE.char.birthControl = !LIFE.char.birthControl;
  pushEvent('milestone', LIFE.char.birthControl
    ? '💊 You started using birth control. No more spontaneous babies.'
    : '💞 You stopped using birth control.');
  saveLife();
  if(typeof renderAll === 'function') renderAll();
}

function ensureProducts(co){
  if(!co.products){
    const ind = co.industry;
    const pool = PRODUCT_TEMPLATES[ind] || ['Core Product Line'];
    const count = 1 + Math.floor(Math.random()*Math.min(3, pool.length));
    co.products = [];
    const shuffled = pool.slice().sort(() => Math.random() - 0.5);
    for(let i=0; i<count; i++){
      co.products.push({
        name: shuffled[i % shuffled.length],
        revShare: 1/count,
        growth: 0.02 + Math.random()*0.10,
        invested: Math.floor(co.revenue * 0.05),
      });
    }
  }
  if(!co.history) co.history = [];
}

    + '<div class="card-act"><button class="card-btn" onclick="coTreasuryRealEstate(\'' + co.cid + '\')">Allocate</button></div></div>';
  html += '<div class="card"><div class="card-ico">🪙</div>'
    + '<div class="card-body"><div class="card-title">Treasury → Crypto</div>'
    + '<div class="card-meta">High volatility. ~20% expected, ~40% variance.</div></div>'
    + '<div class="card-act"><button class="card-btn red" onclick="coTreasuryCrypto(\'' + co.cid + '\')">Allocate</button></div></div>';

  // INDUSTRY-SPECIFIC BIG MOVES — defined per-industry below in INDUSTRY_MOVES.
  const moves = (INDUSTRY_MOVES[co.industry] || []).filter(m => !m.requires || m.requires(co));
  if(moves.length){
    html += '<div style="font-family:var(--font-m);font-size:10px;color:var(--gold);letter-spacing:.22em;text-transform:uppercase;margin:18px 0 8px;">⚡ Industry Power Moves</div>';
    html += '<div style="background:#1a1428;border:1px solid var(--gold);border-radius:6px;padding:12px;margin-bottom:14px;">';
    moves.forEach((m, i) => {
      const affordable = !m.cost || LIFE.char.money >= m.cost;
      const done = m.once && co._moves && co._moves[m.id];
      html += '<div style="padding:10px;border-bottom:1px solid #2a1f3d;">'
        + '<div style="display:flex;justify-content:space-between;align-items:start;gap:10px;">'
        + '<div style="flex:1;">'
        + '<div style="font-weight:700;color:var(--accent2);font-size:13px;">' + m.label + '</div>'
        + '<div style="font-size:11px;color:var(--t3);margin-top:3px;line-height:1.45;">' + m.desc + '</div>'
        + (m.cost ? '<div style="font-size:10px;color:var(--gold);margin-top:4px;">Cost: ' + fmtMoney(m.cost) + '</div>' : '')
        + '</div>'
        + (done
            ? '<span style="font-size:10px;color:var(--green);align-self:center;">✓ DONE</span>'
            : '<button class="card-btn ' + (affordable?'green':'muted') + '" '
              + (affordable?'':'disabled') + ' style="align-self:center;flex:0 0 auto;" '
              + 'onclick="industryMove(\'' + cid + '\',\'' + m.id + '\')">Execute</button>')
        + '</div></div>';
    });
    html += '</div>';
  }

  html += '<button class="card-btn muted" style="width:100%;margin-top:12px;padding:10px;" onclick="closeModal();openCompanies();">← Back to Portfolio</button>';
  openModal(co.name + ' · ' + ind.name, html);
}

function industryMove(cid, moveId){
  const co = coFind(cid);
  if(!co) return;
  const moves = INDUSTRY_MOVES[co.industry] || [];
  const m = moves.find(x => x.id === moveId);
  if(!m) return;
  if(m.cost && LIFE.char.money < m.cost){ toast('Need ' + fmtMoney(m.cost) + '.'); return; }
  if(m.once && co._moves && co._moves[m.id]){ toast('Already done.'); return; }
  if(m.cost) LIFE.char.money -= m.cost;
  co._moves = co._moves || {};
  if(m.once) co._moves[m.id] = true;
  m.exec(co);
  saveLife();
  closeModal();
  openCompanyDetail(cid);
}

function recordLegacy(deed){
  if(!LIFE.legacy) LIFE.legacy = [];
  const c = LIFE.char;
  LIFE.legacy.push({
    gen: LIFE.generation,
    age: c.age,
    name: c.firstName + ' ' + c.lastName,
    deed,
    year: c.born + c.age,
  });
}

function executePoliticalMove(id){
  const m = POLITICAL_MOVES.find(x => x.id === id);
  if(!m) return;
  if(m.cost && LIFE.char.money < m.cost){ toast('Need ' + fmtMoney(m.cost) + '.'); return; }
  // The most consequential moves require explicit confirmation
  if(['order_genocide','authoritarian_turn','nuclear_test','launch_nuclear_war','start_war_for_contracts'].includes(id)){
    const ok = confirm(m.label + '\n\n' + m.desc + '\n\nThis is irreversible. Continue?');
    if(!ok) return;
  }
  if(m.cost) LIFE.char.money -= m.cost;
  m.exec();
  saveLife();
  closeModal();
  openOfficeOfPower();
}

function coInvestProduct(cid, idx){
  const co = coFind(cid); if(!co || !co.products) return;
  const cost = Math.floor(co.revenue * 0.04);
  if(LIFE.char.money < cost){ toast('Need ' + fmtMoney(cost) + '.'); return; }
  LIFE.char.money -= cost;
  co.products[idx].invested += cost;
  co.products[idx].growth = Math.min(0.40, co.products[idx].growth + 0.02);
  co.revenue = Math.floor(co.revenue * (1 + co.products[idx].growth * 0.30));
  pushEvent('career', '🔬 R&D investment of ' + fmtMoney(cost) + ' in ' + co.products[idx].name + '.');
  closeModal();
  openCompanyDetail(cid);
}
function coKillProduct(cid, idx){
  const co = coFind(cid); if(!co || !co.products) return;
  if(co.products.length <= 1){ toast('You need at least one product.'); return; }
  const killed = co.products.splice(idx, 1)[0];
  const remaining = co.products.length;
  co.products.forEach(p => { p.revShare = 1/remaining; });
  co.revenue = Math.floor(co.revenue * (1 - killed.revShare));
  pushEvent('career', '✂️ Killed ' + killed.name + ' at ' + co.name + '. Revenue contracted.');
  closeModal();
  openCompanyDetail(cid);
}
function coNewProduct(cid){
  const co = coFind(cid); if(!co) return;
  ensureProducts(co);
  const pool = PRODUCT_TEMPLATES[co.industry] || ['New Product Line'];
  const usedNames = co.products.map(p => p.name);
  const available = pool.filter(n => !usedNames.includes(n));
  if(!available.length){ toast('No new product templates available in this industry.'); return; }
  const cost = Math.floor(co.revenue * 0.08);
  if(LIFE.char.money < cost){ toast('Launching costs ' + fmtMoney(cost) + '.'); return; }
  LIFE.char.money -= cost;
  co.products.push({
    name: available[Math.floor(Math.random()*available.length)],
    revShare: 0.15,
    growth: 0.05 + Math.random()*0.10,
    invested: cost,
  });
  // Rebalance
  const oldTotal = co.products.slice(0,-1).reduce((s,p) => s + p.revShare, 0);
  co.products.slice(0,-1).forEach(p => { p.revShare = p.revShare * (0.85 / oldTotal); });
  co.revenue = Math.floor(co.revenue * 1.10);
  pushEvent('career', '🚀 Launched ' + co.products[co.products.length-1].name + ' at ' + co.name + '.');
  closeModal();
  openCompanyDetail(cid);
}

// Yearly treasury tick — index funds grow, crypto roller-coasters, real estate appreciates
function processCompanyTreasuries(){
  if(!LIFE || !LIFE.char || !LIFE.char.companies) return;
  LIFE.char.companies.forEach(co => {
    if(!co.treasury) return;
    if(co.treasury.index){
      const yield_ = Math.floor(co.treasury.index * (0.04 + Math.random()*0.08));
      co.treasury.index += yield_;
      co.cash = (co.cash||0) + Math.floor(yield_ * 0.3);
    }
    if(co.treasury.realestate){
      const yield_ = Math.floor(co.treasury.realestate * (0.04 + Math.random()*0.04));
      co.treasury.realestate += yield_;
      co.cash = (co.cash||0) + Math.floor(yield_ * 0.5); // rental income to cash
    }
    if(co.treasury.crypto){
      const swing = Math.random() < 0.5 ? -1 : 1;
      const delta = co.treasury.crypto * (Math.random() * 0.50 * swing);
      co.treasury.crypto = Math.max(0, Math.floor(co.treasury.crypto + delta));
    }
    // Push history quarterly
    if(!co.history) co.history = [];
    if(co.history.length >= 8) co.history.shift();
    co.history.push({
      q: 'Q' + (LIFE.char.age),
      rev: co.revenue,
      profit: Math.floor(co.revenue * co.profitMargin),
    });
    // Product growth tick
    if(co.products){
      co.products.forEach(p => {
        co.revenue = Math.floor(co.revenue * (1 + p.growth * 0.08 * p.revShare));
      });
    }
  });
}

// Roll spontaneous events: pick from both pools, sometimes fire multiple
function rollSpontaneousEvents(){
  if(!LIFE || !LIFE.char || !LIFE.char.alive) return;
  const c = LIFE.char;
  // Pool A: SPONTANEOUS_EVENTS — up to 3 per year
  for(let i=0; i<3; i++){
    const pool = SPONTANEOUS_EVENTS.filter(e => c.age >= e.minAge && c.age <= e.maxAge && (!e.requires || meetsRequires(e.requires)));
    if(!pool.length) break;
    const ev = pool[Math.floor(Math.random()*pool.length)];
    if(Math.random() < (ev.prob || 0.004)){
      applyEvent(ev);
    }
  }
  // Pool B: NEWS_EVENTS — up to 2 per year
  for(let i=0; i<2; i++){
    const pool = NEWS_EVENTS.filter(e => c.age >= e.minAge && c.age <= e.maxAge && (!e.requires || meetsRequires(e.requires)));
    if(!pool.length) break;
    const ev = pool[Math.floor(Math.random()*pool.length)];
    if(Math.random() < (ev.prob || 0.004)){
      applyEvent(ev);
    }
  }
}

// Hook everything into ageUp via a wrapper (defer to end of script so we don't TDZ)
const _origAgeUp = ageUp;
ageUp = function(){
  _origAgeUp.apply(this, arguments);
  // Run spontaneous systems AFTER the standard age-up loop
  rollSpontaneousBaby();
  rollSpontaneousEvents();
  processCompanyTreasuries();
};

applyMegaExpansion();
renderIntroCountries();
if(loadLife() && LIFE && LIFE.char){
  if(LIFE.char.alive){
    // Offer continue for a living character
    const cont = document.getElementById('intro-continue');
    if(cont){
      cont.style.display = 'block';
      cont.textContent = 'Continue: ' + LIFE.char.firstName + ' ' + LIFE.char.lastName + ' · Age ' + LIFE.char.age;
    }
  } else {
    // Character died but we never closed the death screen — show it now
    document.getElementById('intro').style.display = 'none';
    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('main').style.display = 'grid';
    renderAll();
    setTimeout(showDeathScreen, 100);
  }
}

// Keyboard shortcut: SPACE or ENTER to age up. Hold SHIFT+SPACE to fast-forward 5 years.
window.addEventListener('keydown', e => {
  // Don't intercept keys while typing in inputs or while intro/death screens are open
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if(!LIFE || !LIFE.char || !LIFE.char.alive) return;
  if(document.getElementById('intro').style.display !== 'none') return;
  if(document.getElementById('modal').classList.contains('show')) return;
  if(document.getElementById('death-screen').classList.contains('show')) return;
  if(e.key === ' ' || e.code === 'Space' || e.key === 'Enter'){
    e.preventDefault();
    if(e.shiftKey){
      // Hold shift: rip through 5 years
      for(let i = 0; i < 5 && LIFE.char && LIFE.char.alive; i++) ageUp();
    } else {
      ageUp();
    }
  }
});
