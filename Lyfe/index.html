function buyHouse(id){
  const c = LIFE.char;
  const h = HOUSES.find(x => x.id === id);
  const price = Math.floor(h.price * COUNTRIES[c.country].costMult);
  if(c.money < price){ toast('Not enough money.'); return; }
  c.money -= price;
  // Record into property portfolio
  ensureProperties();
  const wasFamily = (c.houseId === 'family');
  const prop = {
    pid: 'p' + Date.now() + '-' + Math.floor(Math.random()*9999),
    houseId: id,
    nickname: h.name,
    purchasedAt: c.age,
    purchasePrice: price,
    currentValue: price,
    isPrimary: wasFamily || c.properties.length === 0,
    rentedOut: false,
    monthlyRent: h.monthly ? Math.floor(h.monthly * COUNTRIES[c.country].costMult) : 0,
    occupied: false,
    tenant: null,
    developments: [],
    condition: 100,
    mortgageBalance: 0,
    mortgageMonthly: 0,
  };
  // First purchase becomes primary residence; older primary becomes investment
  if(prop.isPrimary){
    c.properties.forEach(p => { p.isPrimary = false; });
  }
  c.properties.push(prop);
  c.houseId = id; // keep for compatibility
  pushEvent('milestone', '🏠 You bought a ' + h.name + ' for ' + fmtMoney(price) + '.');
  closeModal();
  renderAll();
  saveLife();
}

function ensureProperties(){
  const c = LIFE.char;
  if(!c) return;
  if(!c.properties){
    c.properties = [];
    // Migrate the current single-house ownership into the portfolio
    if(c.houseId && c.houseId !== 'family'){
      const h = HOUSES.find(x => x.id === c.houseId);
      if(h){
        c.properties.push({
          pid:'p-legacy-' + Date.now(),
          houseId:c.houseId,
          nickname:h.name,
          purchasedAt: Math.max(18, c.age - 1),
          purchasePrice: Math.floor(h.price * (COUNTRIES[c.country]||COUNTRIES.us).costMult),
          currentValue: Math.floor(h.price * (COUNTRIES[c.country]||COUNTRIES.us).costMult),
          isPrimary:true,
          rentedOut:false,
          monthlyRent: h.monthly ? Math.floor(h.monthly * (COUNTRIES[c.country]||COUNTRIES.us).costMult) : 0,
          occupied:false, tenant:null,
          developments:[], condition:90,
          mortgageBalance:0, mortgageMonthly:0,
        });
      }
    }
  }
}

function reFind(pid){
  ensureProperties();
  return LIFE.char.properties.find(p => p.pid === pid);
}

function reMakePrimary(pid){
  const c = LIFE.char;
  const target = reFind(pid);
  if(!target) return;
  c.properties.forEach(p => { p.isPrimary = (p.pid === pid); if(p.pid === pid){ p.rentedOut = false; p.occupied = false; p.tenant = null; } });
  c.houseId = target.houseId;
  pushEvent('milestone', '🏠 You moved into ' + target.nickname + '. It is now your primary residence.');
  closeModal();
  openRealEstate();
  saveLife();
}

function reRentOut(pid){
  const p = reFind(pid);
  if(!p) return;
  if(p.isPrimary){ toast('Can\'t rent out your primary residence.'); return; }
  p.rentedOut = true;
  // Find a tenant — 70% chance on listing
  if(Math.random() < 0.70){
    p.occupied = true;
    p.tenant = {
      name: pickRand(['Alex Patel','Maria Garcia','James Smith','Yuki Tanaka','Hans Schmidt','Priya Kumar','Carlos Lopez','Emma Wilson']),
      leaseEnd: LIFE.char.age + 1 + Math.floor(Math.random()*3),
    };
    pushEvent('career', '🏠 You listed ' + p.nickname + ' for rent — tenant ' + p.tenant.name + ' signed a lease.');
  } else {
    p.occupied = false;
    p.tenant = null;
    pushEvent('career', '🏠 You listed ' + p.nickname + ' for rent — no takers yet.');
  }
  closeModal();
  openRealEstate();
  saveLife();
}

function reUnlist(pid){
  const p = reFind(pid);
  if(!p) return;
  p.rentedOut = false;
  if(p.tenant){
    // Break lease — pay tenant out
    LIFE.char.money -= Math.floor((p.monthlyRent||0) * 2);
    pushEvent('career', '📜 You broke ' + p.tenant.name + '\'s lease on ' + p.nickname + ' and paid 2 months\' relocation.');
  }
  p.occupied = false;
  p.tenant = null;
  closeModal();
  openRealEstate();
  saveLife();
}

function reDevelop(pid){
  const p = reFind(pid);
  if(!p) return;
  let html = '<p style="font-family:var(--font-s);font-size:13px;color:var(--t3);font-style:italic;margin-bottom:14px;">'
    + 'Renovations boost property value, rentability, and condition. Each one is a permanent upgrade.</p>';
  DEVELOPMENTS.forEach(d => {
    const already = p.developments.includes(d.id);
    const can = LIFE.char.money >= d.cost && !already;
    html += '<div class="card">'
      + '<div class="card-ico">' + d.ico + '</div>'
      + '<div class="card-body"><div class="card-title">' + d.name + (already?' · DONE':'') + '</div>'
      + '<div class="card-meta">+' + Math.floor(d.valueBoost*100) + '% value · +' + Math.floor(d.rentBoost*100) + '% rent · +' + d.condition + ' condition</div></div>'
      + '<div class="card-act"><div class="card-pay neg">−' + fmtMoney(d.cost) + '</div>'
      + (already
          ? '<span class="card-tag">COMPLETED</span>'
          : '<button class="card-btn ' + (can?'green':'muted') + '" ' + (can?'':'disabled') + ' onclick="reDoDevelopment(\'' + pid + '\',\'' + d.id + '\')">Build</button>')
      + '</div></div>';
  });
  openModal('🛠️ Develop: ' + p.nickname, html);
}

function reDoDevelopment(pid, devId){
  const p = reFind(pid);
  const d = DEVELOPMENTS.find(x => x.id === devId);
  if(!p || !d) return;
  if(LIFE.char.money < d.cost){ toast('Not enough money.'); return; }
  LIFE.char.money -= d.cost;
  p.developments.push(d.id);
  p.currentValue = Math.floor(p.currentValue * (1 + d.valueBoost));
  p.monthlyRent  = Math.floor(p.monthlyRent  * (1 + d.rentBoost));
  p.condition    = clamp(p.condition + d.condition, 0, 100);
  pushEvent('career', '🛠️ ' + d.name + ' done on ' + p.nickname + '. Value now ' + fmtMoney(p.currentValue) + '.');
  closeModal();
  reDevelop(pid);
  saveLife();
}

function reRepair(pid){
  const p = reFind(pid);
  if(!p) return;
  const cost = Math.floor((100 - p.condition) * 240);
  if(LIFE.char.money < cost){ toast('Repair would cost ' + fmtMoney(cost) + ' — not enough money.'); return; }
  LIFE.char.money -= cost;
  p.condition = 100;
  pushEvent('career', '🔧 You restored ' + p.nickname + ' to perfect condition for ' + fmtMoney(cost) + '.');
  closeModal();
  openRealEstate();
  saveLife();
}

function reSell(pid){
  const p = reFind(pid);
  if(!p) return;
  const salePrice = Math.floor(p.currentValue * 0.95); // 5% closing costs
  const gain = salePrice - p.purchasePrice;
  if(p.isPrimary && LIFE.char.properties.length === 1){
    // Selling your only home — back to "living with family"
    LIFE.char.houseId = 'family';
  } else if(p.isPrimary && LIFE.char.properties.length > 1){
    // Promote the next property to primary
    const next = LIFE.char.properties.find(x => x.pid !== p.pid && !x.rentedOut) || LIFE.char.properties.find(x => x.pid !== p.pid);
    if(next){ next.isPrimary = true; LIFE.char.houseId = next.houseId; }
  }
  LIFE.char.properties = LIFE.char.properties.filter(x => x.pid !== p.pid);
  LIFE.char.money += salePrice;
  const gainText = gain >= 0 ? 'capital gain ' + fmtMoney(gain) : 'loss ' + fmtMoney(Math.abs(gain));
  pushEvent('career', '💰 You sold ' + p.nickname + ' for ' + fmtMoney(salePrice) + ' — ' + gainText + '.');
  closeModal();
  openRealEstate();
  saveLife();
}

// Yearly tick — appreciation + condition decay + rent income + maintenance + tenant churn
function processRealEstate(){
  ensureProperties();
  const c = LIFE.char;
  if(!c.properties || !c.properties.length) return;
  const country = COUNTRIES[c.country];
  let totalRent = 0;
  let totalMaint = 0;
  c.properties.forEach(p => {
    // Appreciation: 2-6% per year + 1% per development tier
    const baseAppr = 0.02 + Math.random() * 0.04 + p.developments.length * 0.01;
    // High status properties appreciate slightly more, low-status less
    const h = HOUSES.find(x => x.id === p.houseId);
    const statusMod = ((h && h.status) || 1) * 0.002;
    p.currentValue = Math.floor(p.currentValue * (1 + baseAppr + statusMod));
    // Condition decay: 2-4 points per year
    p.condition = clamp(p.condition - (2 + Math.random()*2), 0, 100);
    // Maintenance scales with condition damage and house tier
    const annualMaint = Math.floor((h ? h.monthly : 800) * 12 * 0.04 * country.costMult);
    totalMaint += annualMaint;
    // Rent collection — only if rented + occupied
    if(p.rentedOut && p.occupied){
      // Vacancy/missed-rent rolls
      const skipRoll = Math.random();
      let collected = p.monthlyRent * 12;
      if(skipRoll < 0.05){
        collected = Math.floor(collected * 0.5);
        pushEvent('bad', '⚠️ Tenant ' + (p.tenant?p.tenant.name:'') + ' fell behind on rent at ' + p.nickname + '. Lost half-year of rent.');
      }
      totalRent += collected;
      // Lease expiry / tenant churn
      if(p.tenant && p.tenant.leaseEnd <= c.age){
        // Re-list — 80% find a new tenant
        if(Math.random() < 0.80){
          p.tenant = {
            name: pickRand(['Alex Patel','Maria Garcia','James Smith','Yuki Tanaka','Hans Schmidt','Priya Kumar','Carlos Lopez','Emma Wilson','Liam Chen','Sofia Reyes']),
            leaseEnd: c.age + 1 + Math.floor(Math.random()*3),
          };
        } else {
          p.occupied = false;
          p.tenant = null;
        }
      }
    } else if(p.rentedOut && !p.occupied){
      // Try to fill vacancy
      if(Math.random() < 0.55){
        p.occupied = true;
        p.tenant = {
          name: pickRand(['Alex Patel','Maria Garcia','James Smith','Yuki Tanaka','Hans Schmidt','Priya Kumar']),
          leaseEnd: c.age + 1 + Math.floor(Math.random()*3),
        };
        pushEvent('career', '🏠 Tenant ' + p.tenant.name + ' signed a lease at ' + p.nickname + '.');
      }
    }
    // Disrepair penalty: if condition drops below 35, value drops and rent suffers
    if(p.condition < 35){
      p.currentValue = Math.floor(p.currentValue * 0.99);
      if(p.rentedOut && p.occupied && Math.random() < 0.20){
        p.occupied = false;
        pushEvent('bad', '😡 Tenant moved out of ' + p.nickname + ' citing poor condition.');
        p.tenant = null;
      }
    }
  });
  c.money += totalRent - totalMaint;
  if(totalRent > 0){
    pushEvent('career', '💰 Rental income this year: ' + fmtMoney(totalRent) + ' (maintenance −' + fmtMoney(totalMaint) + ').');
  }
}

function coHire(cid){

  co.revenue = Math.floor(co.revenue * 1.07);
  co.profitMargin = Math.max(0.02, co.profitMargin - 0.005);

  pushEvent('career', '👥 Hired 5 employees at ' + co.name + '. Revenue +7%.');
  closeModal(); openCompanies(); saveLife();
}
function coFire(cid){
  const co = coFind(cid); if(!co) return;

function coBonus(cid){

function coAcquire(cid){

function coIPO(cid){
  const co = coFind(cid); if(!co) return;
  if(co.publiclyTraded){ toast('Already public.'); return; }
  if(co.revenue < 5000000){ toast('Need at least ' + fmtMoney(5000000) + ' annual revenue to go public.'); return; }
  // IPO: raise capital, valuation jumps, your stake dilutes from 100 to 70 (or whatever your stake was * 0.7)
  const raise = Math.floor(co.valuation * 0.25);
  LIFE.char.money += Math.floor(raise * (co.yourStake/100) * 0.6); // 60% of your share's IPO proceeds go to you
  co.publiclyTraded = true;
  co.yourStake = Math.floor(co.yourStake * 0.7);
  co.valuation = Math.floor(co.valuation * (1.5 + Math.random()*0.5));
  pushEvent('milestone', '📈 ' + co.name + ' IPO\'d! Your stake diluted to ' + co.yourStake + '%; you took ' + fmtMoney(Math.floor(raise * (co.yourStake/100) * 0.6)) + ' off the table.');
  closeModal(); openCompanies(); saveLife();
}
function coEmbezzle(cid){
  const co = coFind(cid); if(!co) return;
  if(co.investigation){ toast('Auditors are watching. Don\'t.'); return; }
  // Amount = 5-15% of cash on hand
  const stolen = Math.floor((co.cash || 100000) * (0.05 + Math.random()*0.10));
  LIFE.char.money += stolen;
  co.cash = Math.max(0, (co.cash||100000) - stolen);
  co.embezzledThisYear = (co.embezzledThisYear||0) + stolen;
  LIFE.char.karma = clamp(LIFE.char.karma - 25, 0, 100);
  pushEvent('bad', '💼 You moved ' + fmtMoney(stolen) + ' from ' + co.name + ' to a personal account.');
  // Detection chance scales with cumulative amount and morale
  const detectChance = Math.min(0.65, 0.15 + (co.embezzledThisYear / 1000000) * 0.10 + (1 - co.morale/100) * 0.20);
  if(Math.random() < detectChance){
    co.investigation = true;
    pushEvent('death', '🚨 The board hired auditors at ' + co.name + '. An investigation has begun.');
    if(Math.random() < 0.55){
      // Convicted
      pushEvent('death', '⚖️ Convicted of embezzlement. Securities fraud charges. Forfeit your stake.');
      LIFE.char.money -= Math.floor(stolen * 1.5); // restitution + fines
      co.yourStake = 0;
      // Jail
      if(typeof goToJail === 'function') goToJail(rangeRand(3,8), 'embezzlement');
    }
  }
  closeModal(); openCompanies(); saveLife();
}
function coSellCompany(cid){
  const co = coFind(cid); if(!co) return;

function insiderTrade(){

// Yearly tick — revenue growth, dividends, market shifts, investigation outcomes
function processCompanies(){
  ensureCompanies();
  const c = LIFE.char;
  if(!c.companies || !c.companies.length) return;
  let totalDividends = 0;
  c.companies.forEach(co => {
    // Revenue drift +/- based on margin & morale
    const drift = (co.morale/100) * 0.05 - 0.01 + (Math.random()*0.06 - 0.03);
    co.revenue = Math.max(0, Math.floor(co.revenue * (1 + drift)));
    // Margin small drift
    co.profitMargin = clamp(co.profitMargin + (Math.random()*0.02 - 0.01), 0.01, 0.45);
    // Valuation tracks revenue
    co.valuation = Math.floor(co.revenue * (5 + co.profitMargin * 30));
    // Profit + dividends
    const profit = Math.floor(co.revenue * co.profitMargin);
    if(profit > 0){
      const div = Math.floor(profit * 0.40 * (co.yourStake||0)/100); // 40% payout
      totalDividends += div;
      co.cash = (co.cash||0) + Math.floor(profit * 0.60);
    } else {
      co.cash = (co.cash||0) + profit; // can go negative
    }
    // Cash crunch — if negative, company fails
    if((co.cash||0) < -1000000){
      pushEvent('death', '💀 ' + co.name + ' went bankrupt. Your stake is worthless.');
      co.yourStake = 0;
      co.investigation = false;
    }
    // Morale drift
    co.morale = clamp(co.morale + (Math.random()*4 - 2), 0, 100);
    co.embezzledThisYear = 0;
    // Investigation outcome — eventual conviction window
    if(co.investigation && Math.random() < 0.30){
      pushEvent('death', '⚖️ ' + co.name + ' investigation closed — settlement reached. Your stake reduced.');
      co.investigation = false;
      co.yourStake = Math.max(0, co.yourStake - 20);
    }
  });
  // Remove companies with 0 stake
  c.companies = c.companies.filter(x => (x.yourStake||0) > 0);
  if(totalDividends > 0){
    c.money += totalDividends;
    pushEvent('career', '💰 Dividend income from companies: ' + fmtMoney(totalDividends) + '.');
  }
}

function confirmAtrocity(id){
  const a = ATROCITIES.find(x => x.id === id);
  if(!a) return;
  const proceed = confirm(
    a.label + '\n\n' + a.warn + '\n\nConsequences: ' + a.cons
    + '\n\nThis cannot be undone. Continue?'
  );
  if(!proceed) return;
  a.exec(LIFE.char);
  closeModal();
  renderAll();
  saveLife();
}

function commitCrime(id){
  const c = LIFE.char;
  const country = COUNTRIES[c.country];
  const map = {
    pickpocket: {payRange:[40, 380], catchChance:0.18, sentence:[0,1], karma:-5, name:'Pickpocketed'},
    shoplift:   {payRange:[20, 220], catchChance:0.15, sentence:[0,1], karma:-3, name:'Shoplifted'},
    mug:        {payRange:[200, 1400], catchChance:0.25, sentence:[1,3], karma:-12, name:'Mugged someone'},
    rob:        {payRange:[800, 5000], catchChance:0.35, sentence:[2,6], karma:-18, name:'Robbed a store'},
    bankjob:    {payRange:[8000, 280000], catchChance:0.55, sentence:[5,18], karma:-30, name:'Robbed a bank'},
    grandtheft: {payRange:[3000, 65000], catchChance:0.45, sentence:[3,10], karma:-20, name:'Stole a car'},
  };
  const cr = map[id]; if(!cr) return;
  const adjustedCatch = cr.catchChance * (country.crimeChance / 0.05); // crime-friendly countries reduce chance
  const caught = Math.random() < adjustedCatch;
  c.karma = clamp(c.karma + cr.karma, 0, 100);
  if(caught){
    const yrs = rangeRand(cr.sentence[0], cr.sentence[1]);
    if(yrs > 0){
      goToJail(yrs, cr.name.toLowerCase());
    } else {
      pushEvent('bad', '🚓 You were caught ' + cr.name.toLowerCase() + ' but let off with a warning.');
    }
  } else {
    const haul = rangeRand(cr.payRange[0], cr.payRange[1]);
    c.money += haul;
    pushEvent('bad', '💰 You got away with ' + cr.name.toLowerCase() + '. +' + fmtMoney(haul));
  }
  closeModal();
  renderAll();
  saveLife();
}

function goToJail(years, reason){
  const c = LIFE.char;
  c.inJail = true;
  c.jailYearsLeft = years;
  if(c.career){
    pushEvent('career', '🚪 You lost your job as ' + CAREERS[c.career.key].rungs[c.career.rungIdx].title + ' due to incarceration.');
    c.career = null;
  }
  pushEvent('death', '⛓ You were sentenced to ' + years + ' year' + (years>1?'s':'') + ' in prison for ' + reason + '.');
  c.happiness = clamp(c.happiness - 25, 0, 100);
}

// Total estate value at death — cash, savings, investments, trust, real estate
// resale, owned company valuations, house, car. Split equally among living kids.
function totalEstateValue(c){
  let n = (c.money||0) + (c.savings||0) + (c.investments||0) + (c.trust||0);
  if(c.properties && c.properties.length){
    n += c.properties.reduce((s,p) => s + (p.currentValue||0), 0);
  }
  if(c.companies && c.companies.length){
    n += c.companies.reduce((s,co) => s + (co.valuation || co.treasury || 0), 0);
  }
  if(c.houseId && c.houseId !== 'family'){
    const h = HOUSES.find(x => x.id === c.houseId);
    if(h) n += Math.floor((h.price||0) * 0.85);
  }
  if(c.carId && c.carId !== 'none'){
    const car = CARS.find(x => x.id === c.carId);
    if(car) n += Math.floor((car.price||0) * 0.5);
  }
  return Math.max(0, n);
}

function continueAs(kidName){
  const oldChar = LIFE.char;
  const kid = oldChar.children.find(k => k.name === kidName);
  if(!kid){ return; }
  const heirs = liveKidCount(oldChar);
  // Liquid wealth (cash) is split among living kids. Physical assets
  // (properties, companies, primary house, car, trust, savings, investments)
  // pass entirely to the chosen heir — they keep rental contracts, tenants,
  // company treasuries, valuations, the family home, everything.
  const liquidPool = Math.max(0, oldChar.money || 0);
  const inheritance = Math.floor(liquidPool / heirs);
  // build a fresh char from kid data
  const country = oldChar.country;
  const newSeed = {
    firstName: kid.name.split(' ')[0],
    lastName: kid.lastName || oldChar.lastName,
    sex: kid.sex,
    country: country,
    city: oldChar.city,
    parents: {
      mom: oldChar.sex==='f' ? {
        firstName:oldChar.firstName, lastName:oldChar.lastName, sex:'f',
        age:oldChar.age, occupation:'Deceased', alive:false,
      } : (oldChar.partner ? {
        firstName:oldChar.partner.firstName, lastName:oldChar.partner.lastName, sex:'f',
        age:oldChar.partner.age, occupation:oldChar.partner.occupation, alive:!!oldChar.partner.alive,
      } : makePerson(country,'f',[40,55])),
      dad: oldChar.sex==='m' ? {
        firstName:oldChar.firstName, lastName:oldChar.lastName, sex:'m',
        age:oldChar.age, occupation:'Deceased', alive:false,
      } : (oldChar.partner ? {
        firstName:oldChar.partner.firstName, lastName:oldChar.partner.lastName, sex:'m',
        age:oldChar.partner.age, occupation:oldChar.partner.occupation, alive:!!oldChar.partner.alive,
      } : makePerson(country,'m',[40,55])),
    },
    siblings: oldChar.children.filter(k => k.name !== kidName).map(s => ({
      firstName: s.name.split(' ')[0],
      lastName:  s.lastName || oldChar.lastName,
      sex: s.sex, age: s.age, occupation: 'Family',
      alive: s.alive,
    })),
    inheritance: inheritance,
  };
  LIFE.generation++;
  const ch = defaultChar(newSeed);
  ch.age = kid.age;
  ch.smarts = kid.smarts || ch.smarts;
  ch.looks  = kid.looks  || ch.looks;
  ch.health = kid.health || ch.health;
  ch.money  = inheritance;
  // Deep-clone physical / illiquid assets so the chosen heir owns the same
  // properties (with their tenants, leases, valuations), the same companies
  // (with their treasuries, products, employees), the family home, car,
  // trust principal, and any savings / investments accounts.
  const clone = v => (v == null ? v : JSON.parse(JSON.stringify(v)));
  ch.properties  = clone(oldChar.properties)  || [];
  ch.companies   = clone(oldChar.companies)   || [];
  ch.savings     = oldChar.savings     || 0;
  ch.investments = oldChar.investments || 0;
  ch.trust       = oldChar.trust       || 0;
  if(oldChar.houseId && oldChar.houseId !== 'family'){ ch.houseId = oldChar.houseId; }
  if(oldChar.carId   && oldChar.carId   !== 'none'){   ch.carId   = oldChar.carId; }
  if(oldChar.insurance){ ch.insurance = clone(oldChar.insurance); }
  // Mark the chosen heir as the new owner / landlord on each property
  // (tenants stay; rent keeps flowing to the inheritor).
  ch.properties.forEach(p => { p.inheritedFrom = oldChar.firstName + ' ' + oldChar.lastName; });
  ch.companies.forEach(co => { co.inheritedFrom = oldChar.firstName + ' ' + oldChar.lastName; });
  ch.born   = (new Date().getFullYear()) - ch.age;
  LIFE.char = ch;
  // Build a human-readable inheritance summary
  const bits = [];
  if(inheritance > 0) bits.push(fmtMoney(inheritance) + ' cash');
  if(ch.savings)     bits.push(fmtMoney(ch.savings) + ' in savings');
  if(ch.investments) bits.push(fmtMoney(ch.investments) + ' invested');
  if(ch.trust)       bits.push(fmtMoney(ch.trust) + ' trust');
  if(ch.houseId && ch.houseId !== 'family'){
    const h = HOUSES.find(x => x.id === ch.houseId);
    if(h) bits.push('the ' + h.name);
  }
  if(ch.properties.length){
    const rented = ch.properties.filter(p => p.rentedOut && p.occupied).length;
    bits.push(ch.properties.length + ' propert' + (ch.properties.length===1?'y':'ies')
      + (rented ? ' (' + rented + ' currently rented out)' : ''));
  }
  if(ch.companies.length){
    bits.push(ch.companies.length + ' compan' + (ch.companies.length===1?'y':'ies'));
  }
  pushEvent('milestone',
    'You inherited ' + (bits.length ? bits.join(', ') : 'nothing of value')
    + ' from your parent ' + oldChar.firstName + ' ' + oldChar.lastName
    + '. Their tenants are now your tenants, their companies your companies,'
    + ' and the upkeep is yours to manage. The family story continues.');
  document.getElementById('death-screen').classList.remove('show');
  renderAll();
  saveLife();
}

function liveKidCount(c){ return Math.max(1, c.children.filter(k=>k.alive).length); }

function restartFromBirth(){
  clearSave();
  LIFE = null;
  document.getElementById('death-screen').classList.remove('show');
  document.getElementById('main').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('intro').style.display = 'flex';
  renderIntroCountries();
  const cont = document.getElementById('intro-continue');
  if(cont) cont.style.display = 'none';
}
function openFamilyTreeFromDeath(){

  openFamilyTree();
}

function confirmRestart(){
  if(!confirm('Abandon this life and start a new one? Current life will be lost.')) return;
  restartFromBirth();
}

function ceoAction(id){
  const c = LIFE.char;
  const co = ensureCompany();
  let msg = '';
  if(id === 'hire'){
    if(co.cash < 300000){ toast('Not enough cash.'); return; }
    co.cash -= 300000;
    co.employees += 10;
    co.revenue = Math.floor(co.revenue * 1.06);
    co.profitMargin = Math.max(0.02, co.profitMargin - 0.01);
    co.morale = clamp(co.morale + 4, 0, 100);
    msg = 'Hired 10 new employees. Revenue +6%.';
  } else if(id === 'fire'){
    const fired = Math.floor(co.employees * 0.15);
    co.employees -= fired;
    co.morale = clamp(co.morale - 18, 0, 100);
    co.profitMargin = Math.min(0.30, co.profitMargin + 0.025);
    co.marketCap = Math.floor(co.marketCap * 1.04);
    msg = 'Laid off ' + fired + ' employees. Margin up. Morale crashed.';
  } else if(id === 'bonus'){
    if(co.cash < 600000){ toast('Not enough cash.'); return; }
    co.cash -= 600000;
    co.morale = clamp(co.morale + 22, 0, 100);
    co.profitMargin = Math.min(0.30, co.profitMargin + 0.008);
    msg = 'Holiday bonuses delivered. Morale soared.';
  } else if(id === 'acquire'){
    if(co.cash < 2400000){ toast('Not enough cash for the acquisition.'); return; }
    co.cash -= 2400000;
    co.revenue = Math.floor(co.revenue * 1.25);
    co.employees += 20;
    co.morale = clamp(co.morale - 6, 0, 100);
    co.marketCap = Math.floor(co.marketCap * 1.12);
    msg = 'Acquisition closed. Revenue +25%, integration headache.';
  } else if(id === 'pivot'){
    if(co.cash < 450000){ toast('Not enough cash.'); return; }
    co.cash -= 450000;
    if(Math.random() < c.smarts/100){
      co.revenue = Math.floor(co.revenue * 1.8);
      co.profitMargin = Math.min(0.30, co.profitMargin + 0.04);
      msg = 'The pivot worked. Revenue +80%.';
    } else {
      co.revenue = Math.floor(co.revenue * 0.6);
      co.morale = clamp(co.morale - 10, 0, 100);
      msg = 'The pivot bombed. Revenue −40%.';
    }
  } else if(id === 'ipo'){
    const raise = Math.floor(co.marketCap * 0.18);
    co.cash += raise;
    co.marketCap = Math.floor(co.marketCap * (0.95 + Math.random() * 0.3));
    msg = 'Secondary offering raised ' + fmtMoney(raise) + '.';
  } else if(id === 'rd'){
    if(co.cash < 800000){ toast('Not enough cash.'); return; }
    co.cash -= 800000;
    co.profitMargin = Math.min(0.30, co.profitMargin + 0.025);
    co.revenue = Math.floor(co.revenue * 1.04);
    msg = 'R&D investment paid off. Margin +2.5pp.';
  } else if(id === 'crisis'){
    const crises = [
      {text:'A product recall hit the news.',           cash:-400000, morale:-8,  cap:0.92},
      {text:'A whistleblower leaked internal emails.',  cash:-180000, morale:-15, cap:0.88},
      {text:'A class-action lawsuit was filed.',        cash:-850000, morale:-5,  cap:0.85},
      {text:'A competitor exposed your supply chain.',  cash:-120000, morale:-3,  cap:0.95},
      {text:'A board member resigned publicly.',        cash:0,       morale:-10, cap:0.93},
      {text:'A regulator opened an investigation.',     cash:-220000, morale:-6,  cap:0.90},
    ];
    const cr = pickRand(crises);
    co.cash += cr.cash;
    co.morale = clamp(co.morale + cr.morale, 0, 100);
    co.marketCap = Math.floor(co.marketCap * cr.cap);
    co.crises++;
    msg = '🚨 Crisis — ' + cr.text;
  }
  // Year-end: profit added to cash
  co.cash += Math.floor(co.revenue * co.profitMargin);
  co.marketCap = Math.floor(co.revenue * (5 + co.profitMargin * 20) * (co.morale/100 + 0.5));
  pushEvent('career', '🏢 ' + co.name + ' · ' + msg);
  // CEO bonus into personal money: 10% of profit when positive
  const profit = Math.floor(co.revenue * co.profitMargin);
  if(profit > 0){
    const bonus = Math.floor(profit * 0.10);
    c.money += bonus;
    pushEvent('career', '💼 You took home a ' + fmtMoney(bonus) + ' performance bonus.');
  }
  closeModal();
  renderAll();
  saveLife();
  // Reopen so they can see new state
  setTimeout(openCEOEmpire, 80);
}

function rollHousingDisaster(){
  const c = LIFE.char;
  if(c.houseId === 'family') return;
  for(const d of HOUSING_DISASTERS){
    if(Math.random() < d.prob){
      const damage = rangeRand(d.damage[0], d.damage[1]);
      const country = COUNTRIES[c.country];
      const adjusted = Math.floor(damage * country.costMult);
      let coverText = '';
      if(c.insurance && c.insurance.home){
        const covered = Math.floor(adjusted * 0.85);
        c.money -= (adjusted - covered);
        coverText = ' Home insurance covered ' + fmtMoney(covered) + '. You paid ' + fmtMoney(adjusted - covered) + '.';
      } else {
        c.money -= adjusted;
        coverText = ' No insurance. You paid ' + fmtMoney(adjusted) + ' out of pocket.';
      }
      pushEvent('bad', d.name + ' — ' + d.desc + coverText, {money:-adjusted});
      c.happiness = clamp(c.happiness - 6, 0, 100);
      return; // one disaster per year max
    }
  }
}

function rollApocalypseEvent(){
  const c = LIFE.char;
  if(!c.reality) return;
  const pool = APOCALYPSE_EVENTS.filter(e => e.reality === c.reality);
  if(!pool.length) return;
  if(Math.random() < 0.025){
    const ev = pickRand(pool);
    if(!c.flags['apoc_'+ev.id]){
      c.flags['apoc_'+ev.id] = true;
      const fx = ev.fx || {};
      if(fx.happiness) c.happiness = clamp(c.happiness + fx.happiness, 0, 100);
      if(fx.health)    c.health    = clamp(c.health + fx.health, 0, 100);
      if(fx.smarts)    c.smarts    = clamp(c.smarts + fx.smarts, 0, 100);
      if(fx.karma)     c.karma     = clamp(c.karma + fx.karma, 0, 100);
      if(fx.faith)     c.faith     = clamp(c.faith + fx.faith, 0, 100);
      if(ev.money)     c.money    += ev.money;
      pushEvent('death', '☢ ' + ev.text, fx);
    }
  }
}

function processBankingInterest(){
  const c = LIFE.char;
  // Savings compound monthly at 5% APR — APY ≈ 5.12%. Effective on the
  // full annual balance is applied once per ageUp via (1+r/12)^12 - 1.
  if(c.savings > 0){
    const apy = Math.pow(1 + 0.05/12, 12) - 1; // ≈ 0.05116
    const yield_ = Math.floor(c.savings * apy);
    c.savings += yield_;
    if(yield_ >= 1){
      pushEvent('good', '🏦 Savings compounded — interest ' + fmtMoney(yield_) + ' added.', {money:0});
    }
  }
  // Investments — 8% average annual return with real volatility.
  if(c.investments > 0){
    const swing = 0.04 + Math.random() * 0.14;
    const direction = Math.random() < 0.7 ? +1 : -1;
    const returnRate = direction > 0 ? swing : -swing/2;
    const change = Math.floor(c.investments * returnRate);
    c.investments += change;
    if(c.investments < 0) c.investments = 0;
    if(Math.abs(change) > 100){
      const tag = change > 0 ? 'good' : 'bad';
      pushEvent(tag, '📈 Investments ' + (change>0?'gained':'lost') + ' ' + fmtMoney(Math.abs(change)) + ' this year.', {money:0});
    }
  }
  // Trust fund grows at a steady 6%
  if(c.trust > 0){
    const yield_ = Math.floor(c.trust * 0.06);
    c.trust += yield_;
  }
}

function rollFaithEvent(){
  const c = LIFE.char;
  if(!c.religion) return;
  // Faith decays slightly each year if not practiced
  if(Math.random() < 0.3){
    c.faith = clamp(c.faith - 1, 0, 100);
  }
  // Random religious events
  if(Math.random() < 0.05){
    const rel = RELIGIONS[c.religion];
    const events = [
      {text:'You attended ' + rel.holyDay + ' service. Felt centered.', fx:{faith:+3, happiness:+3}},
      {text:'A passage from your scriptures struck you deeply this week.', fx:{faith:+4, smarts:+1}},
      {text:'You helped organize a religious community event.', fx:{faith:+5, karma:+5}},
      {text:'You had a moment of doubt about your faith.', fx:{faith:-5, smarts:+1}},
    ];
    const ev = pickRand(events);
    const fx = ev.fx;
    if(fx.faith)     c.faith     = clamp(c.faith + fx.faith, 0, 100);
    if(fx.happiness) c.happiness = clamp(c.happiness + fx.happiness, 0, 100);
    if(fx.smarts)    c.smarts    = clamp(c.smarts + fx.smarts, 0, 100);
    if(fx.karma)     c.karma     = clamp(c.karma + fx.karma, 0, 100);
    pushEvent('', '🕊️ ' + ev.text, fx);
  }
}

function bankTransfer(action, amount){
  const c = LIFE.char;
  if(action === 'tosavings'){
    if(c.money < amount){ toast('Not enough cash.'); return; }
    c.money -= amount; c.savings = (c.savings||0) + amount;
  } else if(action === 'toinvest'){
    if(c.money < amount){ toast('Not enough cash.'); return; }
    c.money -= amount; c.investments = (c.investments||0) + amount;
  } else if(action === 'fromsavings'){
    if((c.savings||0) < amount){ toast('Not enough in savings.'); return; }
    c.savings -= amount; c.money += amount;
  } else if(action === 'frominvest'){
    if((c.investments||0) < amount){ toast('Not enough in investments.'); return; }
    c.investments -= amount; c.money += amount;
  }
  closeModal();
  openBanking();
  renderAll();
  saveLife();
}

function toggleInsurance(t){
  const c = LIFE.char;
  if(!c.insurance) c.insurance = { home:false, health:false, life:false, auto:false };
  const cost = { home:1800, health:3600, life:1200, auto:1600 }[t];
  if(c.insurance[t]){
    c.insurance[t] = false;
    pushEvent('milestone', '🛡️ You cancelled your ' + t + ' insurance.');
  } else {
    if(c.money < cost){ toast('Not enough to pay the first year premium.'); return; }
    c.money -= cost;
    c.insurance[t] = true;
    pushEvent('milestone', '🛡️ You bought ' + t + ' insurance for ' + fmtMoney(cost) + '/yr.');
  }
  closeModal();
  openBanking();
  renderAll();
  saveLife();
}

// Pre-marital baby — same biology, different social fallout.
// In conservative cultures the karma + community judgment is higher;
// in secular cultures it's milder. The kid is marked outOfWedlock so
// future Drama events (paternity disputes, community shame, etc.) fire.
function tryForBabyPremarital(){
  const c = LIFE.char;
  const p = c.partner;
  if(!p){ toast('Need a partner first.'); return; }
  if(p.married){ toast('You are already married — use Try for Baby instead.'); return; }
  if(c.children && c.children.length >= 10){ toast('Ten kids is a lot.'); return; }
  const outcome = getBabyOutcome(c);
  if(!outcome.success){
    toast(outcome.msg);
    pushEvent('', '👶 ' + outcome.msg);
    closeModal();
    renderAll();
    saveLife();
    return;
  }
  outcome.babies.forEach((b, idx) => {
    const babyName = prompt('Pre-marital baby ' + (idx+1) + '/' + outcome.babies.length + ' is a '
      + (b.sex==='m'?'boy':'girl') + '! Name them:', pickRand(NAMES[c.country][b.sex]));
    if(babyName === null) return;
    c.children.push({
      name: babyName || pickRand(NAMES[c.country][b.sex]),
      sex: b.sex, age: 0, alive: true, lastName: c.lastName,
      smarts: Math.floor(((c.smarts + (p.smarts||60))/2) + rangeRand(-10,10)),
      looks:  Math.floor(((c.looks + (p.looks||60))/2) + rangeRand(-10,10)),
      health: rangeRand(60, 95),
      outOfWedlock: true,
      otherParent: p.firstName + ' ' + (p.lastName || ''),
    });
  });
  pushEvent('milestone', '👶 You had a baby with ' + p.firstName + ' before marriage. The community noticed.');
  // Cultural fallout: conservative cultures hit happiness/karma harder
  const ctry = COUNTRIES[c.country] || {};
  const conservative = ['family-first','communal','collectivist','reserved'].includes(ctry.culture);
  const hapHit = conservative ? -10 : -4;
  const karHit = conservative ? -5 : -2;
  c.happiness = clamp(c.happiness + hapHit + 18, 0, 100); // joy still net positive
  c.karma = clamp(c.karma + karHit, 0, 100);
  c.money -= 8000 * outcome.babies.length;
  closeModal();
  renderAll();
  saveLife();
}

    COLLEGES.forEach(col => {
      const meets = c.smarts >= col.minSmarts;
      const tuition = Math.floor(col.tuition * country.costMult);
      const acceptOdds = Math.floor(col.accept * 100);
      html += '<div class="card">'
        + '<div class="card-ico">🎓</div>'
        + '<div class="card-body"><div class="card-title">' + col.name + '</div>'
        + '<div class="card-meta">Prestige ' + col.prestige + '/10 · ' + col.mascot + ' · Min Smarts ' + col.minSmarts + (meets?' ✓':' ✗')
        + (col.specialty ? ' · ' + col.specialty + ' specialty' : '') + '</div>'
        + '<div class="card-meta">Acceptance ~' + acceptOdds + '% · Tuition ' + fmtMoney(tuition) + '/yr</div></div>'
        + '<div class="card-act">'
        + '<button class="card-btn ' + (meets?'':'muted') + '" ' + (meets?'':'disabled') + ' onclick="applyToCollege(\'' + col.id + '\')">Apply</button>'
        + '</div></div>';
    });
  }

  // ─── DEGREE PROGRAMS (Bachelor's + Grad School) ───
  html += '<div style="font-family:var(--font-m);font-size:10px;color:var(--accent2);letter-spacing:.22em;text-transform:uppercase;margin:18px 0 10px;">Degree Programs</div>';
  html += '<div style="font-size:12px;color:var(--t3);font-style:italic;margin-bottom:10px;line-height:1.5;">'
    + '<b>Path to Med School:</b> Smarts 78+ → Enroll in Medical School (4 yrs, $240k) → Apply for Medical Resident in the Career menu.<br>'
    + '<b>Path to Law:</b> Smarts 72+ → Law School (3 yrs) → Apply as Junior Associate.<br>'
    + '<b>Path to MBA / CEO:</b> Smarts 60+ → M.B.A. (2 yrs) → Apply as Corporate Director.<br>'
    + '<b>Path to PhD / Scientist:</b> Smarts 75+ → PhD (5 yrs) → Apply as PhD Researcher.</div>';
  if(c.age < 18){
    html += '<div style="color:var(--t3);font-size:12px;padding:8px;text-align:center;">Available at age 18.</div>';
  } else {
    Object.keys(DEGREES).forEach(k => {
      const d = DEGREES[k];
      const owned = c.degrees && c.degrees.includes(k);
      const current = c.degree === k;
      const meets = c.smarts >= d.minSmarts;
      const cost = Math.floor(d.cost * country.costMult);
      const tag = owned ? '<span class="card-tag">COMPLETED ✓</span>'
                  : current ? '<span class="card-tag req">IN PROGRESS</span>'
                  : '';
      let btn = '';
      if(!owned && !current){
        const can = meets && !c.degree;
        btn = '<button class="card-btn ' + (can?'green':'muted') + '" ' + (can?'':'disabled') + ' onclick="enrollDegree(\'' + k + '\')">Enroll</button>';
      } else if(current){
        btn = '<button class="card-btn danger" onclick="dropOut()">Drop Out</button>';
      }
      html += '<div class="card" style="' + (owned?'border-color:var(--accent);background:#1a1428;':'') + '">'
        + '<div class="card-ico">' + (k==='medical'?'⚕️':k==='law'?'⚖️':k==='business'?'💼':k==='phd'?'🔬':'📚') + '</div>'
        + '<div class="card-body"><div class="card-title">' + d.name + '</div>'
        + '<div class="card-meta">' + d.years + ' yrs · Min Smarts ' + d.minSmarts + (meets?' ✓':' ✗') + ' · Tuition ' + fmtMoney(cost) + '</div></div>'
        + '<div class="card-act">' + (tag?'<div>'+tag+'</div>':'') + btn + '</div></div>';
    });
  }

  openModal('🎓 Education', html);
}

function studyHighSchool(){
  const c = LIFE.char;
  c.smarts = clamp(c.smarts + 4, 0, 100);
  c.happiness = clamp(c.happiness - 2, 0, 100);
  pushEvent('milestone', '📖 You buckled down at school this year. +4 Smarts.');
  closeModal();
  openColleges();
  renderAll();
  saveLife();
}

function applyToCollege(id){
  const c = LIFE.char;
  const col = COLLEGES.find(x => x.id === id);
  if(!col) return;
  // Acceptance probability: base accept rate, modified by smarts overshoot
  const smartsOvershoot = (c.smarts - col.minSmarts) / 100;
  const odds = col.accept + smartsOvershoot * 0.5;
  if(Math.random() < odds){
    c.college = id;
    pushEvent('milestone', '🎉 You got accepted to ' + col.name + '!');
    c.happiness = clamp(c.happiness + 12, 0, 100);
  } else {
    pushEvent('bad', '📪 ' + col.name + ' rejected your application.');
    c.happiness = clamp(c.happiness - 6, 0, 100);
  }
  closeModal();
  renderAll();
  saveLife();
}

//  QUICK JOBS — entry-level employment beyond the deep careers
// ═══════════════════════════════════════════════════════════════════════
function openQuickJobs(){
  const c = LIFE.char;
  if(c.age < 7){ toast('Too young to work.'); return; }
  // Show teen jobs first when player is under 18, otherwise full job list
  const showOnlyTeen = c.age < 18;
  const jobs = showOnlyTeen
    ? QUICK_JOBS.filter(j => j.teen)
    : QUICK_JOBS;
  let intro = showOnlyTeen
    ? 'Small jobs for under-18s. Real-world part-time work — pocket money, no rent eats your savings before adulthood.'
    : 'Quick jobs — flat salaries, no promotion ladders, but plenty of variety. ' + QUICK_JOBS.length + ' to choose from.';
  let html = '<div style="color:var(--t3);font-size:13px;margin-bottom:14px;text-align:center;font-style:italic;">' + intro + '</div>';
  jobs.forEach(j => {
    const country = COUNTRIES[c.country];
    const salary = Math.floor(j.salary * country.salaryMult);
    const meetsAge = c.age >= (j.minAge || 16);
    const meetsSmarts = !j.minSmarts || c.smarts >= j.minSmarts;
    const meetsLooks  = !j.minLooks  || c.looks  >= j.minLooks;
    const meetsHealth = !j.minHealth || c.health >= j.minHealth;
    const hasDeg = !j.requiresDegree || c.degrees.includes(j.requiresDegree);
    const eligible = meetsAge && meetsSmarts && meetsLooks && meetsHealth && hasDeg && !c.inJail;
    const reqs = [];
    if(j.minAge && j.minAge > 16) reqs.push('Age ' + j.minAge + '+');
    if(j.minSmarts) reqs.push('Smarts ' + j.minSmarts + '+');
    if(j.minLooks) reqs.push('Looks ' + j.minLooks + '+');
    if(j.minHealth) reqs.push('Health ' + j.minHealth + '+');
    if(j.requiresDegree) reqs.push((hasDeg?'✓ ':'✗ ') + DEGREES[j.requiresDegree].name);
    html += '<div class="card">'
      + '<div class="card-ico">' + j.ico + '</div>'
      + '<div class="card-body"><div class="card-title">' + j.title + '</div>'
      + (reqs.length ? '<div class="card-meta">' + reqs.join(' · ') + '</div>' : '')
      + '</div>'
      + '<div class="card-act"><div class="card-pay">' + fmtMoney(salary) + '/yr</div>'
      + '<button class="card-btn ' + (eligible?'':'muted') + '" ' + (eligible?'':'disabled') + ' onclick="acceptQuickJob(\'' + j.id + '\')">Apply</button>'
      + '</div></div>';
  });
  openModal('💼 Quick Jobs (' + QUICK_JOBS.length + ')', html);
}

function acceptQuickJob(id){
  const c = LIFE.char;
  const j = QUICK_JOBS.find(x => x.id === id);
  if(!j) return;
  const country = COUNTRIES[c.country];
  const salary = Math.floor(j.salary * country.salaryMult);
  // Quick jobs use a synthetic single-rung CAREERS entry
  c.career = {
    key: 'quickjob_' + j.id,
    quickJobId: j.id,
    rungIdx: 0,
    yearsAtRung: 0,
    totalYears: 0,
    currentSalary: salary,
    title: j.title,
    icon: j.ico,
  };
  pushEvent('career', '💼 You took a job as a ' + j.title + '. ' + fmtMoney(salary) + '/yr');
  closeModal();
  renderAll();
  saveLife();
}

      + '</div></div>';

function buyRoom(id){
  const c = LIFE.char;
  const r = ROOMS.find(x => x.id === id);
  if(!r) return;
  const country = COUNTRIES[c.country];
  const price = Math.floor(r.price * country.costMult);
  if(c.money < price){ toast('Not enough money.'); return; }
  if(!c.rooms) c.rooms = [];
  c.rooms.push(id);
  c.money -= price;
  pushEvent('milestone', '🏗️ You added a ' + r.name + ' to your home. ' + r.desc);
  closeModal();
  openRooms();
  renderAll();
  saveLife();
}

function adoptPet(id){
  const c = LIFE.char;
  const p = PETS.find(x => x.id === id);
  if(!p) return;
  if(c.money < p.price){ toast('Not enough money.'); return; }
  const name = prompt('Name your new ' + p.name.toLowerCase() + ':', 'Buddy');
  if(name === null) return;
  c.money -= p.price;
  if(!c.pets) c.pets = [];
  c.pets.push({ id:p.id, name: name || 'Pet', age: 0, alive: true });
  pushEvent('milestone', '🎉 You adopted a ' + p.name.toLowerCase() + ' named ' + (name||'Pet') + '!');
  c.happiness = clamp(c.happiness + 12, 0, 100);
  closeModal();
  openPets();
  renderAll();
  saveLife();
}
function giveUpPet(idx){
  const c = LIFE.char;
  const pet = c.pets[idx];
  if(!pet) return;
  if(!confirm('Rehome ' + pet.name + '?')) return;
  pet.alive = false;
  pushEvent('bad', '😔 You rehomed ' + pet.name + '.');
  c.happiness = clamp(c.happiness - 6, 0, 100);
  closeModal();
  openPets();
  renderAll();
  saveLife();
}

// ═══════════════════════════════════════════════════════════════════════
//  SIDE HUSTLES + CELEBRITY TRACK
//  Each skill, once monetized, can become a recurring side hustle. As
//  the skill levels up the hustle tiers up (Side Hustle → Pro → Celebrity)
//  unlocking bigger releases, more fame, automated royalty income, and
//  crossover offers. Stardom comes with the counter: scandals, burnout,

// ═══════════════════════════════════════════════════════════════════════
const HUSTLE_TIERS = [

];

// Per-skill product / release names, ascending tier order
const HUSTLE_PRODUCTS = {
  music:       ['Demo Track','Single','EP','Studio Album','World Tour','Greatest Hits'],
  writing:     ['Short Story','Magazine Piece','Novel','Bestseller','Trilogy','Film Adaptation'],
  painting:    ['Local Gallery Show','Group Exhibition','Solo Exhibition','Museum Retrospective','Biennial Feature','Auction Record'],

  auto:        ['Garage Service','Restoration Channel','TV Custom-Build Show','Auction Restoration','Custom-Build Empire','Pebble Beach Win'],
};

// Crossover offers — only celebs see these (fame-driven side income)
const CROSSOVERS = [
  {id:'acting_role',  label:'🎬 Lead Role in a Studio Film',  fame:35, payRange:[600000,5000000], skillBoost:'looks'},
  {id:'endorsement',  label:'💼 Major Brand Endorsement',     fame:40, payRange:[800000,4000000], skillBoost:null},

// Scandal events — fire on celebs occasionally
const SCANDALS = [
  {id:'tabloid_affair',     desc:'A tabloid published your affair photos.',              fameHit:-15, karma:-6},
  {id:'tax_audit',          desc:'A leaked audit shows you dodged taxes.',                fameHit:-20, karma:-10, moneyMult:0.85},

  {id:'rehab_stint',        desc:'You checked into rehab. The press will not let it go.', fameHit:-12, health:-5},
];

function tierForLevel(level){
  let t = null;
  HUSTLE_TIERS.forEach(x => { if(level >= x.minLevel) t = x; });
  return t;
}

function openSkills(){
  const c = LIFE.char;
  if(!c.skills) c.skills = {};
  if(!c.hustles) c.hustles = {};
  let html = '<div style="color:var(--t3);font-size:13px;margin-bottom:14px;text-align:center;font-style:italic;">Practice 0-100. Hit 60 → Side Hustle. Hit 80 → Pro. Hit 95 → Celebrity (auto-royalties + crossover offers, plus the counter: scandals + burnout).</div>';
  SKILLS.forEach(s => {
    const level = c.skills[s.id] || 0;
    const tier = tierForLevel(level);
    const hustle = c.hustles[s.id];
    const products = HUSTLE_PRODUCTS[s.id] || ['Release'];
    const productIdx = tier ? Math.min(products.length-1, HUSTLE_TIERS.indexOf(tier) * 2) : 0;
    html += '<div class="card">'
      + '<div class="card-ico">' + s.ico + '</div>'
      + '<div class="card-body"><div class="card-title">' + s.name
        + (tier ? ' <span style="color:var(--gold);font-size:10px;letter-spacing:.15em;">· ' + tier.label.toUpperCase() + '</span>' : '')
        + '</div>'
      + '<div class="card-meta">Level ' + level + ' / 100 · ' + s.monetize + '</div>'
      + '<div class="stat-bar" style="margin-top:5px;"><div class="stat-fill smarts" style="width:' + level + '%"></div></div>'
      + (hustle ?
          '<div style="margin-top:6px;font-size:11px;color:var(--accent2);">'
          + 'Royalties: ' + fmtMoney(Math.floor(hustle.monthlyIncome*12)) + '/yr · Releases: ' + (hustle.releases?hustle.releases.length:0)
          + (hustle.automated ? ' · <span style="color:var(--green);">AUTO ON</span>' : ' · <span style="color:var(--t3);">manual</span>')
          + '</div>' : '')
      + '</div>'
      + '<div class="card-act">'
      + '<button class="card-btn" onclick="practiceSkill(\'' + s.id + '\')">Practice</button>';
    if(tier){
      html += '<button class="card-btn green" onclick="releaseProduct(\'' + s.id + '\')">Release ' + products[productIdx] + '</button>';
      if(hustle){
        html += '<button class="card-btn ' + (hustle.automated?'danger':'green') + '" onclick="toggleHustleAuto(\'' + s.id + '\')">'
          + (hustle.automated ? 'Stop Auto' : 'Automate') + '</button>';
      }
    }
    html += '</div></div>';
  });
  // Crossover offers for celebs
  const celebSkills = SKILLS.filter(s => (c.skills[s.id]||0) >= 95);
  if(celebSkills.length && (c.fame||0) >= 25){
    const offers = CROSSOVERS.filter(x => (c.fame||0) >= x.fame);
    if(offers.length){
      html += '<div style="margin-top:18px;padding:14px;background:#1a1428;border:1px solid var(--gold);border-radius:6px;">'
        + '<div style="color:var(--gold);font-family:var(--font-m);font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px;">⭐ Crossover Offers</div>';
      offers.forEach(o => {
        const payHint = fmtMoney(o.payRange[0]) + ' — ' + fmtMoney(o.payRange[1]);
        html += '<div style="padding:8px;margin-top:6px;background:#241a36;border:1px solid #3a2a55;border-radius:5px;">'
          + '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;">'
          + '<div style="flex:1;">'
          + '<div style="font-weight:700;color:var(--accent2);font-size:13px;">' + o.label + '</div>'
          + '<div style="font-size:11px;color:var(--t3);">Pay range: ' + payHint + ' · Needs Fame ' + o.fame + '+</div>'
          + '</div>'
          + '<button class="card-btn green" onclick="acceptCrossover(\'' + o.id + '\')">Accept</button>'
          + '</div></div>';
      });
      html += '</div>';
    }
  }
  openModal('🎯 Skills & Hobbies', html);
}

function releaseProduct(skillId){
  const c = LIFE.char;
  const level = c.skills[skillId] || 0;
  const tier = tierForLevel(level);
  if(!tier){ toast('Need at least level 60.'); return; }
  if(!c.hustles) c.hustles = {};
  // Burnout check — too many releases this year
  const h = c.hustles[skillId];
  if(h){
    h.releasesThisYear = (h.releasesThisYear||0);
    if(h.releasesThisYear >= 3){
      toast('Burnout. Wait for a new year.');
      return;
    }
  }
  // Compute payout + fame
  const burnoutPenalty = h && h.releasesThisYear >= 2 ? 0.45 : 1.0;
  const skillFactor = 0.6 + (level/100);
  const lucky = 0.6 + Math.random()*1.6;
  const range = tier.releasePay;
  let payout = Math.floor((range[0] + Math.random()*(range[1]-range[0])) * skillFactor * lucky * burnoutPenalty);
  const fameRange = tier.fameGain;
  let fameAdd = fameRange[0] + Math.floor(Math.random()*(fameRange[1]-fameRange[0]+1));
  // Critical failure roll — even a celeb can flop
  if(Math.random() < 0.08){
    payout = Math.floor(payout * 0.18);
    fameAdd = -2;
    pushEvent('bad', '📉 Critics savaged your new release. It flopped.');
  } else if(Math.random() < 0.04 && tier.id === 'celeb'){
    payout = Math.floor(payout * 3);
    fameAdd += 8;
    pushEvent('good', '🌟 Your new release is a generational classic. Sales went vertical.');
  }
  // Create or extend the hustle
  if(!c.hustles[skillId]){
    c.hustles[skillId] = {
      skillId, monthlyIncome: 0, totalEarned: 0, releases: [], automated: false, releasesThisYear: 0,
    };
  }
  const hu = c.hustles[skillId];
  const products = HUSTLE_PRODUCTS[skillId] || ['Release'];
  const idx = Math.min(products.length-1, hu.releases.length);
  const product = products[idx];
  hu.releases.push({ year: (LIFE.char.born||0)+LIFE.char.age, name: product, payout, fame:fameAdd, tier: tier.id });
  hu.totalEarned += payout;
  hu.releasesThisYear = (hu.releasesThisYear||0) + 1;
  // Royalties stream — each release adds to monthly recurring
  hu.monthlyIncome += Math.floor(payout * tier.monthlyMult / 12);
  c.money += payout;
  c.fame = clamp((c.fame||0) + fameAdd, 0, 100);
  pushEvent('career', '🎤 You released ' + product + '. Earned ' + fmtMoney(payout) + (fameAdd>0?' · Fame +' + fameAdd : ''));
  recordLegacy && fameAdd >= 8 && recordLegacy('released ' + product + ' that became a hit');
  closeModal();
  openSkills();
  renderAll();
  saveLife();
}

// Called each ageUp — runs automated releases, royalty payments, scandal rolls.
function processSideHustles(){
  const c = LIFE.char;
  if(!c.hustles) return;
  let totalRoyalty = 0;
  let totalRoyaltyCount = 0;
  Object.keys(c.hustles).forEach(sid => {
    const h = c.hustles[sid];
    h.releasesThisYear = 0; // reset annual burnout counter
    // Royalty income (capped at 12 months — annual ageUp)
    if(h.monthlyIncome > 0){
      const annual = Math.floor(h.monthlyIncome * 12);
      c.money += annual;
      totalRoyalty += annual;
      totalRoyaltyCount++;
      // Royalty decay — old releases earn less each year
      h.monthlyIncome = Math.floor(h.monthlyIncome * 0.95);
    }
    // Auto-release if toggled on and skill is high enough
    if(h.automated){
      const level = c.skills[sid] || 0;
      const tier = tierForLevel(level);
      if(tier){
        releaseProduct(sid);
      }
    }
  });
  if(totalRoyalty > 0){
    pushEvent('good', '💰 Royalties this year: ' + fmtMoney(totalRoyalty) + ' across ' + totalRoyaltyCount + ' side hustle' + (totalRoyaltyCount===1?'':'s') + '.');
  }
  // Scandal roll — only for celebs
  const fame = c.fame || 0;
  if(fame >= 40 && Math.random() < (0.04 + (fame-40)*0.002)){
    rollScandal();
  }
  // Public-backlash counter: high fame + low karma = bigger scandal chance
  if(fame >= 50 && c.karma < 35 && Math.random() < 0.08){
    rollScandal(true);
  }
}

function rollScandal(amplified){
  const c = LIFE.char;
  const s = pickRand(SCANDALS);
  let fameHit = s.fameHit * (amplified ? 1.5 : 1);
  c.fame = clamp(c.fame + fameHit, 0, 100);
  if(s.karma) c.karma = clamp(c.karma + s.karma, 0, 100);
  if(s.health) c.health = clamp(c.health + s.health, 0, 100);
  if(s.moneyMult) c.money = Math.floor(c.money * s.moneyMult);
  if(s.hustleHalt){
    Object.keys(c.hustles||{}).forEach(sid => {
      c.hustles[sid].monthlyIncome = Math.floor(c.hustles[sid].monthlyIncome * 0.4);
      c.hustles[sid].automated = false;
    });
  }
  pushEvent('bad', '📰 SCANDAL: ' + s.desc + ' Fame ' + Math.round(fameHit) + '.');
}
function practiceSkill(id){
  const c = LIFE.char;
  if(!c.skills) c.skills = {};
  const creative = (c.traits||[]).includes('creative');
  const gain = (creative ? 6 : 3) + Math.floor(c.smarts/40);
  c.skills[id] = Math.min(100, (c.skills[id]||0) + gain);

function monetizeSkill(id){

function giveGift(id){
  const c = LIFE.char;
  const g = GIFTS.find(x => x.id === id);
  if(!g) return;
  if(c.money < g.cost){ toast('Not enough money.'); return; }
  c.money -= g.cost;
  let recipientText = '';
  if(g.to === 'partner' || (g.to === 'any' && c.partner)){
    if(c.partner){
      c.partner.compat = clamp(c.partner.compat + g.boost, 0, 100);
      recipientText = 'Gave ' + g.name + ' to ' + c.partner.firstName + '. (+' + g.boost + ' compat)';
    } else {
      c.happiness = clamp(c.happiness - 2, 0, 100);
      recipientText = 'Bought ' + g.name + ' but had nobody to give it to.';
    }
  } else if(g.to === 'kid'){
    if(c.children.length){
      const kid = c.children.find(k => k.alive);
      if(kid){
        recipientText = 'Gave ' + g.name + ' to ' + kid.name + '. They loved it.';
        c.happiness = clamp(c.happiness + 4, 0, 100);
      }
    }
  }
  pushEvent('romantic', '🎁 ' + recipientText);
  c.karma = clamp(c.karma + 2, 0, 100);
  closeModal();
  openGifts();
  renderAll();
  saveLife();
}

function buyLottery(){
  const c = LIFE.char;
  if(c.age < 18){ toast('Must be 18 to buy lottery tickets.'); return; }
  if(c.money < 5){ toast('Need $5 for a ticket.'); return; }
  c.money -= 5;
  const roll = Math.random();
  let prize = 0;
  let text = '';
  if(roll < 0.0001){
    prize = 84000000; text = '🎉 JACKPOT! You won ' + fmtMoney(prize) + '!!!';
  } else if(roll < 0.001){
    prize = 250000; text = '🎉 Big win! ' + fmtMoney(prize);
  } else if(roll < 0.01){
    prize = 5000; text = '🎉 Nice win! ' + fmtMoney(prize);
  } else if(roll < 0.06){
    prize = 100; text = '🎟️ Small win! ' + fmtMoney(prize);
  } else if(roll < 0.20){
    prize = 5; text = '🎟️ You got your $5 back.';
  } else {
    text = '🎟️ No luck this time.';
  }
  if(prize > 0){ c.money += prize; c.happiness = clamp(c.happiness + Math.min(25, Math.floor(prize/1000)), 0, 100); }
  pushEvent(prize>0?'good':'', text);
  renderAll();
  saveLife();
  toast(text);
}

let _wanderInterval = null;

function avatarForChar(c){
  if(c.isVampire) return '🧛';
  let av = '👶';
  if(c.age >= 3)  av = c.sex==='m' ? '👦' : '👧';
  if(c.age >= 18) av = c.sex==='m' ? '🧑' : '👩';
  if(c.age >= 40) av = c.sex==='m' ? '👨' : '👩';
  if(c.age >= 60) av = c.sex==='m' ? '👴' : '👵';
  return av;
}

function renderHomeScene(){
  const c = LIFE.char;
  const actors = document.getElementById('hs-actors');
  const pets = document.getElementById('hs-pets');
  const decor = document.getElementById('hs-decor');
  if(!actors || !pets || !decor) return;

  // House background changes with house tier
  const house = HOUSES.find(h => h.id === c.houseId);
  const houseStatus = house ? house.status : 0;
  const hsHouse = document.getElementById('hs-house');
  if(hsHouse){
    if(houseStatus >= 9){
      hsHouse.style.background = 'linear-gradient(180deg,#5a4828 0%,#7a6038 50%,#5a4828 100%)';
      hsHouse.style.borderTopColor = '#a08a48';
    } else if(houseStatus >= 6){
      hsHouse.style.background = 'linear-gradient(180deg,#4a3828 0%,#6a5030 50%,#4a3828 100%)';
      hsHouse.style.borderTopColor = '#8a6838';
    } else {
      hsHouse.style.background = 'linear-gradient(180deg,#3a2818 0%,#4a3020 50%,#3a2820 100%)';
    }
  }

  // Actors: player + partner + kids + parents (if alive)
  const all = [];
  all.push({key:'player', emoji:avatarForChar(c), label:'You', isPlayer:true});
  if(c.partner && c.partner.alive !== false){
    const pAge = c.partner.age || 30;
    let pe = c.partner.sex==='m' ? (pAge<25?'🧑':pAge<55?'👨':'👴') : (pAge<25?'👩':pAge<55?'👩':'👵');
    all.push({key:'partner', emoji:pe, label:c.partner.firstName});
  }
  (c.children||[]).forEach(k => {
    if(!k.alive) return;
    let e = k.age<1?'👶':k.age<6?(k.sex==='m'?'👦':'👧'):k.age<18?(k.sex==='m'?'🧒':'🧒'):(k.sex==='m'?'🧑':'👩');
    all.push({key:'kid_'+k.name, emoji:e, label:k.name});
  });
  if(c.parents){
    ['mom','dad'].forEach(p => {
      const par = c.parents[p];
      if(par && par.alive){
        all.push({key:'parent_'+p, emoji:p==='mom'?'👵':'👴', label:par.firstName});
      }
    });
  }
  actors.innerHTML = all.map((a,i) => {
    const left = 8 + (i * (84 / Math.max(1, all.length-0.5))) + Math.random()*4;
    return '<div class="hs-actor ' + (a.isPlayer?'player':'') + '" id="hs-actor-' + i + '" '
      + 'style="left:' + left + '%;">'
      + a.emoji
      + '<div class="hs-actor-label">' + a.label + '</div>'
      + '</div>';
  }).join('');

  // Pets — bouncing along the floor
  const alivePets = (c.pets||[]).filter(p => p.alive);
  pets.innerHTML = alivePets.map((pet,i) => {
    const p = PETS.find(x => x.id === pet.id);
    const left = 10 + Math.random()*78;
    return '<div class="hs-pet bouncing" id="hs-pet-' + i + '" style="left:' + left + '%;animation-delay:' + (i*0.2) + 's;">'
      + (p?p.ico:'🐾') + '</div>';
  }).join('');

  // Decor — owned house upgrades show as background items
  const decorMap = {
    kitchen:'🍳', bedroom:'🛏️', bathroom:'🛁', garden:'🌷', gym:'🏋️',
    theater:'📺', gameroom:'🎮', library:'📚', pool:'🌊', office:'💻',
    studio:'🎨', guesthouse:'🏡', wine:'🍷', meditation:'🧘', workshop:'🔨',
  };
  const ownedRooms = (c.rooms||[]).slice(0,8); // cap at 8 visible
  decor.innerHTML = ownedRooms.map((rid,i) => {
    const e = decorMap[rid] || '✨';
    const top = -4 + Math.random()*8;
    const left = 5 + (i*11) + Math.random()*3;
    return '<div class="hs-decor-item" style="left:' + left + '%;bottom:' + top + 'px;">' + e + '</div>';
  }).join('');

  // Start wander animation
  if(_wanderInterval) clearInterval(_wanderInterval);
  _wanderInterval = setInterval(wanderActors, 3000);
}

function wanderActors(){
  document.querySelectorAll('#hs-actors .hs-actor').forEach(el => {
    const left = parseFloat(el.style.left) || 50;
    const newLeft = clamp(left + (Math.random() - 0.5) * 20, 4, 88);
    el.style.left = newLeft + '%';
  });
  document.querySelectorAll('#hs-pets .hs-pet').forEach(el => {
    const left = parseFloat(el.style.left) || 50;
    const newLeft = clamp(left + (Math.random() - 0.5) * 24, 4, 92);
    el.style.left = newLeft + '%';
  });
}

function toggleHomeScene(){
  const el = document.getElementById('home-scene');
  const t = document.getElementById('hs-toggle');
  if(!el) return;
  el.classList.toggle('collapsed');
  if(t) t.textContent = el.classList.contains('collapsed') ? '▴' : '▾';
}

function homeSceneClick(e){
  const scene = document.getElementById('home-scene');
  if(!scene) return;
  const rect = scene.getBoundingClientRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  // Move the player avatar (first .hs-actor.player) to the click x
  const playerEl = scene.querySelector('.hs-actor.player');
  if(playerEl){
    playerEl.style.left = clamp(xPct, 4, 92) + '%';
  }
  // Also nudge other actors and pets toward the click for a "they follow you" effect
  const drift = (Math.random() - 0.5) * 12;
  scene.querySelectorAll('.hs-actor:not(.player), .hs-pet').forEach(el => {
    const newLeft = clamp(xPct + drift + (Math.random()-0.5)*18, 4, 92);
    el.style.left = newLeft + '%';
  });
}

  c.friends.push({
    firstName: fname, lastName: lname, sex: sex,
    age: c.age + rangeRand(-3, +3),
    occupation: occ, friendship: rangeRand(40, 75),
    metAt: c.age, alive: true,

  });
  pushEvent('good', '👋 You made a new friend: ' + fname + ' (' + occ + '). Friendship at ' + c.friends[c.friends.length-1].friendship + '%.');
}

function ageFriendsAndDrift(){
  const c = LIFE.char;
  if(!c.friends) return;
  c.friends.forEach(f => {
    if(!f.alive) return;
    f.age++;
    // Friendships drift down without contact
    if(Math.random() < 0.4){
      f.friendship = clamp(f.friendship - 1, 0, 100);
    }
    // Friends can die in late life
    if(f.age > 70 && Math.random() < 0.02){
      f.alive = false;
      pushEvent('death', '😔 Your ' + f.nickname + ' ' + f.firstName + ' passed away at age ' + f.age + '.');
      c.happiness = clamp(c.happiness - 12, 0, 100);
    }
  });
}

function openFriends(){
  const c = LIFE.char;
  if(c.age < 6){ toast('Too young for friends outside the family.'); return; }
  if(!c.friends) c.friends = [];
  const alive = c.friends.filter(f => f.alive);
  let html = '';
  if(!alive.length){
    html += '<div class="fam-empty">You haven\'t made any friends yet. Friends appear naturally as you age. Or try going to school / a club to speed it up.</div>';
  } else {
    alive.forEach((f,i) => {
      const fIdx = c.friends.indexOf(f);
      const compatCls = f.friendship >= 70 ? 'good' : f.friendship <= 30 ? 'bad' : '';
      html += '<div class="card">'
        + '<div class="card-ico">' + (f.sex==='m'?'🧑':'👩') + '</div>'
        + '<div class="card-body"><div class="card-title">' + f.firstName + ' ' + f.lastName + '</div>'
        + '<div class="card-meta">' + f.nickname + ' · Age ' + f.age + ' · ' + f.occupation + '</div>'
        + '<div class="card-meta" style="color:' + (f.friendship>=60?'var(--green)':f.friendship>=40?'var(--gold)':'var(--crimson)') + ';">Friendship ' + f.friendship + '%</div></div>'
        + '<div class="card-act">'
        + '<button class="card-btn" onclick="hangOut(' + fIdx + ')">Hang Out</button>'
        + '<button class="card-btn danger" onclick="cutOffFriend(' + fIdx + ')">Cut Off</button>'
        + '</div></div>';
    });
  }
  html += '<button class="card-btn green" style="width:100%;margin-top:12px;padding:10px;" onclick="meetSomeone()">🌟 Try to Make a New Friend</button>';
  openModal('👋 Friends (' + alive.length + ')', html);
}
function hangOut(idx){
  const c = LIFE.char;
  const f = c.friends[idx];
  if(!f) return;
  c.money -= 40;
  if(Math.random() < 0.7){
    f.friendship = clamp(f.friendship + 12, 0, 100);
    c.happiness = clamp(c.happiness + 6, 0, 100);
    pushEvent('good', '🥂 Hung out with ' + f.firstName + '. Friendship +12.');
  } else {
    f.friendship = clamp(f.friendship - 6, 0, 100);
    pushEvent('bad', '😬 Awkward hangout with ' + f.firstName + '. Friendship -6.');
  }
  closeModal();
  openFriends();
  renderAll();
  saveLife();
}
function cutOffFriend(idx){
  const c = LIFE.char;
  const f = c.friends[idx];
  if(!f) return;
  if(!confirm('Cut off ' + f.firstName + '? They will disappear from your friends list.')) return;
  f.alive = false;
  pushEvent('bad', '✂️ You cut off ' + f.firstName + ' for good.');

  openFriends();
  renderAll();
  saveLife();
}
function meetSomeone(){
  const c = LIFE.char;
  if(!c.friends) c.friends = [];
  if(c.friends.filter(f=>f.alive).length >= 12){ toast('You already have a lot of friends.'); return; }

function bookTravel(id){

    if(k === 'looks')     c.looks     = clamp(c.looks + fx[k], 0, 100);

    if(k === 'health')    c.health    = clamp(c.health + fx[k], 0, 100);
    if(k === 'faith')     c.faith     = clamp(c.faith + fx[k], 0, 100);
    if(k === 'fame')      c.fame      = clamp((c.fame||0) + fx[k], 0, 100);
  });

  c.placesVisited.push(d.id);

  saveLife();
}

function openSubstances(){

      + '<button class="card-btn" onclick="useSubstance(\'' + s.id + '\')">Use</button></div></div>';
  });
  openModal('🍷 Substances', html);
}
function useSubstance(id){
  const c = LIFE.char;
  const s = SUBSTANCES.find(x => x.id === id);
  if(!s) return;
  if(c.money < s.cost){ toast('Not enough money.'); return; }
  c.money -= s.cost;
  const fx = s.fx;
  Object.keys(fx).forEach(k => {
    if(c[k] != null) c[k] = clamp(c[k] + fx[k], 0, 100);
  });
  // Addiction roll
  if(!c.addictions) c.addictions = [];
  if(!c.addictions.includes(s.id) && Math.random() < s.addict){
    c.addictions.push(s.id);
    pushEvent('bad', '🚨 You got addicted to ' + s.name + '. You will lose health and money each year until you go to rehab.');
  } else {
    pushEvent('', '💊 Used ' + s.name + '.');
  }
  // Illegal: chance of arrest
  if(s.illegal && Math.random() < 0.06){
    pushEvent('bad', '🚓 You were caught with ' + s.name + ' on you.');
    goToJail(rangeRand(1,3), s.name.toLowerCase() + ' possession');
  }
  closeModal();
  openSubstances();
  renderAll();
  saveLife();
}
function rehab(id){
  const c = LIFE.char;
  if(c.money < 8000){ toast('Rehab costs $8,000.'); return; }
  c.money -= 8000;
  c.addictions = (c.addictions||[]).filter(x => x !== id);
  c.health = clamp(c.health + 8, 0, 100);
  c.happiness = clamp(c.happiness + 12, 0, 100);
  pushEvent('milestone', '🌅 You completed rehab for ' + (SUBSTANCES.find(s=>s.id===id)||{}).name + '. Health and happiness recovering.');
  closeModal();
  openSubstances();
  renderAll();
  saveLife();
}
function processAddictionsYearly(){
  const c = LIFE.char;
  if(!c.addictions || !c.addictions.length) return;
  c.addictions.forEach(id => {
    const s = SUBSTANCES.find(x => x.id === id);
    if(!s) return;
    c.money -= s.cost * 50; // chronic use
    c.health = clamp(c.health + (s.fx.health||0) * 4, 0, 100);
    c.happiness = clamp(c.happiness - 2, 0, 100);
  });
}

function computeAchievements(){
  const c = LIFE.char;
  const list = [];
  if(c.age >= 18) list.push({ico:'🎓', label:'Reached Adulthood'});
  if(c.degrees && c.degrees.includes('medical')) list.push({ico:'⚕️', label:'Graduated Medical School'});
  if(c.degrees && c.degrees.includes('law')) list.push({ico:'⚖️', label:'Graduated Law School'});
  if(c.degrees && c.degrees.includes('phd')) list.push({ico:'🔬', label:'Earned a PhD'});
  if(c.degrees && c.degrees.includes('business')) list.push({ico:'💼', label:'Earned an M.B.A.'});
  if(c.college) list.push({ico:'🏫', label:'Attended ' + (COLLEGES.find(x=>x.id===c.college)||{name:'College'}).name});
  if(c.partner && c.partner.married) list.push({ico:'💍', label:'Got Married'});
  if(c.children && c.children.length) list.push({ico:'👶', label:'Had ' + c.children.length + ' Child' + (c.children.length>1?'ren':'')});
  if(c.career && c.career.totalYears >= 20) list.push({ico:'🏆', label:'20+ Years in a Career'});
  if((c.money + (c.savings||0) + (c.investments||0)) >= 1000000) list.push({ico:'💰', label:'Millionaire'});
  if((c.money + (c.savings||0) + (c.investments||0)) >= 10000000) list.push({ico:'💎', label:'Decamillionaire'});
  if((c.money + (c.savings||0) + (c.investments||0)) >= 100000000) list.push({ico:'🌟', label:'Centimillionaire'});
  if(c.houseId === 'mansion') list.push({ico:'🏰', label:'Owned a Mansion'});
  if(c.houseId === 'island')  list.push({ico:'🏝️', label:'Owned a Private Island'});
  if(c.fame >= 80) list.push({ico:'⭐', label:'Famous'});
  if(c.fame >= 95) list.push({ico:'🌟', label:'Global Celebrity'});
  if(c.karma >= 90) list.push({ico:'😇', label:'Saintly Karma'});
  if(c.karma <= 10) list.push({ico:'😈', label:'Evil Reputation'});
  if(c.faith >= 90) list.push({ico:'🕊️', label:'Devout'});
  if(c.placesVisited && c.placesVisited.length >= 6) list.push({ico:'🌍', label:'World Traveler'});
  if(c.placesVisited && c.placesVisited.includes('space')) list.push({ico:'🚀', label:'Went to Space'});
  if(c.isVampire) list.push({ico:'🧛', label:'Vampire'});
  if(c.career && c.career.key === 'politician' && c.career.rungIdx >= 4) list.push({ico:'🏛️', label:'Head of State'});
  if(c.career && c.career.key === 'lawyer' && c.career.rungIdx >= 5) list.push({ico:'⚖️', label:'Supreme Court Justice'});
  if(c.career && c.career.key === 'doctor' && c.career.rungIdx >= 3) list.push({ico:'⚕️', label:'White House Physician'});
  if(c.career && c.career.key === 'ceo' && c.career.rungIdx >= 4) list.push({ico:'🏢', label:'Fortune 500 CEO'});
  if(c.skills){
    Object.keys(c.skills).forEach(s => {
      if(c.skills[s] >= 100){
        const sk = SKILLS.find(x => x.id === s);
        if(sk) list.push({ico:sk.ico, label:'Mastered ' + sk.name});
      }
    });
  }
  if(c.children && c.children.some(k => !k.alive)) list.push({ico:'🕯️', label:'Lost a Child'});
  if(c.addictions && c.addictions.length === 0 && c.flags && c.flags.recoveredAddiction) list.push({ico:'🌅', label:'Survived Addiction'});
  return list;
}
function openAchievements(){
  const c = LIFE.char;
  const list = computeAchievements();
  let html = '';
  if(!list.length){
    html += '<div class="fam-empty">No achievements yet. Live your life. They\'ll come.</div>';
  } else {
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;">';
    list.forEach(a => {
      html += '<div style="padding:14px 12px;background:#1a1428;border:1px solid var(--accent);border-radius:6px;text-align:center;">'
        + '<div style="font-size:32px;line-height:1;margin-bottom:5px;">' + a.ico + '</div>'
        + '<div style="font-size:12px;color:var(--accent2);font-weight:600;">' + a.label + '</div>'
        + '</div>';
    });
    html += '</div>';
  }
  openModal('🏆 Achievements (' + list.length + ')', html);
}

function cityWalkTo(x, y, buildingId){
  _cityPlayerPos = { x, y };
  const p = document.getElementById('cm-player');
  if(p){ p.style.left = x + '%'; p.style.top = y + '%'; }
  const status = document.getElementById('cm-status');
  const b = CITY_LAYOUT.find(x => x.id === buildingId);
  if(b && status){
    status.textContent = 'Walking to ' + b.name + '...';
  }
  // After walk animation, trigger interaction
  setTimeout(() => {
    if(b && b.action){
      cityInteract(b);
    }
  }, 820);
}

function cityWalkAnywhere(e){
  // Walk to a free spot on the map (not a building)
  const map = document.getElementById('city-map');
  if(!map) return;
  const rect = map.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width)  * 100;
  const y = ((e.clientY - rect.top)  / rect.height) * 100;
  _cityPlayerPos = { x: clamp(x, 2, 96), y: clamp(y, 2, 92) };
  const p = document.getElementById('cm-player');
  if(p){ p.style.left = _cityPlayerPos.x + '%'; p.style.top = _cityPlayerPos.y + '%'; }
  const status = document.getElementById('cm-status');
  if(status) status.textContent = '🚶 Strolling around the neighborhood...';
}

// Arrow-key control for the city map and the home scene
window.addEventListener('keydown', e => {
  // Skip if typing
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  // Only when city map modal is open
  const modal = document.getElementById('modal');
  const onMap = modal && modal.classList.contains('show') && document.getElementById('city-map');
  if(!onMap) return;
  const step = 6;
  let moved = false;
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){
    _cityPlayerPos.x = clamp(_cityPlayerPos.x - step, 2, 96); moved = true;
  } else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){
    _cityPlayerPos.x = clamp(_cityPlayerPos.x + step, 2, 96); moved = true;
  } else if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){
    _cityPlayerPos.y = clamp(_cityPlayerPos.y - step, 2, 92); moved = true;
  } else if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){
    _cityPlayerPos.y = clamp(_cityPlayerPos.y + step, 2, 92); moved = true;
  }
  if(moved){
    e.preventDefault();
    const p = document.getElementById('cm-player');
    if(p){ p.style.left = _cityPlayerPos.x + '%'; p.style.top = _cityPlayerPos.y + '%'; }
    // Check if player walked onto a building
    for(const b of CITY_LAYOUT){
      if(Math.abs(b.x - _cityPlayerPos.x) < 5 && Math.abs(b.y - _cityPlayerPos.y) < 5){
        const status = document.getElementById('cm-status');
        if(status) status.textContent = '↩ Press [Enter] to enter ' + b.name;
        if(e.key === 'Enter'){
          cityInteract(b);
        }
        break;
      }
    }
  } else if(e.key === 'Enter'){
    // Enter triggers nearest building
    let nearest = null, minDist = 999;
    for(const b of CITY_LAYOUT){
      const dist = Math.abs(b.x - _cityPlayerPos.x) + Math.abs(b.y - _cityPlayerPos.y);
      if(dist < minDist){ minDist = dist; nearest = b; }
    }
    if(nearest && minDist < 10){ cityInteract(nearest); }
  }
});

function cityInteract(b){
  closeModal();
  const fn = window[b.action];
  if(typeof fn === 'function'){
    if(b.action === 'visitNeighbor'){ visitNeighbor(b.npcKey); }
    else { fn(); }
  } else {
    toast(b.name + ' — nothing to do here right now.');
  }
}

const GENETIC_DISEASES = [
  {id:'diabetes',  name:'Type 1 Diabetes',     ico:'🩸', healthDrift:-1, happyDrift:0,  inherit:0.18, onset:8},
  {id:'cancerProne',name:'Cancer-Prone',       ico:'🧬', healthDrift:-1, happyDrift:0,  inherit:0.25, onset:40},
  {id:'heart',     name:'Heart Condition',     ico:'❤️', healthDrift:-2, happyDrift:0,  inherit:0.22, onset:35},
  {id:'depression',name:'Clinical Depression', ico:'🌧️', healthDrift:0,  happyDrift:-2, inherit:0.30, onset:14},
  {id:'anxiety',   name:'Anxiety Disorder',    ico:'😰', healthDrift:0,  happyDrift:-1, inherit:0.32, onset:12},
  {id:'autism',    name:'Autism Spectrum',     ico:'🧩', healthDrift:0,  happyDrift:0,  smartsDrift:+1, inherit:0.25, onset:3},
  {id:'sicklecell',name:'Sickle Cell',         ico:'🩹', healthDrift:-2, happyDrift:-1, inherit:0.20, onset:1},
  {id:'huntington',name:'Huntington\'s',       ico:'🧠', healthDrift:-3, happyDrift:-2, inherit:0.50, onset:38, dominant:true},
  {id:'colorblind',name:'Colorblindness',      ico:'🌈', healthDrift:0,  happyDrift:0,  inherit:0.15, onset:5},
  {id:'celiac',    name:'Celiac Disease',      ico:'🌾', healthDrift:-1, happyDrift:0,  inherit:0.18, onset:10},
  {id:'longevity', name:'Longevity Gene',      ico:'⏳', healthDrift:+1, happyDrift:0,  inherit:0.20, onset:0, beneficial:true},
  {id:'highIQ',    name:'High-IQ Genetics',    ico:'🧠', smartsDrift:+1, happyDrift:0,  inherit:0.20, onset:0, beneficial:true},
];

function assignGeneticDiseases(){
  const c = LIFE.char;
  if(!c.diseases) c.diseases = [];
  const parentDiseases = (c.parents && c.parents.mom && c.parents.mom.diseases || [])
    .concat(c.parents && c.parents.dad && c.parents.dad.diseases || []);
  GENETIC_DISEASES.forEach(d => {
    // Parents carry it -> higher inherit chance; otherwise base low chance for de novo
    const parentHas = parentDiseases.includes(d.id);
    const chance = parentHas ? d.inherit : (d.beneficial ? d.inherit * 0.5 : 0.04);
    if(Math.random() < chance){
      c.diseases.push(d.id);
    }
  });
}

function processGeneticDiseases(){
  const c = LIFE.char;
  if(!c.diseases || !c.diseases.length) return;
  c.diseases.forEach(did => {
    const d = GENETIC_DISEASES.find(x => x.id === did);
    if(!d) return;
    if(c.age < d.onset) return;
    if(c.age === d.onset){
      const verb = d.beneficial ? '✨' : '🩺';
      pushEvent(d.beneficial?'good':'bad', verb + ' Diagnosed with ' + d.name + '.');
    }
    if(d.healthDrift) c.health    = clamp(c.health + d.healthDrift, 0, 100);
    if(d.happyDrift)  c.happiness = clamp(c.happiness + d.happyDrift, 0, 100);
    if(d.smartsDrift) c.smarts    = clamp(c.smarts + d.smartsDrift, 0, 100);
  });
}
