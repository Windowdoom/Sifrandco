function rollHousingDisaster(){
  const c = LIFE.char;
  if(c.houseId === 'family') return;
  for(const d of HOUSING_DISASTERS){
    if(Math.random() < d.prob){
      const damage = rangeRand(d.damage[0], d.damage[1]);
      const country = COUNTRIES[c.country];
      const adjusted = Math.floor(damage * country.costMult);
      let coverText = '';
      if(c.insurance && c.insurance.home){
        const covered = Math.floor(adjusted * 0.85);
        c.money -= (adjusted - covered);
        coverText = ' Home insurance covered ' + fmtMoney(covered) + '. You paid ' + fmtMoney(adjusted - covered) + '.';
      } else {
        c.money -= adjusted;
        coverText = ' No insurance. You paid ' + fmtMoney(adjusted) + ' out of pocket.';
      }
      pushEvent('bad', d.name + ' — ' + d.desc + coverText, {money:-adjusted});
      c.happiness = clamp(c.happiness - 6, 0, 100);
      return; // one disaster per year max
    }
  }
}

function rollApocalypseEvent(){
  const c = LIFE.char;
  if(!c.reality) return;
  const pool = APOCALYPSE_EVENTS.filter(e => e.reality === c.reality);
  if(!pool.length) return;
  if(Math.random() < 0.025){
    const ev = pickRand(pool);
    if(!c.flags['apoc_'+ev.id]){
      c.flags['apoc_'+ev.id] = true;
      const fx = ev.fx || {};
      if(fx.happiness) c.happiness = clamp(c.happiness + fx.happiness, 0, 100);
      if(fx.health)    c.health    = clamp(c.health + fx.health, 0, 100);
      if(fx.smarts)    c.smarts    = clamp(c.smarts + fx.smarts, 0, 100);
      if(fx.karma)     c.karma     = clamp(c.karma + fx.karma, 0, 100);
      if(fx.faith)     c.faith     = clamp(c.faith + fx.faith, 0, 100);
      if(ev.money)     c.money    += ev.money;
      pushEvent('death', '☢ ' + ev.text, fx);
    }
  }
}

function processBankingInterest(){
  const c = LIFE.char;
  // Savings APR is 4% by default
  if(c.savings > 0){
    const yield_ = Math.floor(c.savings * 0.04);
    c.savings += yield_;
    if(yield_ > 100){
      pushEvent('good', '🏦 Savings yielded ' + fmtMoney(yield_) + ' in interest.', {money:0});
    }
  }
  if(c.investments > 0){
    // 8% average return with volatility (-10% to +18%)
    const swing = 0.04 + Math.random() * 0.14;
    const direction = Math.random() < 0.7 ? +1 : -1;
    const returnRate = direction > 0 ? swing : -swing/2;
    const change = Math.floor(c.investments * returnRate);
    c.investments += change;
    if(c.investments < 0) c.investments = 0;
    if(Math.abs(change) > 500){
      const tag = change > 0 ? 'good' : 'bad';
      pushEvent(tag, '📈 Investments ' + (change>0?'gained':'lost') + ' ' + fmtMoney(Math.abs(change)) + ' this year.', {money:0});
    }
  }
}

function rollFaithEvent(){
  const c = LIFE.char;
  if(!c.religion) return;
  // Faith decays slightly each year if not practiced
  if(Math.random() < 0.3){
    c.faith = clamp(c.faith - 1, 0, 100);
  }
  // Random religious events
  if(Math.random() < 0.05){
    const rel = RELIGIONS[c.religion];
    const events = [
      {text:'You attended ' + rel.holyDay + ' service. Felt centered.', fx:{faith:+3, happiness:+3}},
      {text:'A passage from your scriptures struck you deeply this week.', fx:{faith:+4, smarts:+1}},
      {text:'You helped organize a religious community event.', fx:{faith:+5, karma:+5}},
      {text:'You had a moment of doubt about your faith.', fx:{faith:-5, smarts:+1}},
    ];
    const ev = pickRand(events);
    const fx = ev.fx;
    if(fx.faith)     c.faith     = clamp(c.faith + fx.faith, 0, 100);
    if(fx.happiness) c.happiness = clamp(c.happiness + fx.happiness, 0, 100);
    if(fx.smarts)    c.smarts    = clamp(c.smarts + fx.smarts, 0, 100);
    if(fx.karma)     c.karma     = clamp(c.karma + fx.karma, 0, 100);
    pushEvent('', '🕊️ ' + ev.text, fx);
  }
}

function doReligious(id){
  const c = LIFE.char;
  const a = RELIGIOUS_ACTIVITIES.find(x => x.id === id);

  if(a.cost && c.money < a.cost){ toast('Not enough money.'); return; }

  const fx = a.fx;
  if(fx.faith)     c.faith     = clamp(c.faith + fx.faith, 0, 100);
  if(fx.happiness) c.happiness = clamp(c.happiness + fx.happiness, 0, 100);
  if(fx.karma)     c.karma     = clamp(c.karma + fx.karma, 0, 100);

  if(fx.smarts)    c.smarts    = clamp(c.smarts + fx.smarts, 0, 100);
  pushEvent('good', '🕊️ ' + a.name + ' — ' + a.desc, fx);

  openReligion();
  renderAll();
  saveLife();
}

function bankTransfer(action, amount){
  const c = LIFE.char;
  if(action === 'tosavings'){
    if(c.money < amount){ toast('Not enough cash.'); return; }
    c.money -= amount; c.savings = (c.savings||0) + amount;
  } else if(action === 'toinvest'){
    if(c.money < amount){ toast('Not enough cash.'); return; }
    c.money -= amount; c.investments = (c.investments||0) + amount;
  } else if(action === 'fromsavings'){
    if((c.savings||0) < amount){ toast('Not enough in savings.'); return; }
    c.savings -= amount; c.money += amount;
  } else if(action === 'frominvest'){
    if((c.investments||0) < amount){ toast('Not enough in investments.'); return; }
    c.investments -= amount; c.money += amount;
  }
  closeModal();
  openBanking();
  renderAll();
  saveLife();
}

function toggleInsurance(t){
  const c = LIFE.char;
  if(!c.insurance) c.insurance = { home:false, health:false, life:false, auto:false };
  const cost = { home:1800, health:3600, life:1200, auto:1600 }[t];
  if(c.insurance[t]){
    c.insurance[t] = false;
    pushEvent('milestone', '🛡️ You cancelled your ' + t + ' insurance.');
  } else {
    if(c.money < cost){ toast('Not enough to pay the first year premium.'); return; }
    c.money -= cost;
    c.insurance[t] = true;
    pushEvent('milestone', '🛡️ You bought ' + t + ' insurance for ' + fmtMoney(cost) + '/yr.');
  }
  closeModal();
  openBanking();
  renderAll();
  saveLife();
}

        + '<div class="card-act">'
        + '<button class="card-btn ' + (meets?'':'muted') + '" ' + (meets?'':'disabled') + ' onclick="applyToCollege(\'' + col.id + '\')">Apply</button>'
        + '</div></div>';
    });
  }

  // ─── DEGREE PROGRAMS (Bachelor's + Grad School) ───
  html += '<div style="font-family:var(--font-m);font-size:10px;color:var(--accent2);letter-spacing:.22em;text-transform:uppercase;margin:18px 0 10px;">Degree Programs</div>';
  html += '<div style="font-size:12px;color:var(--t3);font-style:italic;margin-bottom:10px;line-height:1.5;">'
    + '<b>Path to Med School:</b> Smarts 78+ → Enroll in Medical School (4 yrs, $240k) → Apply for Medical Resident in the Career menu.<br>'
    + '<b>Path to Law:</b> Smarts 72+ → Law School (3 yrs) → Apply as Junior Associate.<br>'
    + '<b>Path to MBA / CEO:</b> Smarts 60+ → M.B.A. (2 yrs) → Apply as Corporate Director.<br>'
    + '<b>Path to PhD / Scientist:</b> Smarts 75+ → PhD (5 yrs) → Apply as PhD Researcher.</div>';
  if(c.age < 18){
    html += '<div style="color:var(--t3);font-size:12px;padding:8px;text-align:center;">Available at age 18.</div>';
  } else {
    Object.keys(DEGREES).forEach(k => {
      const d = DEGREES[k];
      const owned = c.degrees && c.degrees.includes(k);
      const current = c.degree === k;
      const meets = c.smarts >= d.minSmarts;
      const cost = Math.floor(d.cost * country.costMult);
      const tag = owned ? '<span class="card-tag">COMPLETED ✓</span>'
                  : current ? '<span class="card-tag req">IN PROGRESS</span>'
                  : '';
      let btn = '';
      if(!owned && !current){
        const can = meets && !c.degree;
        btn = '<button class="card-btn ' + (can?'green':'muted') + '" ' + (can?'':'disabled') + ' onclick="enrollDegree(\'' + k + '\')">Enroll</button>';
      } else if(current){
        btn = '<button class="card-btn danger" onclick="dropOut()">Drop Out</button>';
      }
      html += '<div class="card" style="' + (owned?'border-color:var(--accent);background:#1a1428;':'') + '">'
        + '<div class="card-ico">' + (k==='medical'?'⚕️':k==='law'?'⚖️':k==='business'?'💼':k==='phd'?'🔬':'📚') + '</div>'
        + '<div class="card-body"><div class="card-title">' + d.name + '</div>'
        + '<div class="card-meta">' + d.years + ' yrs · Min Smarts ' + d.minSmarts + (meets?' ✓':' ✗') + ' · Tuition ' + fmtMoney(cost) + '</div></div>'
        + '<div class="card-act">' + (tag?'<div>'+tag+'</div>':'') + btn + '</div></div>';
    });
  }

  openModal('🎓 Education', html);
}

function studyHighSchool(){
  const c = LIFE.char;
  c.smarts = clamp(c.smarts + 4, 0, 100);
  c.happiness = clamp(c.happiness - 2, 0, 100);
  pushEvent('milestone', '📖 You buckled down at school this year. +4 Smarts.');
  closeModal();
  openColleges();
  renderAll();
  saveLife();
}

function applyToCollege(id){
  const c = LIFE.char;
  const col = COLLEGES.find(x => x.id === id);
  if(!col) return;
  // Acceptance probability: base accept rate, modified by smarts overshoot
  const smartsOvershoot = (c.smarts - col.minSmarts) / 100;
  const odds = col.accept + smartsOvershoot * 0.5;
  if(Math.random() < odds){
    c.college = id;
    pushEvent('milestone', '🎉 You got accepted to ' + col.name + '!');
    c.happiness = clamp(c.happiness + 12, 0, 100);
  } else {
    pushEvent('bad', '📪 ' + col.name + ' rejected your application.');
    c.happiness = clamp(c.happiness - 6, 0, 100);
  }
  closeModal();
  renderAll();
  saveLife();
}

function openQuickJobs(){
  const c = LIFE.char;
  if(c.age < 16){ toast('Too young to work.'); return; }
  let html = '<div style="color:var(--t3);font-size:13px;margin-bottom:14px;text-align:center;font-style:italic;">Quick jobs — flat salaries, no promotion ladders, but plenty of variety. ' + QUICK_JOBS.length + ' to choose from.</div>';
  QUICK_JOBS.forEach(j => {
    const country = COUNTRIES[c.country];
    const salary = Math.floor(j.salary * country.salaryMult);
    const meetsAge = c.age >= (j.minAge || 16);
    const meetsSmarts = !j.minSmarts || c.smarts >= j.minSmarts;
    const meetsLooks  = !j.minLooks  || c.looks  >= j.minLooks;
    const meetsHealth = !j.minHealth || c.health >= j.minHealth;
    const hasDeg = !j.requiresDegree || c.degrees.includes(j.requiresDegree);
    const eligible = meetsAge && meetsSmarts && meetsLooks && meetsHealth && hasDeg && !c.inJail;
    const reqs = [];
    if(j.minAge && j.minAge > 16) reqs.push('Age ' + j.minAge + '+');
    if(j.minSmarts) reqs.push('Smarts ' + j.minSmarts + '+');
    if(j.minLooks) reqs.push('Looks ' + j.minLooks + '+');
    if(j.minHealth) reqs.push('Health ' + j.minHealth + '+');
    if(j.requiresDegree) reqs.push((hasDeg?'✓ ':'✗ ') + DEGREES[j.requiresDegree].name);
    html += '<div class="card">'
      + '<div class="card-ico">' + j.ico + '</div>'
      + '<div class="card-body"><div class="card-title">' + j.title + '</div>'
      + (reqs.length ? '<div class="card-meta">' + reqs.join(' · ') + '</div>' : '')
      + '</div>'
      + '<div class="card-act"><div class="card-pay">' + fmtMoney(salary) + '/yr</div>'

}

function adoptPet(id){
  const c = LIFE.char;
  const p = PETS.find(x => x.id === id);

  if(!c.pets) c.pets = [];
  c.pets.push({ id:p.id, name: name || 'Pet', age: 0, alive: true });

}

function practiceSkill(id){
  const c = LIFE.char;
  if(!c.skills) c.skills = {};
  const creative = (c.traits||[]).includes('creative');
  const gain = (creative ? 6 : 3) + Math.floor(c.smarts/40);
  c.skills[id] = Math.min(100, (c.skills[id]||0) + gain);
  pushEvent('good', '🎯 Practiced ' + SKILLS.find(x=>x.id===id).name + '. +' + gain + ' to that skill.');

  renderAll();

function monetizeSkill(id){
  const c = LIFE.char;
  const level = (c.skills && c.skills[id]) || 0;
  if(level < 60){ toast('Skill must be at least level 60.'); return; }
  // Pay scales with level
  const base = (level - 50) * 80;
  const luck = 0.5 + Math.random() * 1.5;
  const pay = Math.floor(base * luck);
  c.money += pay;
  pushEvent('career', '💰 You monetized ' + SKILLS.find(x=>x.id===id).name + ' — earned ' + fmtMoney(pay) + '.');
  closeModal();
  openSkills();
  renderAll();
  saveLife();
}

function giveGift(id){
  const c = LIFE.char;
  const g = GIFTS.find(x => x.id === id);

  if(c.money < g.cost){ toast('Not enough money.'); return; }
  c.money -= g.cost;
  let recipientText = '';
  if(g.to === 'partner' || (g.to === 'any' && c.partner)){
    if(c.partner){
      c.partner.compat = clamp(c.partner.compat + g.boost, 0, 100);
      recipientText = 'Gave ' + g.name + ' to ' + c.partner.firstName + '. (+' + g.boost + ' compat)';
    } else {
      c.happiness = clamp(c.happiness - 2, 0, 100);
      recipientText = 'Bought ' + g.name + ' but had nobody to give it to.';
    }
  } else if(g.to === 'kid'){
    if(c.children.length){
      const kid = c.children.find(k => k.alive);
      if(kid){
        recipientText = 'Gave ' + g.name + ' to ' + kid.name + '. They loved it.';
        c.happiness = clamp(c.happiness + 4, 0, 100);

//  LOTTERY — buy a ticket, hope
// ═══════════════════════════════════════════════════════════════════════
function buyLottery(){
  const c = LIFE.char;
  if(c.age < 18){ toast('Must be 18 to buy lottery tickets.'); return; }
  if(c.money < 5){ toast('Need $5 for a ticket.'); return; }
  c.money -= 5;
  const roll = Math.random();
  let prize = 0;
  let text = '';
  if(roll < 0.0001){
    prize = 84000000; text = '🎉 JACKPOT! You won ' + fmtMoney(prize) + '!!!';
  } else if(roll < 0.001){
    prize = 250000; text = '🎉 Big win! ' + fmtMoney(prize);
  } else if(roll < 0.01){
    prize = 5000; text = '🎉 Nice win! ' + fmtMoney(prize);
  } else if(roll < 0.06){
    prize = 100; text = '🎟️ Small win! ' + fmtMoney(prize);
  } else if(roll < 0.20){
    prize = 5; text = '🎟️ You got your $5 back.';
  } else {
    text = '🎟️ No luck this time.';
  }
  if(prize > 0){ c.money += prize; c.happiness = clamp(c.happiness + Math.min(25, Math.floor(prize/1000)), 0, 100); }
  pushEvent(prize>0?'good':'', text);
  renderAll();
  saveLife();
  toast(text);
}

let _wanderInterval = null;

function avatarForChar(c){
  if(c.isVampire) return '🧛';
  let av = '👶';
  if(c.age >= 3)  av = c.sex==='m' ? '👦' : '👧';
  if(c.age >= 18) av = c.sex==='m' ? '🧑' : '👩';
  if(c.age >= 40) av = c.sex==='m' ? '👨' : '👩';
  if(c.age >= 60) av = c.sex==='m' ? '👴' : '👵';
  return av;
}

function renderHomeScene(){
  const c = LIFE.char;
  const actors = document.getElementById('hs-actors');
  const pets = document.getElementById('hs-pets');
  const decor = document.getElementById('hs-decor');
  if(!actors || !pets || !decor) return;

  // House background changes with house tier
  const house = HOUSES.find(h => h.id === c.houseId);
  const houseStatus = house ? house.status : 0;
  const hsHouse = document.getElementById('hs-house');
  if(hsHouse){
    if(houseStatus >= 9){
      hsHouse.style.background = 'linear-gradient(180deg,#5a4828 0%,#7a6038 50%,#5a4828 100%)';
      hsHouse.style.borderTopColor = '#a08a48';
    } else if(houseStatus >= 6){
      hsHouse.style.background = 'linear-gradient(180deg,#4a3828 0%,#6a5030 50%,#4a3828 100%)';
      hsHouse.style.borderTopColor = '#8a6838';
    } else {
      hsHouse.style.background = 'linear-gradient(180deg,#3a2818 0%,#4a3020 50%,#3a2820 100%)';
    }
  }

  // Actors: player + partner + kids + parents (if alive)
  const all = [];
  all.push({key:'player', emoji:avatarForChar(c), label:'You', isPlayer:true});
  if(c.partner && c.partner.alive !== false){
    const pAge = c.partner.age || 30;
    let pe = c.partner.sex==='m' ? (pAge<25?'🧑':pAge<55?'👨':'👴') : (pAge<25?'👩':pAge<55?'👩':'👵');
    all.push({key:'partner', emoji:pe, label:c.partner.firstName});
  }
  (c.children||[]).forEach(k => {
    if(!k.alive) return;
    let e = k.age<1?'👶':k.age<6?(k.sex==='m'?'👦':'👧'):k.age<18?(k.sex==='m'?'🧒':'🧒'):(k.sex==='m'?'🧑':'👩');
    all.push({key:'kid_'+k.name, emoji:e, label:k.name});
  });
  if(c.parents){
    ['mom','dad'].forEach(p => {
      const par = c.parents[p];
      if(par && par.alive){
        all.push({key:'parent_'+p, emoji:p==='mom'?'👵':'👴', label:par.firstName});
      }
    });
  }
  actors.innerHTML = all.map((a,i) => {
    const left = 8 + (i * (84 / Math.max(1, all.length-0.5))) + Math.random()*4;
    return '<div class="hs-actor ' + (a.isPlayer?'player':'') + '" id="hs-actor-' + i + '" '
      + 'style="left:' + left + '%;">'
      + a.emoji
      + '<div class="hs-actor-label">' + a.label + '</div>'
      + '</div>';
  }).join('');

  // Pets — bouncing along the floor
  const alivePets = (c.pets||[]).filter(p => p.alive);
  pets.innerHTML = alivePets.map((pet,i) => {
    const p = PETS.find(x => x.id === pet.id);
    const left = 10 + Math.random()*78;
    return '<div class="hs-pet bouncing" id="hs-pet-' + i + '" style="left:' + left + '%;animation-delay:' + (i*0.2) + 's;">'
      + (p?p.ico:'🐾') + '</div>';
  }).join('');

  // Decor — owned house upgrades show as background items
  const decorMap = {
    kitchen:'🍳', bedroom:'🛏️', bathroom:'🛁', garden:'🌷', gym:'🏋️',
    theater:'📺', gameroom:'🎮', library:'📚', pool:'🌊', office:'💻',
    studio:'🎨', guesthouse:'🏡', wine:'🍷', meditation:'🧘', workshop:'🔨',
  };
  const ownedRooms = (c.rooms||[]).slice(0,8); // cap at 8 visible
  decor.innerHTML = ownedRooms.map((rid,i) => {
    const e = decorMap[rid] || '✨';
    const top = -4 + Math.random()*8;
    const left = 5 + (i*11) + Math.random()*3;
    return '<div class="hs-decor-item" style="left:' + left + '%;bottom:' + top + 'px;">' + e + '</div>';
  }).join('');

  // Start wander animation
  if(_wanderInterval) clearInterval(_wanderInterval);
  _wanderInterval = setInterval(wanderActors, 3000);
}

function wanderActors(){
  document.querySelectorAll('#hs-actors .hs-actor').forEach(el => {
    const left = parseFloat(el.style.left) || 50;
    const newLeft = clamp(left + (Math.random() - 0.5) * 20, 4, 88);
    el.style.left = newLeft + '%';
  });
  document.querySelectorAll('#hs-pets .hs-pet').forEach(el => {
    const left = parseFloat(el.style.left) || 50;
    const newLeft = clamp(left + (Math.random() - 0.5) * 24, 4, 92);
    el.style.left = newLeft + '%';
  });
}

function toggleHomeScene(){
  const el = document.getElementById('home-scene');
  const t = document.getElementById('hs-toggle');
  if(!el) return;
  el.classList.toggle('collapsed');
  if(t) t.textContent = el.classList.contains('collapsed') ? '▴' : '▾';
}

function homeSceneClick(e){
  const scene = document.getElementById('home-scene');
  if(!scene) return;
  const rect = scene.getBoundingClientRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  // Move the player avatar (first .hs-actor.player) to the click x
  const playerEl = scene.querySelector('.hs-actor.player');
  if(playerEl){
    playerEl.style.left = clamp(xPct, 4, 92) + '%';
  }
  // Also nudge other actors and pets toward the click for a "they follow you" effect
  const drift = (Math.random() - 0.5) * 12;
  scene.querySelectorAll('.hs-actor:not(.player), .hs-pet').forEach(el => {
    const newLeft = clamp(xPct + drift + (Math.random()-0.5)*18, 4, 92);
    el.style.left = newLeft + '%';
  });
}

function generateFriendIfNeeded(){
  const c = LIFE.char;
  if(!c.friends) c.friends = [];
  // Build up to 5 close friends over time
  if(c.friends.filter(f=>f.alive).length >= 5) return;
  if(c.age < 6) return;
  if(Math.random() > 0.25) return;
  const sex = Math.random()<0.5?'m':'f';
  const fname = pickRand(NAMES[c.country][sex]);
  const lname = pickRand(NAMES[c.country].l);
  const occ = c.age >= 22 ? pickRand(PARTNER_OCCUPATIONS).title : 'Student';
  c.friends.push({
    firstName: fname, lastName: lname, sex: sex,
    age: c.age + rangeRand(-3, +3),
    occupation: occ, friendship: rangeRand(40, 75),
    metAt: c.age, alive: true,
    nickname: pickRand(['college bestie','childhood friend','work friend','gym buddy','book club friend','neighbor']),
  });
  pushEvent('good', '👋 You made a new friend: ' + fname + ' (' + occ + '). Friendship at ' + c.friends[c.friends.length-1].friendship + '%.');
}

function ageFriendsAndDrift(){
  const c = LIFE.char;
  if(!c.friends) return;
  c.friends.forEach(f => {
    if(!f.alive) return;
    f.age++;
    // Friendships drift down without contact
    if(Math.random() < 0.4){
      f.friendship = clamp(f.friendship - 1, 0, 100);
    }
    // Friends can die in late life
    if(f.age > 70 && Math.random() < 0.02){
      f.alive = false;
      pushEvent('death', '😔 Your ' + f.nickname + ' ' + f.firstName + ' passed away at age ' + f.age + '.');
      c.happiness = clamp(c.happiness - 12, 0, 100);
    }
  });
}

function openFriends(){
  const c = LIFE.char;
  if(c.age < 6){ toast('Too young for friends outside the family.'); return; }
  if(!c.friends) c.friends = [];
  const alive = c.friends.filter(f => f.alive);
  let html = '';
  if(!alive.length){
    html += '<div class="fam-empty">You haven\'t made any friends yet. Friends appear naturally as you age. Or try going to school / a club to speed it up.</div>';
  } else {
    alive.forEach((f,i) => {
      const fIdx = c.friends.indexOf(f);
      const compatCls = f.friendship >= 70 ? 'good' : f.friendship <= 30 ? 'bad' : '';
      html += '<div class="card">'
        + '<div class="card-ico">' + (f.sex==='m'?'🧑':'👩') + '</div>'
        + '<div class="card-body"><div class="card-title">' + f.firstName + ' ' + f.lastName + '</div>'
        + '<div class="card-meta">' + f.nickname + ' · Age ' + f.age + ' · ' + f.occupation + '</div>'
        + '<div class="card-meta" style="color:' + (f.friendship>=60?'var(--green)':f.friendship>=40?'var(--gold)':'var(--crimson)') + ';">Friendship ' + f.friendship + '%</div></div>'
        + '<div class="card-act">'
        + '<button class="card-btn" onclick="hangOut(' + fIdx + ')">Hang Out</button>'
        + '<button class="card-btn danger" onclick="cutOffFriend(' + fIdx + ')">Cut Off</button>'
        + '</div></div>';
    });
  }
  html += '<button class="card-btn green" style="width:100%;margin-top:12px;padding:10px;" onclick="meetSomeone()">🌟 Try to Make a New Friend</button>';
  openModal('👋 Friends (' + alive.length + ')', html);
}
function hangOut(idx){
  const c = LIFE.char;
  const f = c.friends[idx];
  if(!f) return;
  c.money -= 40;
  if(Math.random() < 0.7){
    f.friendship = clamp(f.friendship + 12, 0, 100);
    c.happiness = clamp(c.happiness + 6, 0, 100);
    pushEvent('good', '🥂 Hung out with ' + f.firstName + '. Friendship +12.');
  } else {
    f.friendship = clamp(f.friendship - 6, 0, 100);
    pushEvent('bad', '😬 Awkward hangout with ' + f.firstName + '. Friendship -6.');
  }
  closeModal();
  openFriends();
  renderAll();
  saveLife();
}
function cutOffFriend(idx){
  const c = LIFE.char;
  const f = c.friends[idx];
  if(!f) return;
  if(!confirm('Cut off ' + f.firstName + '? They will disappear from your friends list.')) return;
  f.alive = false;
  pushEvent('bad', '✂️ You cut off ' + f.firstName + ' for good.');
  c.karma = clamp(c.karma - 4, 0, 100);
  closeModal();
  openFriends();
  renderAll();
  saveLife();
}
function meetSomeone(){
  const c = LIFE.char;
  if(!c.friends) c.friends = [];
  if(c.friends.filter(f=>f.alive).length >= 12){ toast('You already have a lot of friends.'); return; }
  // Take a swing
  if(Math.random() < 0.6){
    const sex = Math.random()<0.5?'m':'f';
    const fname = pickRand(NAMES[c.country][sex]);
    const lname = pickRand(NAMES[c.country].l);
    const occ = c.age >= 22 ? pickRand(PARTNER_OCCUPATIONS).title : 'Student';
    c.friends.push({
      firstName: fname, lastName: lname, sex: sex,
      age: c.age + rangeRand(-3, +3),
      occupation: occ, friendship: rangeRand(40, 70),
      metAt: c.age, alive: true,
      nickname: pickRand(['new acquaintance','gym buddy','co-worker','book club friend','neighbor','old school friend']),
    });
    pushEvent('good', '👋 Met ' + fname + ' at a social event. New friend.');
  } else {
    pushEvent('', 'You went out, but didn\'t connect with anyone tonight.');
    c.happiness = clamp(c.happiness - 2, 0, 100);
  }
  closeModal();
  openFriends();
  renderAll();
  saveLife();
}

function openTravel(){

  DESTINATIONS.forEach(d => {

    const price = Math.floor(d.cost * country.costMult);

    const fxParts = Object.keys(d.fx).map(k => '+' + d.fx[k] + ' ' + k).join(' · ');

function bookTravel(id){
  const c = LIFE.char;
  const d = DESTINATIONS.find(x => x.id === id);
  if(!d) return;
  const country = COUNTRIES[c.country];
  const price = Math.floor(d.cost * country.costMult);
  if(c.money < price){ toast('Not enough money.'); return; }
  c.money -= price;
  const fx = d.fx;
  Object.keys(fx).forEach(k => {
    if(k === 'happiness') c.happiness = clamp(c.happiness + fx[k], 0, 100);
    if(k === 'smarts')    c.smarts    = clamp(c.smarts + fx[k], 0, 100);
    if(k === 'looks')     c.looks     = clamp(c.looks + fx[k], 0, 100);
    if(k === 'karma')     c.karma     = clamp(c.karma + fx[k], 0, 100);
    if(k === 'health')    c.health    = clamp(c.health + fx[k], 0, 100);
    if(k === 'faith')     c.faith     = clamp(c.faith + fx[k], 0, 100);
    if(k === 'fame')      c.fame      = clamp((c.fame||0) + fx[k], 0, 100);
  });
  if(!c.placesVisited) c.placesVisited = [];
  c.placesVisited.push(d.id);
  pushEvent('good', '✈️ You vacationed in ' + d.name + '.');
  closeModal();
  renderAll();
  saveLife();
}

const SUBSTANCES = [

  {id:'tobacco',  name:'Cigarettes',        ico:'🚬', cost:15,  fx:{happiness:+3, health:-4, looks:-1}, addict:0.12},

function openSubstances(){
  const c = LIFE.char;
  if(c.age < 14){ toast('Too young.'); return; }
  let html = '<div style="color:var(--crimson);font-family:var(--font-m);font-size:10px;letter-spacing:.16em;margin-bottom:14px;text-align:center;text-transform:uppercase;">⚠ Recurring use can lead to addiction</div>';
  if(c.addictions && c.addictions.length){
    html += '<div style="font-family:var(--font-m);font-size:10px;color:var(--crimson);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px;">Active Addictions</div>';
    c.addictions.forEach(a => {
      const s = SUBSTANCES.find(x => x.id === a);
      if(s) html += '<div class="card" style="border-color:var(--crimson);"><div class="card-ico">' + s.ico + '</div>'
        + '<div class="card-body"><div class="card-title">' + s.name + ' Addiction</div>'
        + '<div class="card-meta">Costs you money + health every year</div></div>'
        + '<div class="card-act"><button class="card-btn green" onclick="rehab(\'' + a + '\')">Rehab (−$8k)</button></div></div>';
    });
  }
  html += '<div style="font-family:var(--font-m);font-size:10px;color:var(--accent2);letter-spacing:.2em;text-transform:uppercase;margin:18px 0 10px;">Try / Use</div>';
  SUBSTANCES.forEach(s => {
    const fxParts = [];
    Object.keys(s.fx).forEach(k => fxParts.push((s.fx[k]>0?'+':'') + s.fx[k] + ' ' + k));
    const illTag = s.illegal ? ' <span class="card-tag illegal">ILLEGAL</span>' : '';
    html += '<div class="card">'
      + '<div class="card-ico">' + s.ico + '</div>'
      + '<div class="card-body"><div class="card-title">' + s.name + illTag + '</div>'
      + '<div class="card-meta">' + fxParts.join(' · ') + ' · ' + Math.floor(s.addict*100) + '% addiction risk</div></div>'
      + '<div class="card-act"><div class="card-pay neg">−' + fmtMoney(s.cost) + '</div>'
      + '<button class="card-btn" onclick="useSubstance(\'' + s.id + '\')">Use</button></div></div>';
  });
  openModal('🍷 Substances', html);
}
function useSubstance(id){
  const c = LIFE.char;
  const s = SUBSTANCES.find(x => x.id === id);
  if(!s) return;
  if(c.money < s.cost){ toast('Not enough money.'); return; }
  c.money -= s.cost;
  const fx = s.fx;
  Object.keys(fx).forEach(k => {
    if(c[k] != null) c[k] = clamp(c[k] + fx[k], 0, 100);
  });
  // Addiction roll
  if(!c.addictions) c.addictions = [];
  if(!c.addictions.includes(s.id) && Math.random() < s.addict){
    c.addictions.push(s.id);
    pushEvent('bad', '🚨 You got addicted to ' + s.name + '. You will lose health and money each year until you go to rehab.');
  } else {
    pushEvent('', '💊 Used ' + s.name + '.');
  }
  // Illegal: chance of arrest
  if(s.illegal && Math.random() < 0.06){
    pushEvent('bad', '🚓 You were caught with ' + s.name + ' on you.');
    goToJail(rangeRand(1,3), s.name.toLowerCase() + ' possession');
  }
  closeModal();
  openSubstances();
  renderAll();
  saveLife();
}
function rehab(id){
  const c = LIFE.char;
  if(c.money < 8000){ toast('Rehab costs $8,000.'); return; }
  c.money -= 8000;
  c.addictions = (c.addictions||[]).filter(x => x !== id);
  c.health = clamp(c.health + 8, 0, 100);
  c.happiness = clamp(c.happiness + 12, 0, 100);
  pushEvent('milestone', '🌅 You completed rehab for ' + (SUBSTANCES.find(s=>s.id===id)||{}).name + '. Health and happiness recovering.');
  closeModal();
  openSubstances();
  renderAll();
  saveLife();
}
function processAddictionsYearly(){
  const c = LIFE.char;
  if(!c.addictions || !c.addictions.length) return;
  c.addictions.forEach(id => {
    const s = SUBSTANCES.find(x => x.id === id);
    if(!s) return;
    c.money -= s.cost * 50; // chronic use
    c.health = clamp(c.health + (s.fx.health||0) * 4, 0, 100);
    c.happiness = clamp(c.happiness - 2, 0, 100);
  });
}

    const owned = (c.bodyMods||[]).includes(b.id);
    const can = c.money >= b.cost && !owned;
    html += '<div class="card" style="' + (owned?'border-color:var(--accent);background:#1a1428;':'') + '">'
      + '<div class="card-ico">' + b.ico + '</div>'
      + '<div class="card-body"><div class="card-title">' + b.name + (owned?' · OWNED':'') + '</div>'
      + '<div class="card-meta">Looks ' + (b.looks>0?'+':'') + b.looks + (b.fame ? ' · Fame +' + b.fame : '') + '</div></div>'
      + '<div class="card-act"><div class="card-pay neg">−' + fmtMoney(b.cost) + '</div>'
      + (owned ? '<span class="card-tag">OWNED</span>'
              : '<button class="card-btn ' + (can?'green':'muted') + '" ' + (can?'':'disabled') + ' onclick="getBodyMod(\'' + b.id + '\')">Get</button>')
      + '</div></div>';
  });
  openModal('🎨 Body Mods', html);
}
function getBodyMod(id){
  const c = LIFE.char;
  const b = BODY_MODS.find(x => x.id === id);
  if(!b) return;
  if(c.money < b.cost){ toast('Not enough money.'); return; }
  c.money -= b.cost;
  if(!c.bodyMods) c.bodyMods = [];
  c.bodyMods.push(b.id);
  c.looks = clamp(c.looks + b.looks, 0, 100);
  if(b.fame) c.fame = clamp((c.fame||0) + b.fame, 0, 100);
  pushEvent('good', '🎨 You got a ' + b.name + '. ' + (b.looks>0?'+':'') + b.looks + ' looks.');
  closeModal();
  openBodyMods();
  renderAll();
  saveLife();
}

// ═══════════════════════════════════════════════════════════════════════
function computeAchievements(){
  const c = LIFE.char;
  const list = [];
  if(c.age >= 18) list.push({ico:'🎓', label:'Reached Adulthood'});
  if(c.degrees && c.degrees.includes('medical')) list.push({ico:'⚕️', label:'Graduated Medical School'});
  if(c.degrees && c.degrees.includes('law')) list.push({ico:'⚖️', label:'Graduated Law School'});
  if(c.degrees && c.degrees.includes('phd')) list.push({ico:'🔬', label:'Earned a PhD'});
  if(c.degrees && c.degrees.includes('business')) list.push({ico:'💼', label:'Earned an M.B.A.'});
  if(c.college) list.push({ico:'🏫', label:'Attended ' + (COLLEGES.find(x=>x.id===c.college)||{name:'College'}).name});
  if(c.partner && c.partner.married) list.push({ico:'💍', label:'Got Married'});
  if(c.children && c.children.length) list.push({ico:'👶', label:'Had ' + c.children.length + ' Child' + (c.children.length>1?'ren':'')});
  if(c.career && c.career.totalYears >= 20) list.push({ico:'🏆', label:'20+ Years in a Career'});
  if((c.money + (c.savings||0) + (c.investments||0)) >= 1000000) list.push({ico:'💰', label:'Millionaire'});
  if((c.money + (c.savings||0) + (c.investments||0)) >= 10000000) list.push({ico:'💎', label:'Decamillionaire'});
  if((c.money + (c.savings||0) + (c.investments||0)) >= 100000000) list.push({ico:'🌟', label:'Centimillionaire'});
  if(c.houseId === 'mansion') list.push({ico:'🏰', label:'Owned a Mansion'});
  if(c.houseId === 'island')  list.push({ico:'🏝️', label:'Owned a Private Island'});
  if(c.fame >= 80) list.push({ico:'⭐', label:'Famous'});
  if(c.fame >= 95) list.push({ico:'🌟', label:'Global Celebrity'});
  if(c.karma >= 90) list.push({ico:'😇', label:'Saintly Karma'});
  if(c.karma <= 10) list.push({ico:'😈', label:'Evil Reputation'});
  if(c.faith >= 90) list.push({ico:'🕊️', label:'Devout'});
  if(c.placesVisited && c.placesVisited.length >= 6) list.push({ico:'🌍', label:'World Traveler'});
  if(c.placesVisited && c.placesVisited.includes('space')) list.push({ico:'🚀', label:'Went to Space'});
  if(c.isVampire) list.push({ico:'🧛', label:'Vampire'});
  if(c.career && c.career.key === 'politician' && c.career.rungIdx >= 4) list.push({ico:'🏛️', label:'Head of State'});
  if(c.career && c.career.key === 'lawyer' && c.career.rungIdx >= 5) list.push({ico:'⚖️', label:'Supreme Court Justice'});
  if(c.career && c.career.key === 'doctor' && c.career.rungIdx >= 3) list.push({ico:'⚕️', label:'White House Physician'});
  if(c.career && c.career.key === 'ceo' && c.career.rungIdx >= 4) list.push({ico:'🏢', label:'Fortune 500 CEO'});
  if(c.skills){
    Object.keys(c.skills).forEach(s => {
      if(c.skills[s] >= 100){
        const sk = SKILLS.find(x => x.id === s);
        if(sk) list.push({ico:sk.ico, label:'Mastered ' + sk.name});
      }
    });
  }
  if(c.children && c.children.some(k => !k.alive)) list.push({ico:'🕯️', label:'Lost a Child'});
  if(c.addictions && c.addictions.length === 0 && c.flags && c.flags.recoveredAddiction) list.push({ico:'🌅', label:'Survived Addiction'});
  return list;
}
function openAchievements(){
  const c = LIFE.char;
  const list = computeAchievements();
  let html = '';
  if(!list.length){
    html += '<div class="fam-empty">No achievements yet. Live your life. They\'ll come.</div>';
  } else {
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;">';
    list.forEach(a => {
      html += '<div style="padding:14px 12px;background:#1a1428;border:1px solid var(--accent);border-radius:6px;text-align:center;">'
        + '<div style="font-size:32px;line-height:1;margin-bottom:5px;">' + a.ico + '</div>'
        + '<div style="font-size:12px;color:var(--accent2);font-weight:600;">' + a.label + '</div>'
        + '</div>';
    });
    html += '</div>';
  }
  openModal('🏆 Achievements (' + list.length + ')', html);
}

function cityWalkTo(x, y, buildingId){
  _cityPlayerPos = { x, y };
  const p = document.getElementById('cm-player');
  if(p){ p.style.left = x + '%'; p.style.top = y + '%'; }
  const status = document.getElementById('cm-status');
  const b = CITY_LAYOUT.find(x => x.id === buildingId);
  if(b && status){
    status.textContent = 'Walking to ' + b.name + '...';
  }
  // After walk animation, trigger interaction
  setTimeout(() => {
    if(b && b.action){
      cityInteract(b);
    }
  }, 820);
}

function cityWalkAnywhere(e){
  // Walk to a free spot on the map (not a building)
  const map = document.getElementById('city-map');
  if(!map) return;
  const rect = map.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width)  * 100;
  const y = ((e.clientY - rect.top)  / rect.height) * 100;
  _cityPlayerPos = { x: clamp(x, 2, 96), y: clamp(y, 2, 92) };
  const p = document.getElementById('cm-player');
  if(p){ p.style.left = _cityPlayerPos.x + '%'; p.style.top = _cityPlayerPos.y + '%'; }
  const status = document.getElementById('cm-status');
  if(status) status.textContent = '🚶 Strolling around the neighborhood...';
}

// Arrow-key control for the city map and the home scene
window.addEventListener('keydown', e => {
  // Skip if typing
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  // Only when city map modal is open
  const modal = document.getElementById('modal');
  const onMap = modal && modal.classList.contains('show') && document.getElementById('city-map');
  if(!onMap) return;
  const step = 6;
  let moved = false;
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A'){
    _cityPlayerPos.x = clamp(_cityPlayerPos.x - step, 2, 96); moved = true;
  } else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D'){
    _cityPlayerPos.x = clamp(_cityPlayerPos.x + step, 2, 96); moved = true;
  } else if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){
    _cityPlayerPos.y = clamp(_cityPlayerPos.y - step, 2, 92); moved = true;
  } else if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S'){
    _cityPlayerPos.y = clamp(_cityPlayerPos.y + step, 2, 92); moved = true;
  }
  if(moved){
    e.preventDefault();
    const p = document.getElementById('cm-player');
    if(p){ p.style.left = _cityPlayerPos.x + '%'; p.style.top = _cityPlayerPos.y + '%'; }
    // Check if player walked onto a building
    for(const b of CITY_LAYOUT){
      if(Math.abs(b.x - _cityPlayerPos.x) < 5 && Math.abs(b.y - _cityPlayerPos.y) < 5){
        const status = document.getElementById('cm-status');
        if(status) status.textContent = '↩ Press [Enter] to enter ' + b.name;
        if(e.key === 'Enter'){
          cityInteract(b);
        }
        break;
      }
    }
  } else if(e.key === 'Enter'){
    // Enter triggers nearest building
    let nearest = null, minDist = 999;
    for(const b of CITY_LAYOUT){
      const dist = Math.abs(b.x - _cityPlayerPos.x) + Math.abs(b.y - _cityPlayerPos.y);
      if(dist < minDist){ minDist = dist; nearest = b; }
    }
    if(nearest && minDist < 10){ cityInteract(nearest); }
  }
});

function cityInteract(b){
  closeModal();
  const fn = window[b.action];
  if(typeof fn === 'function'){
    if(b.action === 'visitNeighbor'){ visitNeighbor(b.npcKey); }
    else { fn(); }
  } else {
    toast(b.name + ' — nothing to do here right now.');
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  GENETIC DISEASES — inherited at birth
// ═══════════════════════════════════════════════════════════════════════
const GENETIC_DISEASES = [
  {id:'diabetes',  name:'Type 1 Diabetes',     ico:'🩸', healthDrift:-1, happyDrift:0,  inherit:0.18, onset:8},
  {id:'cancerProne',name:'Cancer-Prone',       ico:'🧬', healthDrift:-1, happyDrift:0,  inherit:0.25, onset:40},
  {id:'heart',     name:'Heart Condition',     ico:'❤️', healthDrift:-2, happyDrift:0,  inherit:0.22, onset:35},
  {id:'depression',name:'Clinical Depression', ico:'🌧️', healthDrift:0,  happyDrift:-2, inherit:0.30, onset:14},
  {id:'anxiety',   name:'Anxiety Disorder',    ico:'😰', healthDrift:0,  happyDrift:-1, inherit:0.32, onset:12},
  {id:'autism',    name:'Autism Spectrum',     ico:'🧩', healthDrift:0,  happyDrift:0,  smartsDrift:+1, inherit:0.25, onset:3},
  {id:'sicklecell',name:'Sickle Cell',         ico:'🩹', healthDrift:-2, happyDrift:-1, inherit:0.20, onset:1},
  {id:'huntington',name:'Huntington\'s',       ico:'🧠', healthDrift:-3, happyDrift:-2, inherit:0.50, onset:38, dominant:true},
  {id:'colorblind',name:'Colorblindness',      ico:'🌈', healthDrift:0,  happyDrift:0,  inherit:0.15, onset:5},
  {id:'celiac',    name:'Celiac Disease',      ico:'🌾', healthDrift:-1, happyDrift:0,  inherit:0.18, onset:10},
  {id:'longevity', name:'Longevity Gene',      ico:'⏳', healthDrift:+1, happyDrift:0,  inherit:0.20, onset:0, beneficial:true},
  {id:'highIQ',    name:'High-IQ Genetics',    ico:'🧠', smartsDrift:+1, happyDrift:0,  inherit:0.20, onset:0, beneficial:true},
];

function assignGeneticDiseases(){
  const c = LIFE.char;
  if(!c.diseases) c.diseases = [];
  const parentDiseases = (c.parents && c.parents.mom && c.parents.mom.diseases || [])
    .concat(c.parents && c.parents.dad && c.parents.dad.diseases || []);
  GENETIC_DISEASES.forEach(d => {
    // Parents carry it -> higher inherit chance; otherwise base low chance for de novo
    const parentHas = parentDiseases.includes(d.id);
    const chance = parentHas ? d.inherit : (d.beneficial ? d.inherit * 0.5 : 0.04);
    if(Math.random() < chance){
      c.diseases.push(d.id);
    }
  });
}

function processGeneticDiseases(){
  const c = LIFE.char;
  if(!c.diseases || !c.diseases.length) return;
  c.diseases.forEach(did => {
    const d = GENETIC_DISEASES.find(x => x.id === did);
    if(!d) return;
    if(c.age < d.onset) return;
    if(c.age === d.onset){
      const verb = d.beneficial ? '✨' : '🩺';
      pushEvent(d.beneficial?'good':'bad', verb + ' Diagnosed with ' + d.name + '.');
    }
    if(d.healthDrift) c.health    = clamp(c.health + d.healthDrift, 0, 100);
    if(d.happyDrift)  c.happiness = clamp(c.happiness + d.happyDrift, 0, 100);
    if(d.smartsDrift) c.smarts    = clamp(c.smarts + d.smartsDrift, 0, 100);
  });
}

// ═══════════════════════════════════════════════════════════════════════
//  FERTILITY — barren / multiparity / twins / triplets
// ═══════════════════════════════════════════════════════════════════════
function assignFertilityProfile(){
  const c = LIFE.char;
  // Default normal fertility
  const roll = Math.random();
  if(roll < 0.06){ c.fertility = 'infertile'; }    // 6% cannot conceive
  else if(roll < 0.12){ c.fertility = 'low'; }     // 6% low fertility
  else if(roll < 0.85){ c.fertility = 'normal'; }  // 73% normal
  else if(roll < 0.95){ c.fertility = 'high'; }    // 10% high
  else { c.fertility = 'multiparous'; }            // 5% prone to twins/triplets
}

function getBabyOutcome(c){
  // Returns array of {sex} babies and odds/rolls
  const ageMod = c.age < 28 ? 1.0 : c.age < 35 ? 0.7 : c.age < 42 ? 0.3 : 0.08;
  const fert = c.fertility || 'normal';
  if(fert === 'infertile') return { success:false, msg:'Medically infertile — no conception possible.' };
  let conceiveChance =
    fert === 'low'         ? 0.18 * ageMod :
    fert === 'normal'      ? 0.45 * ageMod :
    fert === 'high'        ? 0.70 * ageMod :
    fert === 'multiparous' ? 0.55 * ageMod : 0.40;
  if(Math.random() >= conceiveChance) return { success:false, msg:'No luck this year.' };
  // Multiples?
  let count = 1;
  if(fert === 'multiparous'){
    const m = Math.random();
    if(m < 0.40) count = 2;
    else if(m < 0.55) count = 3;
    else if(m < 0.58) count = 4;
  } else if(Math.random() < 0.025){
    count = 2; // baseline twin rate
  }
  const babies = [];
  for(let i = 0; i < count; i++){
    babies.push({ sex: Math.random() < 0.5 ? 'm' : 'f' });
  }
  return { success:true, babies };
}

// Override tryForBaby to use new fertility outcomes
function tryForBaby(){
  const c = LIFE.char;
  const p = c.partner;
  if(!p){ toast('Need a partner first.'); return; }
  if(c.children && c.children.length >= 10){ toast('Ten kids is a lot.'); return; }
  const outcome = getBabyOutcome(c);
  if(!outcome.success){
    toast(outcome.msg);
    pushEvent('', '👶 ' + outcome.msg);
    closeModal();
    renderAll();
    saveLife();
    return;
  }
  outcome.babies.forEach((b, idx) => {
    const babyName = prompt('Baby ' + (idx+1) + '/' + outcome.babies.length + ' is a '
      + (b.sex==='m'?'boy':'girl') + '! Name them:', pickRand(NAMES[c.country][b.sex]));
    if(babyName === null) return;
    const inheritedDiseases = [];
    GENETIC_DISEASES.forEach(d => {
      if((c.diseases||[]).includes(d.id) && Math.random() < d.inherit){
        inheritedDiseases.push(d.id);
      }
    });
    c.children.push({
      name: babyName || pickRand(NAMES[c.country][b.sex]),
      sex: b.sex,
      age: 0,
      alive: true,
      lastName: c.lastName,
      smarts: Math.floor(((c.smarts + (p.smarts||60))/2) + rangeRand(-10,10)),
      looks:  Math.floor(((c.looks + (p.looks||60))/2) + rangeRand(-10,10)),
      health: rangeRand(60, 95),
      diseases: inheritedDiseases,
    });
  });
  const text = outcome.babies.length === 1
    ? '👶 ' + p.firstName + ' gave birth to a baby ' + (outcome.babies[0].sex==='m'?'boy':'girl') + '.'
    : '👶 ' + p.firstName + ' gave birth to ' + outcome.babies.length + ' babies' + (outcome.babies.length===3?' — triplets!':outcome.babies.length===2?' — twins!':' — quads!');
  pushEvent('milestone', text);
  c.money -= 8000 * outcome.babies.length;
  c.happiness = clamp(c.happiness + 22, 0, 100);
  closeModal();
  renderAll();
  saveLife();
}

//  TOAST
// ═══════════════════════════════════════════════════════════════════════
let _toastTimer = null;
function toast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ t.classList.remove('show'); }, 2200);
}

if(loadLife() && LIFE && LIFE.char){

    // Offer continue for a living character
    const cont = document.getElementById('intro-continue');
    if(cont){
      cont.style.display = 'block';
      cont.textContent = 'Continue: ' + LIFE.char.firstName + ' ' + LIFE.char.lastName + ' · Age ' + LIFE.char.age;

    document.getElementById('intro').style.display = 'none';
    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('main').style.display = 'grid';
    renderAll();
    setTimeout(showDeathScreen, 100);

}

// Keyboard shortcut: SPACE or ENTER to age up. Hold SHIFT+SPACE to fast-forward 5 years.
window.addEventListener('keydown', e => {
  // Don't intercept keys while typing in inputs or while intro/death screens are open
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if(!LIFE || !LIFE.char || !LIFE.char.alive) return;
  if(document.getElementById('intro').style.display !== 'none') return;
  if(document.getElementById('modal').classList.contains('show')) return;
  if(document.getElementById('death-screen').classList.contains('show')) return;
  if(e.key === ' ' || e.code === 'Space' || e.key === 'Enter'){
    e.preventDefault();
    if(e.shiftKey){
      // Hold shift: rip through 5 years
      for(let i = 0; i < 5 && LIFE.char && LIFE.char.alive; i++) ageUp();
    } else {
      ageUp();
    }
  }
});
