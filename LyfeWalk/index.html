<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyfe-Walk · A Walkable Life</title>
<style>
:root{
  --bg:#0a0614;
  --s1:#15102a;
  --s2:#1f1840;
  --t1:#f5f0ff;
  --t2:#c4b8e0;
  --t3:#8a7ab8;
  --accent:#a855f7;
  --accent2:#d8b4fe;
  --teal:#06d6a0;
  --gold:#fbbf24;
  --crimson:#ef4444;
  --green:#22c55e;
  --pink:#ec4899;
  --blue:#3b82f6;
  --cyan:#22d3ee;
  --magenta:#d946ef;
  --lime:#a3e635;
  --orange:#fb923c;
  --font-h:'Georgia',serif;
  --font-m:'Courier New',monospace;
  --font-s:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font-s);
  font-size:14px;overflow:hidden;}
body{display:flex;flex-direction:column;}
button,input,select{font-family:inherit;cursor:pointer;}

#topbar{height:42px;background:linear-gradient(180deg,#13131f,#0a0a14);
  border-bottom:1px solid #2a2a3a;display:flex;align-items:center;padding:0 14px;gap:10px;
  flex-shrink:0;z-index:50;}
.brand{font-family:var(--font-h);font-size:18px;font-weight:900;color:var(--accent2);letter-spacing:.04em;}
.brand-sub{font-family:var(--font-m);font-size:8px;color:var(--t3);letter-spacing:.3em;text-transform:uppercase;margin-left:4px;}
.tb-spacer{flex:1;}
.hud-chip{font-family:var(--font-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 10px;border-radius:11px;border:1px solid #2a2a3a;background:#0a0a14;color:var(--t2);
  display:inline-flex;align-items:center;gap:6px;}
.hud-chip.age{color:var(--gold);border-color:rgba(255,208,96,.3);}
.hud-chip.money{color:var(--green);border-color:rgba(94,226,122,.3);}
.hud-chip.money.neg{color:var(--crimson);}
.hud-chip.zone{color:var(--teal);border-color:rgba(29,214,196,.3);}
.hud-chip.time{color:var(--accent2);border-color:rgba(200,152,255,.3);}
.tb-btn{background:#0a0a14;border:1px solid #2a2a3a;color:var(--t2);padding:4px 10px;border-radius:3px;
  font-family:var(--font-m);font-size:9px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;}
.tb-btn:hover{color:var(--t1);border-color:var(--accent);}

#game{position:relative;flex:1;overflow:hidden;
  background:radial-gradient(ellipse at center, #1a0c2e 0%, #06030f 70%);}
#world{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .25s ease-out;
  box-shadow:0 0 80px rgba(168,85,247,.15);}
.tile{position:absolute;width:32px;height:32px;}
.tile.grass{background:#2e8a3e;
  background-image:radial-gradient(circle at 30% 30%,#3eaf52 0,#2e8a3e 60%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
.tile.path{background:#9d7d56;
  background-image:radial-gradient(circle,#b3915f 0,#9d7d56 60%);}
.tile.road{background:#222230;
  background-image:repeating-linear-gradient(90deg,#222230 0,#222230 20px,#3a3a48 20px,#3a3a48 22px);
  border-top:1px solid rgba(251,191,36,.4);border-bottom:1px solid rgba(251,191,36,.4);}
.tile.sidewalk{background:#7a7a90;
  background-image:radial-gradient(circle,#8a8aa0 0,#7a7a90 60%);}
.tile.floor{background:#a47e58;
  background-image:repeating-linear-gradient(0deg,transparent 0,transparent 14px,rgba(0,0,0,.10) 14px,rgba(0,0,0,.10) 16px),
                   repeating-linear-gradient(90deg,transparent 0,transparent 14px,rgba(0,0,0,.10) 14px,rgba(0,0,0,.10) 16px);}
.tile.wall{background:linear-gradient(180deg,#5a3e22 0%,#3e2810 100%);
  border-bottom:2px solid #1a0a04;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3);}
.tile.water{background:#2a4078;background-image:repeating-linear-gradient(45deg,transparent 0,transparent 5px,rgba(255,255,255,.06) 5px,rgba(255,255,255,.06) 10px);
  animation:water-wave 6s linear infinite;}
@keyframes water-wave{from{background-position:0 0;}to{background-position:40px 20px;}}
.tile.sand{background:#d4b878;background-image:radial-gradient(circle,#dcc080 0,#d4b878 60%);}
.bldg{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#4a4a5a,#2a2a36);border:2px solid #6a6a7a;border-radius:6px;
  cursor:pointer;font-size:40px;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.7);
  box-shadow:0 4px 8px rgba(0,0,0,.4);transition:all .15s;}
.bldg:hover{filter:brightness(1.25);transform:translateY(-2px);
  box-shadow:0 0 20px var(--accent), 0 6px 12px rgba(0,0,0,.5);}
.bldg.highlighted{border-color:var(--accent);box-shadow:0 0 24px var(--accent);animation:bldgPulse 1.2s infinite;}
@keyframes bldgPulse{0%,100%{box-shadow:0 0 16px var(--accent);}50%{box-shadow:0 0 28px var(--magenta);}}
.bldg-label{font-family:var(--font-m);font-size:8px;letter-spacing:.05em;color:var(--t1);
  background:rgba(0,0,0,.7);padding:1px 5px;border-radius:2px;margin-top:2px;white-space:nowrap;}
.bldg.home{background:linear-gradient(180deg,#5a4828,#4a3820);border-color:var(--gold);}
.bldg.shop{background:linear-gradient(180deg,#3a5a4a,#2a4a3a);border-color:var(--green);}
.bldg.medical{background:linear-gradient(180deg,#5a3a3a,#4a2a2a);border-color:var(--crimson);}
.bldg.school{background:linear-gradient(180deg,#3a4a5a,#2a3a4a);border-color:var(--teal);}
.bldg.entertainment{background:linear-gradient(180deg,#5a4a5a,#4a3a4a);border-color:var(--accent);}
.bldg.civic{background:linear-gradient(180deg,#5a5828,#4a4820);border-color:var(--gold);}
.bldg.work{background:linear-gradient(180deg,#3a3a5a,#2a2a4a);border-color:var(--accent2);}
.door{position:absolute;background:linear-gradient(180deg,rgba(168,85,247,.6),rgba(217,70,239,.6));
  border:2px solid var(--accent2);border-radius:4px;
  box-shadow:0 0 20px var(--accent), inset 0 0 12px rgba(217,70,239,.6);
  animation:doorPulse 1.4s infinite;cursor:pointer;}
@keyframes doorPulse{0%,100%{box-shadow:0 0 16px var(--accent),inset 0 0 12px rgba(217,70,239,.5);}50%{box-shadow:0 0 28px var(--magenta),inset 0 0 18px rgba(217,70,239,.8);}}
.door::before{content:attr(data-arrow);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#fff;font-size:24px;font-weight:900;text-shadow:0 0 8px var(--accent);}
.door-label{position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  font-family:var(--font-m);font-size:9px;letter-spacing:.18em;color:#fff;
  background:rgba(168,85,247,.95);padding:2px 8px;border-radius:3px;white-space:nowrap;
  box-shadow:0 0 12px var(--accent);}
.actor{position:absolute;width:24px;height:34px;z-index:50;font-size:24px;line-height:1;
  text-align:center;pointer-events:none;transition:transform .06s linear;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
.actor.npc{font-size:22px;width:22px;height:30px;z-index:40;
  animation:npc-bob 0.5s infinite alternate ease-in-out;}
@keyframes npc-bob{from{transform:translateY(0);}to{transform:translateY(-2px);}}
.player-ailment{position:absolute;top:-18px;right:-12px;font-size:18px;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));
  animation:ailmentBob 1.2s infinite alternate;pointer-events:none;}
@keyframes ailmentBob{from{transform:translateY(0);}to{transform:translateY(-4px);}}
/* Birthday cake popup — celebrates each year tick */
.birthday-cake{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.4);
  font-size:96px;z-index:9000;pointer-events:none;opacity:0;
  filter:drop-shadow(0 8px 24px rgba(251,191,36,.65));transition:transform .4s ease, opacity .4s ease;}
.birthday-cake.rise{transform:translate(-50%, -120%) scale(1.6);opacity:1;}
.birthday-cake .bc-age{font-family:var(--font-h);font-size:28px;color:var(--gold);text-align:center;
  text-shadow:0 0 12px rgba(251,191,36,.7);margin-top:-12px;}
.actor-frail{filter:saturate(.7) brightness(.9);}
.actor-frail #player-base{animation:elderWobble 2.4s infinite;}
@keyframes elderWobble{0%,100%{transform:translateX(0) translateY(0) rotate(0);}25%{transform:translateX(-1px) translateY(-1px) rotate(-2deg);}75%{transform:translateX(1px) translateY(0) rotate(2deg);}}
.actor-label{position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  font-family:var(--font-m);font-size:8px;letter-spacing:.05em;color:var(--t1);
  background:rgba(0,0,0,.7);padding:1px 5px;border-radius:2px;white-space:nowrap;
  pointer-events:none;}
.actor-shadow{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);
  width:16px;height:5px;background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%);}
.prompt-bubble{position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  font-family:var(--font-m);font-size:9px;letter-spacing:.1em;
  background:rgba(157,107,255,.95);color:#fff;padding:3px 8px;border-radius:3px;
  white-space:nowrap;animation:promptPulse 1s infinite;box-shadow:0 0 10px rgba(157,107,255,.7);}
.prompt-bubble::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);
  border:4px solid transparent;border-top-color:rgba(157,107,255,.95);border-bottom:0;}
@keyframes promptPulse{0%,100%{opacity:.95;}50%{opacity:1;}}

#hud{position:absolute;top:8px;left:8px;z-index:100;display:flex;flex-direction:column;gap:4px;
  pointer-events:none;
  background:rgba(10,6,20,.85);padding:8px 10px;border-radius:8px;
  border:1px solid rgba(168,85,247,.3);
  backdrop-filter:blur(8px);}
.hud-stat-row{display:flex;gap:6px;align-items:center;padding:2px 4px;
  font-family:var(--font-m);font-size:9px;letter-spacing:.08em;}
.hud-stat-row .hsr-l{color:var(--t3);text-transform:uppercase;}
.hud-stat-row .hsr-v{color:var(--t1);font-weight:700;}
.hud-bar{width:60px;height:5px;background:#1a1a26;border-radius:3px;overflow:hidden;}
.hud-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
.hud-stat-row.happy .hud-bar-fill{background:#ffd060;}
.hud-stat-row.health .hud-bar-fill{background:var(--crimson);}
.hud-stat-row.smarts .hud-bar-fill{background:var(--accent2);}
.hud-stat-row.energy .hud-bar-fill{background:var(--teal);}
.hud-stat-row.hunger .hud-bar-fill{background:var(--green);}

#controls-hint{position:absolute;bottom:8px;left:8px;z-index:100;
  font-family:var(--font-m);font-size:9px;letter-spacing:.1em;color:var(--t3);
  background:rgba(0,0,0,.65);padding:6px 10px;border-radius:4px;border:1px solid #2a2a3a;}
#controls-hint b{color:var(--accent2);background:rgba(157,107,255,.2);padding:1px 5px;border-radius:2px;}
#mini-msg{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:200;
  background:rgba(20,12,32,.95);color:var(--t1);padding:8px 16px;border:1px solid var(--accent);
  border-radius:6px;font-family:var(--font-m);font-size:11px;letter-spacing:.1em;display:none;
  box-shadow:0 0 20px rgba(157,107,255,.5);}
#mini-msg.show{display:block;animation:msgPop .25s ease;}
@keyframes msgPop{from{opacity:0;transform:translateX(-50%) translateY(-8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
#daynight{position:absolute;inset:0;pointer-events:none;z-index:30;transition:background .6s ease;}

#intro{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a1428,#000);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:5000;padding:20px;overflow-y:auto;}
.intro-title{font-family:var(--font-h);font-size:64px;font-weight:900;letter-spacing:.04em;
  background:linear-gradient(180deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 60px rgba(157,107,255,.4);margin-bottom:0;}
.intro-sub{font-family:var(--font-m);font-size:10px;letter-spacing:.4em;color:var(--t3);
  text-transform:uppercase;margin-bottom:24px;}
.intro-form{width:min(94vw,560px);background:var(--s1);border:1px solid #2a2a3a;
  border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:12px;}
.cc-row{display:flex;align-items:center;gap:10px;}
.cc-label{font-family:var(--font-m);font-size:9px;letter-spacing:.2em;color:var(--accent2);
  text-transform:uppercase;width:80px;flex-shrink:0;}
.cc-options{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.cc-opt{padding:5px 10px;background:#0a0a14;border:1px solid #2a2a3a;border-radius:3px;
  font-size:11px;color:var(--t2);cursor:pointer;transition:all .12s;font-family:var(--font-m);}
.cc-opt.sel{background:#1a1428;border-color:var(--accent);color:var(--t1);}
.cc-opt:hover:not(.sel){border-color:var(--accent2);color:var(--t1);}
.cc-color{width:26px;height:26px;border-radius:50%;border:2px solid #2a2a3a;cursor:pointer;}
.cc-color.sel{border-color:var(--accent);box-shadow:0 0 8px rgba(157,107,255,.6);}
.cc-preview{display:flex;align-items:center;justify-content:center;padding:14px;
  background:radial-gradient(circle,#13213a,#0a0a14);border-radius:6px;height:120px;}
.cc-preview-sprite{font-size:80px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));}
.cc-text{background:#0a0a14;border:1px solid #2a2a3a;color:var(--t1);padding:8px 10px;
  border-radius:3px;font-family:var(--font-s);font-size:14px;flex:1;}
.cc-text:focus{outline:none;border-color:var(--accent);}
.cc-start{margin-top:6px;padding:13px;background:linear-gradient(90deg,var(--accent),#7d4be0);
  color:#fff;border:none;border-radius:4px;font-family:var(--font-m);font-size:12px;
  letter-spacing:.28em;text-transform:uppercase;font-weight:900;cursor:pointer;}
.cc-start:hover{background:linear-gradient(90deg,#b08aff,var(--accent));box-shadow:0 0 24px rgba(157,107,255,.5);}

.modal{position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.85);
  display:none;align-items:center;justify-content:center;padding:20px;}
.modal.show{display:flex;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-box{width:min(94vw,560px);max-height:88vh;background:var(--s1);border:1px solid var(--accent);
  border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(157,107,255,.4);}
.modal-head{padding:12px 18px;border-bottom:1px solid #2a2a3a;background:linear-gradient(180deg,#1a1428,#0a0a14);
  display:flex;align-items:center;gap:10px;}
.modal-title{font-family:var(--font-h);font-size:18px;color:var(--accent2);flex:1;font-weight:700;}
.modal-x{background:none;border:1px solid #2a2a3a;color:var(--t2);padding:4px 10px;
  border-radius:3px;font-family:var(--font-m);font-size:9px;letter-spacing:.16em;cursor:pointer;text-transform:uppercase;}
.modal-x:hover{background:#1a1a26;color:var(--t1);}
.modal-body{padding:16px 18px;overflow-y:auto;color:var(--t1);}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.btn{padding:7px 14px;background:#0a0a14;border:1px solid #2a2a3a;color:var(--t1);
  border-radius:3px;font-family:var(--font-m);font-size:10px;letter-spacing:.14em;cursor:pointer;text-transform:uppercase;}
.btn:hover{border-color:var(--accent);background:#1a1428;}
.btn.green{background:rgba(94,226,122,.15);border-color:rgba(94,226,122,.4);color:var(--green);}
.btn.red{background:rgba(255,94,94,.15);border-color:rgba(255,94,94,.4);color:var(--crimson);}
.shop-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0a0a14;
  border:1px solid #2a2a3a;border-radius:4px;margin-bottom:6px;cursor:pointer;transition:all .12s;}
.shop-item:hover{border-color:var(--accent);background:#1a1428;}
.shop-item-ico{font-size:24px;width:36px;text-align:center;}
.shop-item-info{flex:1;}
.shop-item-name{font-size:13px;font-weight:600;color:var(--t1);}
.shop-item-desc{font-size:11px;color:var(--t3);font-family:var(--font-m);letter-spacing:.04em;}
.shop-item-pay{font-family:var(--font-m);font-size:13px;color:var(--green);font-weight:700;}
.shop-item-pay.neg{color:var(--crimson);}

#death{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a0808,#000);
  display:none;flex-direction:column;align-items:center;justify-content:center;z-index:7000;padding:24px;text-align:center;}
#death.show{display:flex;}
.death-title{font-family:var(--font-h);font-size:60px;color:var(--crimson);font-weight:900;
  letter-spacing:.1em;margin-bottom:14px;text-shadow:0 0 40px rgba(255,94,94,.5);}
.death-summary{background:var(--s1);border:1px solid #2a2a3a;border-radius:6px;padding:18px 22px;
  max-width:500px;font-size:13px;margin-bottom:20px;}
.death-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted #2a2a3a;
  font-family:var(--font-m);font-size:12px;}

#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:8000;
  background:var(--s2);border:1px solid var(--accent);border-radius:4px;padding:8px 16px;
  font-family:var(--font-m);font-size:11px;color:var(--t1);display:none;
  box-shadow:0 0 16px rgba(157,107,255,.5);}
#toast.show{display:block;animation:msgPop .25s ease;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#2a2a3a;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}
</style>
</head>
<body>

<div id="intro">
  <div class="intro-title">Lyfe-Walk</div>
  <div class="intro-sub">A Walkable Life</div>
  <div class="intro-form">
    <div class="cc-preview"><div class="cc-preview-sprite" id="cc-preview">🧑</div></div>
    <div class="cc-row">
      <div class="cc-label">Name</div>
      <input class="cc-text" id="cc-name" placeholder="Your character's name" maxlength="22">
    </div>
    <div class="cc-row">
      <div class="cc-label">Sex</div>
      <div class="cc-options" id="cc-sex"></div>
    </div>
    <div class="cc-row">
      <div class="cc-label">Skin</div>
      <div class="cc-options" id="cc-skin"></div>
    </div>
    <div class="cc-row">
      <div class="cc-label">Country</div>
      <div class="cc-options" id="cc-country"></div>
    </div>
    <button class="cc-start" onclick="startGame()">Step Into the World ›</button>
  </div>
</div>

<div id="topbar" style="display:none">
  <div><span class="brand">Lyfe-Walk</span><span class="brand-sub">v1</span></div>
  <div class="tb-spacer"></div>
  <div class="hud-chip zone" id="hud-zone">—</div>
  <div class="hud-chip time" id="hud-time">Day 1 · 9 AM</div>
  <div class="hud-chip age" id="hud-age">Age 18</div>
  <div class="hud-chip money" id="hud-money">$1,500</div>
  <div class="hud-chip" id="hud-networth" title="Total net worth — cash, savings, investments, property">Net $1,500</div>
  <button class="tb-btn" onclick="openBank()">🏦 Bank</button>
  <button class="tb-btn" onclick="openSkipTime()">⏩ Skip</button>
  <span id="topbar-actions"></span>
  <button class="tb-btn" onclick="openStats()">Stats</button>
  <button class="tb-btn" onclick="openCharSheet()">📋</button>
  <button class="tb-btn" onclick="confirmRestart()">New</button>
</div>

<div id="game" style="display:none">
  <div id="world"></div>
  <div id="daynight"></div>
  <div id="hud">
    <div class="hud-stat-row happy"><span class="hsr-l">Happy</span>
      <div class="hud-bar"><div class="hud-bar-fill" id="hud-happy" style="width:60%"></div></div>
      <span class="hsr-v" id="hud-happy-v">60</span></div>
    <div class="hud-stat-row health"><span class="hsr-l">Health</span>
      <div class="hud-bar"><div class="hud-bar-fill" id="hud-health" style="width:80%"></div></div>
      <span class="hsr-v" id="hud-health-v">80</span></div>
    <div class="hud-stat-row smarts"><span class="hsr-l">Smarts</span>
      <div class="hud-bar"><div class="hud-bar-fill" id="hud-smarts" style="width:55%"></div></div>
      <span class="hsr-v" id="hud-smarts-v">55</span></div>

let G = null;
function defaultGame(name, sex, skinId, country){
  // Roll 2 personality traits (no conflicts)
  const traitPool = TRAITS.slice().sort(() => Math.random() - 0.5);
  const traits = [];
  for(const t of traitPool){
    if(traits.length >= 2) break;
    if(traits.some(p => TRAIT_CONFLICTS[p] === t.id)) continue;
    traits.push(t.id);
  }
  // Roll inherited diseases (de novo chance 4% each, beneficial 10%)
  const diseases = [];
  for(const d of DISEASES){
    const chance = d.beneficial ? 0.10 : 0.04;
    if(Math.random() < chance) diseases.push(d.id);
  }
  // Fertility profile
  const fertRoll = Math.random();
  const fertility = fertRoll < 0.06 ? 'infertile'
                  : fertRoll < 0.12 ? 'low'
                  : fertRoll < 0.85 ? 'normal'
                  : fertRoll < 0.95 ? 'high'
                  : 'multiparous';
  return {
    char:{
      name, sex, skin:skinId, country,
      age:0, day:1, hour:9, daysAlive:0,
      happiness:60, health:80, smarts:55, looks:55, karma:60,
      faith:30, fame:0,
      // energy + hunger removed in audit — micro-management chore that
      // doesn't add fun. Eating + sleeping are still flavor actions that
      // affect happiness/health directly.
      energy:100, hunger:100,
      money:1500, salary:0,
      savings:0, investments:0,
      job:null, jobYears:0,
      education:'(not in school yet)', degrees:[],
      // Parents — visible NPCs in the home zone, age with you, eventually pass on
      mom: { name:'Mom',  age:30 + Math.floor(Math.random()*8), alive:true, sex:'f' },
      dad: { name:'Dad',  age:32 + Math.floor(Math.random()*8), alive:true, sex:'m' },
      enrolled:null, enrolledYearsLeft:0,
      relationship:null, kids:[],
      ownedItems:[], owned:{ house:null, car:null, rooms:[] },
      pets:[], bodyMods:[], addictions:[], placesVisited:[],
      traits, diseases, fertility,
      religion:null, reality:null,
      alive:true, cause:null,
    },
    zone:'home',
    player:{ x:5, y:8 },
    inCar:false,
    targetTile:null,
    keys:{},
    npcs:{},
    lastInteract:null,
  };
}
function save(){ try { localStorage.setItem('lyfewalk_save', JSON.stringify(G)); } catch(e){} }
function load(){ try {
  const s = localStorage.getItem('lyfewalk_save');
  if(!s) return false;
  G = JSON.parse(s);
  // Backfill new fields onto old saves so they don't crash newer code.
  if(G && G.char){
    if(G.char.savings == null)     G.char.savings = 0;
    if(G.char.investments == null) G.char.investments = 0;
    if(G.char.kids == null)        G.char.kids = [];
    if(G.char.owned == null)       G.char.owned = { house:null, car:null, rooms:[] };
  }
  return true;
} catch(e){} return false; }

    '<div class="cc-opt ' + (CC.sex===s.id?'sel':'') + '" onclick="setCC(\'sex\',\'' + s.id + '\')">' + s.label + '</div>').join('');
  document.getElementById('cc-skin').innerHTML = SKIN_TONES.map(s =>
    '<div class="cc-color ' + (CC.skin===s.id?'sel':'') + '" style="background:' + s.hex + ';" '
    + 'onclick="setCC(\'skin\',\'' + s.id + '\')" title="' + s.id + '"></div>').join('');
  document.getElementById('cc-country').innerHTML = Object.keys(COUNTRIES).map(k =>
    '<div class="cc-opt ' + (CC.country===k?'sel':'') + '" onclick="setCC(\'country\',\'' + k + '\')">' + COUNTRIES[k].flag + ' ' + COUNTRIES[k].name + '</div>').join('');
  updateCCPreview();
}
function setCC(field, val){ CC[field] = val; renderCC(); }
function updateCCPreview(){
  const tone = SKIN_TONES.find(s => s.id === CC.skin) || SKIN_TONES[0];
  document.getElementById('cc-preview').textContent = tone.emoji[CC.sex] || tone.emoji.m;
}

function startGame(){
  const name = document.getElementById('cc-name').value.trim() || 'Alex';
  G = defaultGame(name, CC.sex, CC.skin, CC.country);
  document.getElementById('intro').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('game').style.display = 'block';
  enterZone('home');
  updateHud();
  startLoop();
  miniMsg('Welcome to your new life, ' + name + '. Walk to the door (bottom) to step outside.');
  save();
}

const TILE = 32;
function tileToPx(t){ return t * TILE; }

function enterZone(zoneId){
  G.zone = zoneId;
  const z = WORLDS[zoneId];
  if(G._spawnAt){
    G.player.x = G._spawnAt.x;
    G.player.y = G._spawnAt.y;
    G._spawnAt = null;
  } else if(z.spawn){
    G.player.x = z.spawn.x;
    G.player.y = z.spawn.y;
  }
  // Remember where we just spawned so checkZoneExits can suppress immediate
  // re-triggering of the exit we just came through.
  G._spawnPoint = { x: G.player.x, y: G.player.y };
  G._spawnTime = Date.now();
  buildZoneDOM(zoneId);
  document.getElementById('hud-zone').textContent = zoneTitle(zoneId);
  renderPlayer();
  centerCameraOnPlayer();
}

function zoneTitle(zid){
  return { home:'🏠 Your House', neighborhood:'🌳 Neighborhood', city:'🏙️ City Center' }[zid] || zid;
}

function buildZoneDOM(zoneId){
  const z = WORLDS[zoneId];
  const world = document.getElementById('world');
  world.style.width  = (z.w * TILE) + 'px';
  world.style.height = (z.h * TILE) + 'px';
  world.style.background = z.background || '#000';
  let html = '';
  for(let y=0; y<z.h; y++){
    const row = z.tiles[y];
    for(let x=0; x<z.w; x++){
      const ch = row[x];
      let cls = 'grass';
      if(ch === '_') cls = 'floor';
      else if(ch === '#') cls = 'wall';
      else if(ch === ',') cls = 'path';
      else if(ch === '-') cls = 'road';
      else if(ch === '=') cls = 'sidewalk';
      else if(ch === '~') cls = 'water';
      else if(ch === 'D') cls = 'floor';
      html += '<div class="tile ' + cls + '" style="left:' + (x*TILE) + 'px;top:' + (y*TILE) + 'px;"></div>';
    }
  }
  (z.exits || []).forEach(ex => {
    // Direction arrow: figure out whether exit is N/S/E/W from world center
    const cx = z.w / 2, cy = z.h / 2;
    const exCx = ex.x + ex.w/2, exCy = ex.y + ex.h/2;
    let arrow = '→';
    if(exCx < cx - 4) arrow = '←';
    else if(exCx > cx + 4) arrow = '→';
    else if(exCy < cy) arrow = '↑';
    else arrow = '↓';
    const targetLabel = zoneTitle(ex.target).toUpperCase();
    html += '<div class="door" data-arrow="' + arrow + '" '
      + 'style="left:' + (ex.x*TILE) + 'px;top:' + (ex.y*TILE) + 'px;'
      + 'width:' + (ex.w*TILE) + 'px;height:' + (ex.h*TILE) + 'px;" '
      + 'onclick="event.stopPropagation();G.targetTile={x:' + (ex.x + ex.w/2) + ',y:' + (ex.y + ex.h/2) + '};">'
      + '<div class="door-label">' + arrow + ' ' + targetLabel + '</div>'
      + '</div>';
  });
  (z.buildings || []).forEach(b => {
    html += '<div class="bldg ' + (b.cls||'') + '" id="bldg-' + b.id + '" '
      + 'style="left:' + (b.x*TILE) + 'px;top:' + (b.y*TILE) + 'px;'
      + 'width:' + (b.w*TILE) + 'px;height:' + (b.h*TILE - 14) + 'px;" '
      + 'onclick="event.stopPropagation();walkToAndInteract(' + (b.x + b.w/2) + ',' + (b.y + b.h) + ',\'' + b.id + '\')">'
      + '<div>' + b.icon + '</div>'
      + '<div class="bldg-label">' + b.name + '</div>'
      + '</div>';
  });
  G.npcs = [];
  if(zoneId === 'home'){
    const c = G.char;
    const momAlive = !c.mom || c.mom.alive !== false;
    const dadAlive = !c.dad || c.dad.alive !== false;
    if(momAlive){
      G.npcs.push({id:'npc-mom', emoji:(c.age<1?'👩‍🍼':'👩'), label:'Mom', x:3, y:4, hx:3, hy:4});
      html += '<div class="actor npc" id="npc-mom" style="left:' + (3*TILE) + 'px;top:' + (4*TILE) + 'px;">'
        + (c.age < 1 ? '👩‍🍼' : '👩')
        + '<div class="actor-label">Mom</div><div class="actor-shadow"></div></div>';
    }
    if(dadAlive){
      G.npcs.push({id:'npc-dad', emoji:(c.age<1?'👨‍🍼':'👨'), label:'Dad', x:15, y:4, hx:15, hy:4});
      html += '<div class="actor npc" id="npc-dad" style="left:' + (15*TILE) + 'px;top:' + (4*TILE) + 'px;">'
        + (c.age < 1 ? '👨‍🍼' : '👨')
        + '<div class="actor-label">Dad</div><div class="actor-shadow"></div></div>';
    }
  } else if(zoneId === 'neighborhood'){
    G.npcs.push({id:'npc1',emoji:'👨',x:6,y:9,hx:6,hy:9});
    G.npcs.push({id:'npc2',emoji:'👩',x:18,y:10,hx:18,hy:10});
    G.npcs.push({id:'npc3',emoji:'🧒',x:24,y:13,hx:24,hy:13});
    html += npcHTML('npc1','👨', 6, 9);
    html += npcHTML('npc2','👩', 18, 10);
    html += npcHTML('npc3','🧒', 24, 13);
  } else if(zoneId === 'city'){
    G.npcs.push({id:'npc1',emoji:'👨‍💼',x:12,y:9,hx:12,hy:9});
    G.npcs.push({id:'npc2',emoji:'👩',x:20,y:8,hx:20,hy:8});
    G.npcs.push({id:'npc3',emoji:'🧑',x:28,y:11,hx:28,hy:11});
    G.npcs.push({id:'npc4',emoji:'🧒',x:6,y:12,hx:6,hy:12});
    G.npcs.push({id:'npc5',emoji:'👮',x:22,y:11,hx:22,hy:11});
    html += npcHTML('npc1','👨‍💼', 12, 9);
    html += npcHTML('npc2','👩', 20, 8);
    html += npcHTML('npc3','🧑', 28, 11);
    html += npcHTML('npc4','🧒', 6, 12);
    html += npcHTML('npc5','👮', 22, 11);
  }
  // Player avatar with ailment overlay slot
  const ailment = playerAilmentEmoji();
  html += '<div class="actor" id="player" style="left:0px;top:0px;">'
    + '<span id="player-base">' + playerEmoji() + '</span>'
    + '<span class="player-ailment" id="player-ailment" '
    + 'style="' + (ailment?'':'display:none;') + '">' + ailment + '</span>'
    + '<div class="actor-shadow"></div></div>';
  world.innerHTML = html;
  world.onclick = onWorldClick;
}
function npcHTML(id, emoji, x, y){
  return '<div class="actor npc" id="' + id + '" style="left:' + (x*TILE) + 'px;top:' + (y*TILE) + 'px;">' + emoji + '<div class="actor-shadow"></div></div>';
}

function playerEmoji(){
  const c = G.char;
  const tone = SKIN_TONES.find(s => s.id === c.skin) || SKIN_TONES[0];
  // Age-staged avatar — Virtual Families style life-stage progression
  let base;
  if(c.age < 2)        base = '👶';
  else if(c.age < 5)   base = c.sex === 'm' ? '👦' : '👧';
  else if(c.age < 13)  base = tone.emoji.child;
  else if(c.age < 20)  base = c.sex === 'm' ? '🧑' : '👩';
  else if(c.age < 40)  base = tone.emoji[c.sex] || tone.emoji.m;
  else if(c.age < 60)  base = c.sex === 'm' ? '🧔' : '👩';
  else if(c.age < 75)  base = c.sex === 'm' ? '👴' : '👵';
  else                 base = c.sex === 'm' ? '👴' : '👵';
  return base;
}

// Status overlay (coughing, sick) — appears as a tiny popup near the player.
// Driven purely by health + age; energy/hunger no longer surface here.
function playerAilmentEmoji(){
  const c = G.char;
  if(!c) return '';
  if(c.health <= 25) return '🤒';                       // really sick
  if(c.health <= 40) return '😷';                       // sick
  if(c.age >= 80 && c.health < 60) return '😩';          // very old + ailing
  if(c.age >= 70) return '🦯';                          // cane / shuffle
  return '';
}

function renderPlayer(){
  const el = document.getElementById('player');
  if(!el) return;
  el.style.left = tileToPx(G.player.x) + 'px';
  el.style.top  = tileToPx(G.player.y - 0.2) + 'px';
  // Keep avatar in sync with current age (so the player visibly grows up
  // without needing to re-enter the zone)
  const baseEl = document.getElementById('player-base');
  if(baseEl){
    const expected = playerEmoji();
    if(baseEl.textContent !== expected) baseEl.textContent = expected;
  }
  // Ailment overlay
  const ailEl = document.getElementById('player-ailment');
  if(ailEl){
    const a = playerAilmentEmoji();
    if(a){
      ailEl.style.display = '';
      if(ailEl.textContent !== a) ailEl.textContent = a;
    } else {
      ailEl.style.display = 'none';
    }
  }
  // Slow walking for elders / sick
  const c = G.char;
  if(c && (c.age >= 70 || c.health < 30)){
    el.classList.add('actor-frail');
  } else {
    el.classList.remove('actor-frail');
  }
}

function centerCameraOnPlayer(){
  const game = document.getElementById('game');
  const world = document.getElementById('world');
  if(!game || !world) return;
  const gw = game.clientWidth, gh = game.clientHeight;
  const ww = world.clientWidth, wh = world.clientHeight;
  let dx, dy;
  // If world fits entirely in the viewport, center it. Otherwise camera-follow.
  if(ww <= gw){
    dx = (gw - ww) / 2;
  } else {
    dx = gw/2 - tileToPx(G.player.x + 0.5);
    dx = Math.min(0, Math.max(gw - ww, dx));
  }
  if(wh <= gh){
    dy = (gh - wh) / 2;
  } else {
    dy = gh/2 - tileToPx(G.player.y + 0.5);
    dy = Math.min(0, Math.max(gh - wh, dy));
  }
  world.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
}

function isWalkable(zid, x, y){
  const z = WORLDS[zid];
  if(x < 0.2 || y < 0.2 || x >= z.w - 0.2 || y >= z.h - 0.2) return false;
  const ch = z.tiles[Math.floor(y)][Math.floor(x)];
  if(ch === '#') return false;
  if(ch === '~') return false;
  for(const b of (z.buildings || [])){
    if(x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) return false;
  }
  return true;
}

let lastFrameT = 0;
function gameLoop(now){
  if(!G || !G.char || !G.char.alive) return;
  if(!lastFrameT) lastFrameT = now;
  const dt = Math.min(0.1, (now - lastFrameT) / 1000);
  lastFrameT = now;

  let dx = 0, dy = 0;
  if(G.keys['w'] || G.keys['arrowup'])    dy -= 1;
  if(G.keys['s'] || G.keys['arrowdown'])  dy += 1;
  if(G.keys['a'] || G.keys['arrowleft'])  dx -= 1;
  if(G.keys['d'] || G.keys['arrowright']) dx += 1;
  if(dx || dy){
    G.targetTile = null;
  } else if(G.targetTile){
    const tx = G.targetTile.x - G.player.x;
    const ty = G.targetTile.y - G.player.y;
    const d = Math.hypot(tx, ty);
    if(d < 0.25){
      const target = G.targetTile;
      G.targetTile = null;
      if(target.interactBuilding){ triggerBuildingAction(target.interactBuilding); }
    } else {
      dx = tx / d;
      dy = ty / d;
    }
  }
  if(dx || dy){
    const mag = Math.hypot(dx, dy);
    const speed = G.inCar ? 9 : 4.5;
    const ndx = (dx / mag) * speed * dt;
    const ndy = (dy / mag) * speed * dt;
    if(isWalkable(G.zone, G.player.x + ndx, G.player.y)){ G.player.x += ndx; }
    if(isWalkable(G.zone, G.player.x, G.player.y + ndy)){ G.player.y += ndy; }
    renderPlayer();
    centerCameraOnPlayer();
    checkZoneExits();
  }
  updateNearestBuilding();
  tickNpcs(dt);
  requestAnimationFrame(gameLoop);
}

// Gentle NPC wander — picks a random spot within 2 tiles of home, lerps toward it.
function tickNpcs(dt){
  if(!G.npcs || !G.npcs.length) return;
  G.npcs.forEach(n => {
    if(n.tx === undefined || (Math.abs(n.x-n.tx) < 0.1 && Math.abs(n.y-n.ty) < 0.1)){
      if(!n.wait){ n.wait = 1 + Math.random()*3; return; }
      n.wait -= dt;
      if(n.wait > 0) return;
      n.wait = 0;
      n.tx = n.hx + (Math.random()*4 - 2);
      n.ty = n.hy + (Math.random()*4 - 2);
    }
    const dx = n.tx - n.x, dy = n.ty - n.y;
    const d = Math.hypot(dx, dy);
    if(d > 0.01){
      const sp = 1.2 * dt;
      n.x += (dx/d) * Math.min(sp, d);
      n.y += (dy/d) * Math.min(sp, d);
      const el = document.getElementById(n.id);
      if(el){ el.style.left = (n.x*TILE) + 'px'; el.style.top = (n.y*TILE) + 'px'; }
    }
  });
}

function startLoop(){
  if(G._loopStarted) return;
  G._loopStarted = true;
  requestAnimationFrame(gameLoop);
}

function onWorldClick(e){
  if(e.target.classList && (e.target.classList.contains('bldg') || e.target.closest('.bldg'))) return;
  const world = document.getElementById('world');
  const rect = world.getBoundingClientRect();
  const x = (e.clientX - rect.left) / TILE;
  const y = (e.clientY - rect.top) / TILE;
  walkTo(x, y);
}

function walkTo(x, y){
  G.targetTile = {
    x: Math.max(0.5, Math.min(WORLDS[G.zone].w - 0.5, x)),
    y: Math.max(0.5, Math.min(WORLDS[G.zone].h - 0.5, y)),
  };
}

function walkToAndInteract(x, y, buildingId){
  G.targetTile = { x, y, interactBuilding: buildingId };
}

function checkZoneExits(){
  const z = WORLDS[G.zone];
  const px = G.player.x, py = G.player.y;
  // Spawn grace: don't fire any exit while the player is still within ~2 tiles
  // of where they just spawned. This prevents the back-and-forth bounce when
  // an exit's trigger zone overlaps the destination zone's spawn point.
  if(G._spawnPoint){
    const dist = Math.hypot(px - G._spawnPoint.x, py - G._spawnPoint.y);
    if(dist < 2.0) return;
    // Player walked away — release the grace so future returns trigger normally
    G._spawnPoint = null;
  }
  for(const ex of (z.exits || [])){
    // Widened trigger margin (was 0.3, now 0.8) so an exit reliably fires when the player walks near it
    if(px >= ex.x - 0.8 && px <= ex.x + ex.w + 0.8 && py >= ex.y - 0.8 && py <= ex.y + ex.h + 0.8){
      G._spawnAt = { x: ex.spawnX, y: ex.spawnY };
      miniMsg('Entering ' + zoneTitle(ex.target) + '...');
      enterZone(ex.target);
      return;
    }
  }
}

function updateNearestBuilding(){
  const z = WORLDS[G.zone];
  const px = G.player.x, py = G.player.y;
  let nearest = null, minDist = 99;
  for(const b of (z.buildings || [])){
    const bx = b.x + b.w/2, by = b.y + b.h;
    const d = Math.hypot(px - bx, py - by);
    if(d < minDist){ minDist = d; nearest = b; }
  }
  document.querySelectorAll('.prompt-bubble').forEach(el => el.remove());
  document.querySelectorAll('.bldg.highlighted').forEach(el => el.classList.remove('highlighted'));
  if(nearest && minDist < 1.8){
    const el = document.getElementById('bldg-' + nearest.id);
    if(el){
      el.classList.add('highlighted');
      const p = document.createElement('div');
      p.className = 'prompt-bubble';
      p.textContent = '[E] ' + nearest.name;
      el.appendChild(p);
    }
    G.lastInteract = nearest;
  } else {
    G.lastInteract = null;
  }
}

function triggerBuildingAction(buildingId){
  const z = WORLDS[G.zone];
  const b = z.buildings.find(x => x.id === buildingId);
  if(!b) return;
  if(b.action && window[b.action]){ window[b.action](b); }
}

function advanceHours(hours){
  if(!G || !G.char) return;
  G.char.hour += hours;
  while(G.char.hour >= 24){ G.char.hour -= 24; G.char.day++; advanceDay(); }
  G.char.energy = clamp(G.char.energy - hours * 1.5, 0, 100);
  G.char.hunger = clamp(G.char.hunger - hours * 2.5, 0, 100);
  if(G.char.hunger < 20) G.char.health = clamp(G.char.health - hours, 0, 100);
  if(G.char.energy < 20) G.char.happiness = clamp(G.char.happiness - hours, 0, 100);
  updateDayNight();
  updateHud();
  save();
}
function advanceDay(){
  const c = G.char;
  c.daysAlive = (c.daysAlive||0) + 1;
  // Parents tend you when you're young — small daily happiness/health boost
  if(c.age < 5 && (c.mom && c.mom.alive || c.dad && c.dad.alive)){
    c.happiness = clamp(c.happiness + 1, 0, 100);
    c.health    = clamp(c.health + 0.5, 0, 100);
    c.hunger    = clamp(c.hunger + 3, 0, 100); // parents feed you
  }
  if(c.job){
    c.money += Math.floor(c.salary / 365);
    c.jobYears += 1/365;
  }
  if(c.enrolled){
    c.enrolledYearsLeft -= 1/365;
    if(c.enrolledYearsLeft <= 0){
      c.degrees.push(c.enrolled);
      miniMsg('🎓 Graduated with ' + c.enrolled + '!');
      c.smarts = clamp(c.smarts + 8, 0, 100);
      c.enrolled = null;
    }
  }
  // Compound savings interest monthly: ~5% APR savings, ~8% avg investments with swing.
  if(G.char.day % 30 === 0){
    if(c.savings > 0){
      const yield_ = Math.floor(c.savings * (0.05/12));
      c.savings += yield_;
      if(yield_ >= 25) miniMsg('🏦 Savings interest +' + fmt(yield_));
    }
    if(c.investments > 0){
      const swing = (Math.random()*0.04) - 0.012; // -1.2% to +2.8% monthly
      const ch = Math.floor(c.investments * swing);
      c.investments = Math.max(0, c.investments + ch);
      if(Math.abs(ch) >= 100) miniMsg('📈 Investments ' + (ch>=0?'+':'') + fmt(ch));
    }
  }
  if(G.char.day % 30 === 0){ ageUp(); }
}
function ageUp(){
  const c = G.char;
  // ─── BIRTHDAY: cake animation + year-end summary ───
  // Snapshot stats so the summary can show what changed this year
  const _yearStart = {
    happiness: c.happiness, health: c.health, smarts: c.smarts,
    looks: c.looks, karma: c.karma, money: c.money,
  };
  c.age++;
  showBirthdayCake(c.age);
  // Year-end summary fires at the end of ageUp (see end of function)
  c._yearSnapshot = _yearStart;
  miniMsg('🎂 You\'re now ' + c.age + ' years old.');
  // ─── Childhood milestones ───
  if(c.age === 1)  { miniMsg('👶 You took your first steps.'); c.happiness = clamp(c.happiness + 5, 0, 100); }
  if(c.age === 2)  { miniMsg('🗣 You said your first word.'); }
  if(c.age === 3)  { miniMsg('🚸 You started preschool.'); c.smarts = clamp(c.smarts + 3, 0, 100); }
  if(c.age === 5)  { miniMsg('🎒 You started kindergarten.'); c.smarts = clamp(c.smarts + 3, 0, 100); c.education = 'Elementary School'; }
  if(c.age === 11) { miniMsg('🏫 You started middle school.'); c.smarts = clamp(c.smarts + 3, 0, 100); c.education = 'Middle School'; }
  if(c.age === 13) { miniMsg('🌡 You hit puberty. Everything is complicated now.'); c.looks = clamp(c.looks + 3, 0, 100); }
  if(c.age === 14) { c.education = 'High School'; }
  if(c.age === 16) { miniMsg('🚗 You got your driver\'s license.'); }
  if(c.age === 18) { miniMsg('🎓 You graduated high school. Welcome to adulthood.'); c.education = 'High School Graduate'; }
  if(c.age === 21) { miniMsg('🥂 You can legally drink now.'); }
  // ─── Parents age along with you, and eventually pass on ───
  if(c.mom && c.mom.alive){
    c.mom.age++;
    if(c.mom.age > 78){
      const chance = 0.04 + (c.mom.age - 78) * 0.02;
      if(Math.random() < chance){
        c.mom.alive = false;
        miniMsg('🕯 Your mother passed away at age ' + c.mom.age + '.');
        c.happiness = clamp(c.happiness - 25, 0, 100);
      }
    }
  }
  if(c.dad && c.dad.alive){
    c.dad.age++;
    if(c.dad.age > 76){
      const chance = 0.04 + (c.dad.age - 76) * 0.02;
      if(Math.random() < chance){
        c.dad.alive = false;
        miniMsg('🕯 Your father passed away at age ' + c.dad.age + '.');
        c.happiness = clamp(c.happiness - 25, 0, 100);
      }
    }
  }
  // Refresh the home zone DOM if we're currently in home (so the parents
  // disappear / change emoji as they age)
  if(G.zone === 'home') buildZoneDOM('home');
  // Trait drift each year
  (c.traits || []).forEach(tid => {
    const t = TRAITS.find(x => x.id === tid);
    if(!t || !t.drift) return;
    Object.keys(t.drift).forEach(k => {
      if(c[k] != null) c[k] = clamp(c[k] + t.drift[k], 0, 100);
    });
  });
  // Disease progression past onset
  (c.diseases || []).forEach(did => {
    const d = DISEASES.find(x => x.id === did);
    if(!d || c.age < d.onset) return;
    if(c.age === d.onset){
      miniMsg((d.beneficial?'✨ ':'🩺 ') + 'Diagnosed: ' + d.name);
    }
    Object.keys(d.drift || {}).forEach(k => {
      if(c[k] != null) c[k] = clamp(c[k] + d.drift[k], 0, 100);
    });
  });
  // Religion perk
  if(c.religion && RELIGIONS[c.religion]){
    Object.keys(RELIGIONS[c.religion].perk).forEach(k => {
      if(c[k] != null) c[k] = clamp(c[k] + RELIGIONS[c.religion].perk[k], 0, 100);
    });
  }
  // Pets age + cost + bonus
  (c.pets || []).forEach(pet => {
    if(!pet.alive) return;
    pet.age++;
    const p = PETS.find(x => x.id === pet.id);
    if(!p) return;
    c.money -= p.monthly * 12;
    c.happiness = clamp(c.happiness + p.happy, 0, 100);
    if(p.health) c.health = clamp(c.health + p.health, 0, 100);
    if(pet.age >= p.span){
      pet.alive = false;
      miniMsg('🕯️ Your ' + p.name.toLowerCase() + ' ' + pet.name + ' passed away.');
      c.happiness = clamp(c.happiness - 8, 0, 100);
    }
  });
  // Annual taxes
  const country = COUNTRIES[c.country];
  if(c.salary > 0){
    const tax = Math.floor(c.salary * country.incomeTax);
    if(c.money >= tax){ c.money -= tax; }
    else { c.money -= tax; c.happiness = clamp(c.happiness - 4, 0, 100); }
  }
  if(c.owned && c.owned.house){
    const h = HOUSES.find(x => x.id === c.owned.house);
    if(h){ c.money -= Math.floor(h.price * country.propertyTax); }
  }
  // Housing disaster roll
  if(c.owned && c.owned.house){
    for(const d of HOUSING_DISASTERS){
      if(Math.random() < d.prob){
        const dmg = d.damage[0] + Math.floor(Math.random()*(d.damage[1]-d.damage[0]));
        c.money -= dmg;
        applyFx({happy:-6});
        miniMsg(d.name + ' Cost: ' + fmt(dmg));
        break;
      }
    }
  }
  // Addiction yearly cost
  (c.addictions || []).forEach(aid => {
    const s = SUBSTANCES.find(x => x.id === aid);
    if(!s) return;
    c.money -= s.cost * 30;
    c.health = clamp(c.health + (s.fx.health||0) * 4, 0, 100);
  });
  rollLifeEvent();
  if(c.age >= country.lifeExp - 5){
    const chance = 0.02 + Math.max(0, (c.age - country.lifeExp)) * 0.04;
    if(Math.random() < chance){ killCharacter('old age'); return; }
  }
  if(c.age >= 110){ killCharacter('extreme old age'); return; }
  if(c.health <= 0){ killCharacter('failing health'); return; }
  // Year-end recap modal (fires every 5 years + at age 1)
  showYearSummary();
}

    + '<button class="btn" onclick="bankMove(\'tosavings\',10000)">→ Savings $10,000</button>'
    + '<button class="btn" onclick="bankMove(\'tosavings\',-1)">→ Savings ALL</button>'
    + '<button class="btn" onclick="bankMove(\'toinvest\',1000)">→ Invest $1,000</button>'
    + '<button class="btn green" onclick="bankMove(\'toinvest\',10000)">→ Invest $10,000</button>'
    + '<button class="btn muted" onclick="bankMove(\'fromsavings\',1000)">Pull Savings $1k</button>'
    + '<button class="btn muted" onclick="bankMove(\'frominvest\',1000)">Sell Invest $1k</button>'
    + '</div>';
  openMod('🏦 Bank', html);
}
function bankMove(action, amount){
  const c = G.char;
  if(amount === -1) amount = c.money;
  if(amount <= 0){ toast('Nothing to move.'); return; }
  if(action === 'tosavings'){
    if(c.money < amount){ toast('Not enough cash.'); return; }
    c.money -= amount; c.savings = (c.savings||0) + amount;
  } else if(action === 'toinvest'){
    if(c.money < amount){ toast('Not enough cash.'); return; }
    c.money -= amount; c.investments = (c.investments||0) + amount;
  } else if(action === 'fromsavings'){
    if((c.savings||0) < amount){ toast('Not enough in savings.'); return; }
    c.savings -= amount; c.money += amount;
  } else if(action === 'frominvest'){
    if((c.investments||0) < amount){ toast('Not enough in investments.'); return; }
    c.investments -= amount; c.money += amount;
  }
  updateHud();
  save();
  openBank();
}

const BIG_EVENTS = [
  {t:'💰 You won a small lottery prize.',         fx:{money:+5000, happy:+12}},
  {t:'💼 You got an unexpected promotion at work.', fx:{money:+8000, happy:+15, smarts:+3}, need:c=>!!c.job},

  {t:'🏠 Pipe burst at home — costly repairs.',   fx:{money:-1800, happy:-3}, need:c=>!!(c.owned&&c.owned.house)},
  {t:'🎓 You took an online course and leveled up.', fx:{smarts:+6, happy:+3}},

  {t:'📈 An investment tip paid off handsomely.', fx:{money:+12000, happy:+8}},
  {t:'📉 A bad investment cost you.',             fx:{money:-6000, happy:-7}},

  {t:'👶 You became a parent unexpectedly.',      fx:{happy:+15, money:-3000}, special:'baby', need:c=>c.age>=18},
  {t:'🚓 You were mugged — lost some cash.',      fx:{money:-1500, happy:-6, health:-3}},
  {t:'🌟 You won a community award.',             fx:{happy:+10, karma:+8, fame:+5}},
  {t:'💼 You quit your job for a better one.',    fx:{money:+2000, happy:+8}, need:c=>!!c.job},
  {t:'🏝️ You took a long vacation abroad.',       fx:{happy:+18, money:-4000}},
  {t:'🔥 A house fire damaged your property.',    fx:{money:-9000, happy:-12}, need:c=>!!(c.owned&&c.owned.house)},
  {t:'🎁 You received a generous gift from family.', fx:{money:+5500, happy:+6}},
  {t:'🤕 A car accident left you shaken.',        fx:{health:-12, money:-3500, happy:-9}},
  {t:'⚡ A power outage week — bored to tears.',  fx:{happy:-4}},
];
function rollBigEvent(){
  const c = G.char;
  const pool = BIG_EVENTS.filter(e => !e.need || e.need(c));
  if(!pool.length) return;
  const e = pool[Math.floor(Math.random()*pool.length)];
  applyFx(e.fx);
  if(e.special === 'baby'){
    c.kids = c.kids || [];
    c.kids.push({name:'Baby '+(c.kids.length+1), sex:Math.random()<0.5?'m':'f', age:0, alive:true});
  }
  miniMsg(e.t);
}

function openSkipTime(){
  const html =
      '<p style="color:var(--t3);margin-bottom:14px;text-align:center;">Skip ahead. Bigger jumps trigger more significant random events along the way.</p>'
    + '<div style="display:grid;grid-template-columns:1fr;gap:9px;">'
    + '<button class="btn green" onclick="closeModal();skipYears(1)">⏩ Skip 1 year (1-2 significant events)</button>'
    + '<button class="btn green" onclick="closeModal();skipYears(5)">⏩⏩ Skip 5 years (5-8 significant events)</button>'
    + '<button class="btn green" onclick="closeModal();skipYears(10)">⏩⏩⏩ Skip 10 years (10-14 significant events)</button>'
    + '</div>';
  openMod('⏩ Skip Time', html);
}
function skipYears(years){
  const c = G.char;
  if(!c || !c.alive){ return; }
  const startAge = c.age;
  const days = years * 360; // 30 days per month × 12 months
  for(let i=0; i<days; i++){
    c.day++;
    advanceDay();
    if(!c.alive) break;
  }
  if(c.alive){
    // 1 yr → 1-2 events, 5 yr → 5-8, 10 yr → 10-14
    const minE = Math.max(1, years);
    const maxE = years <= 1 ? 2 : years + 4;
    const eventCount = minE + Math.floor(Math.random() * (maxE - minE + 1));
    for(let i=0; i<eventCount; i++){ rollBigEvent(); if(!c.alive) break; }
  }
  const aged = c.age - startAge;
  miniMsg('⏩ ' + aged + ' year' + (aged===1?'':'s') + ' passed.');
  updateHud();
  save();
}

function killCharacter(cause){

  c.cause = cause;
  const nw = netWorth(c);
  const heirs = (c.kids||[]).filter(k => k.alive);
  let html = ''
    + '<div class="death-row"><span>Name</span><span>' + c.name + '</span></div>'
    + '<div class="death-row"><span>Age</span><span>' + c.age + '</span></div>'
    + '<div class="death-row"><span>Cause</span><span>' + cause + '</span></div>'
    + '<div class="death-row"><span>Country</span><span>' + COUNTRIES[c.country].flag + ' ' + COUNTRIES[c.country].name + '</span></div>'
    + '<div class="death-row"><span>Job</span><span>' + (c.job || 'Unemployed') + '</span></div>'
    + '<div class="death-row"><span>Cash</span><span>' + fmt(c.money) + '</span></div>'
    + '<div class="death-row"><span>Savings</span><span>' + fmt(c.savings||0) + '</span></div>'
    + '<div class="death-row"><span>Investments</span><span>' + fmt(c.investments||0) + '</span></div>'
    + (c.owned&&c.owned.house ? '<div class="death-row"><span>House</span><span>' + c.owned.house + '</span></div>' : '')
    + (c.owned&&c.owned.car   ? '<div class="death-row"><span>Car</span><span>'   + c.owned.car   + '</span></div>' : '')
    + '<div class="death-row"><span>Net worth</span><span>' + fmt(nw) + '</span></div>'
    + '<div class="death-row"><span>Days lived</span><span>' + c.day + '</span></div>';
  if(heirs.length){
    const split = Math.floor(nw / heirs.length);
    html += '<div style="margin-top:12px;padding:12px;background:#1a1428;border:1px solid var(--gold);border-radius:6px;">'
      +    '<div style="color:var(--gold);font-weight:700;margin-bottom:8px;">Continue as next of kin (inherits ' + fmt(split) + ' each + all assets):</div>';
    heirs.forEach((k,i) => {
      html += '<button class="btn green" style="margin:4px;" onclick="continueAsKid(' + i + ')">' + (k.sex==='f'?'👧':'👦') + ' ' + k.name + ' (age ' + k.age + ')</button>';
    });
    html += '</div>';
  } else {
    html += '<div style="margin-top:12px;color:var(--t3);text-align:center;">No surviving heirs. Net worth lost to the void.</div>';
  }
  document.getElementById('death-summary').innerHTML = html;
  document.getElementById('death').classList.add('show');
  save();
}

// Inherit everything — money, savings, investments, house, car, items — to chosen kid.
function continueAsKid(kidIdx){
  const old = G.char;
  const kid = (old.kids||[])[kidIdx];
  if(!kid){ return; }
  const heirs = old.kids.filter(k => k.alive);
  const split = heirs.length;
  const cashShare    = Math.floor(old.money / split);
  const savingsShare = Math.floor((old.savings||0) / split);
  const investShare  = Math.floor((old.investments||0) / split);
  // House + car go entirely to the chosen heir (can't physically split)
  const newChar = {
    name: kid.name, sex: kid.sex, skin: old.skin, country: old.country,
    age: Math.max(kid.age, 18),
    day: old.day, hour: 8, daysAlive: 0,
    happiness:55, health:80, smarts:55, looks:55, karma:55, faith:25, fame:0,
    energy:100, hunger:100,
    money: cashShare,
    savings: savingsShare,
    investments: investShare,
    salary:0, job:null, jobYears:0,
    education:'(continuing on)', degrees:[],
    mom:{ name:old.name, age:old.age, alive:false, sex:old.sex },
    dad:{ name:'?', age:50, alive:true, sex: old.sex==='m'?'f':'m' },
    enrolled:null, enrolledYearsLeft:0,
    relationship:null, kids:[],
    ownedItems: old.ownedItems || [],
    owned: { house: old.owned ? old.owned.house : null, car: old.owned ? old.owned.car : null, rooms: old.owned ? (old.owned.rooms||[]) : [] },
    pets:[], bodyMods:[], addictions:[], placesVisited:[],
    traits: [], diseases: [], fertility: 50,
    religion: old.religion, reality: old.reality,
    alive:true, cause:null,
    generation: (old.generation||1) + 1,
  };
  G.char = newChar;
  G.zone = 'home';
  G.player = { x:5, y:8 };
  document.getElementById('death').classList.remove('show');
  buildZoneDOM('home');
  updateHud();
  miniMsg('🕯 ' + old.name + ' is at rest. ' + newChar.name + ' continues the family.');
  save();
}

function updateDayNight(){
  const el = document.getElementById('daynight');
  if(!el) return;
  const h = G.char.hour;
  let alpha = 0;
  let tint = 'rgba(0,0,30,';
  if(h < 6)        alpha = 0.65;
  else if(h < 8)   alpha = 0.40;
  else if(h < 18)  alpha = 0.00;
  else if(h < 20){ alpha = 0.25; tint = 'rgba(60,30,60,'; }
  else if(h < 22)  alpha = 0.50;
  else             alpha = 0.65;
  el.style.background = tint + alpha + ')';
}

function performRitual(lawId, ritualId){
  const c = G.char;
  const law = RELIGIOUS_LAWS[lawId];
  if(!law) return;
  const r = law.rituals[ritualId];
  if(!r) return;
  if(r.cost && c.money < r.cost){ toast('Not enough money.'); return; }
  if(r.cost) c.money -= r.cost;
  const fx = r.effect || {};
  // Map effect keys to char keys
  if(fx.happy != null)  c.happiness = clamp(c.happiness + fx.happy, 0, 100);
  if(fx.karma != null)  c.karma     = clamp(c.karma + fx.karma, 0, 100);
  if(fx.faith != null)  c.faith     = clamp((c.faith||0) + fx.faith, 0, 100);
  if(fx.smarts != null) c.smarts    = clamp(c.smarts + fx.smarts, 0, 100);
  if(fx.health != null) c.health    = clamp(c.health + fx.health, 0, 100);
  if(fx.looks != null)  c.looks     = clamp(c.looks + fx.looks, 0, 100);
  if(!c.ritualsCompleted) c.ritualsCompleted = [];
  c.ritualsCompleted.push(ritualId);
  // Marriage / divorce side effects
  if(['nikkah','cat_wedding','jew_wedding','hin_wedding','bud_wedding','civil_mar'].includes(ritualId)){
    if(c.relationship){ c.relationship.married = true; c.relationship.weddingType = ritualId; }
  } else if(['talaq','annulment','get_div','civil_div'].includes(ritualId)){
    if(c.relationship){
      c.money = Math.floor(c.money / 2);
      miniMsg('💔 Marriage ended. Assets split.');
      c.relationship = null;
    }
  }
  miniMsg(r.ico + ' ' + r.name + ' completed.');
  closeModal();
  updateHud();
  save();
  setTimeout(openReligiousCeremonies, 80);
}

function computeChildSupport(){
  const c = G.char;
  const monthly = (c.salary || 50000) / 12;
  return Math.max(200, Math.floor(monthly * 0.17));
}
function payChildSupport(kidName){
  const c = G.char;

  c.money -= amt;
  miniMsg('💸 Paid ' + fmt(amt) + ' in annual support for ' + kidName + '.');
  closeModal();
  updateHud();

function triggerBabyDrama(){
  const c = G.char;
  const sex = Math.random() < 0.5 ? 'm' : 'f';
  const otherName = (Math.random()<0.5?'Maria':'Jessica') + ' ' + (Math.random()<0.5?'Smith':'Garcia');
  closeModal();
  openMod('👶 Unexpected Call',
    '<p style="font-family:var(--font-s);font-size:14px;line-height:1.6;">' + otherName + ' called. She says she\'s pregnant — and you\'re the father. DNA test pending. What do you do?</p>'
    + '<div class="btn-row" style="margin-top:14px;">'
    + '<button class="btn green" onclick="babyDecide(\'accept\',\'' + otherName + '\',\'' + sex + '\')">Accept Paternity</button>'
    + '<button class="btn" onclick="babyDecide(\'dna\',\'' + otherName + '\',\'' + sex + '\')">Demand DNA Test ($800)</button>'
    + '<button class="btn red" onclick="babyDecide(\'deny\',\'' + otherName + '\',\'' + sex + '\')">Deny &amp; Fight</button>'
    + '</div>');
}
function babyDecide(mode, otherName, sex){
  const c = G.char;
  closeModal();
  if(mode === 'accept'){
    const babyName = prompt('Baby name?', sex==='m'?'James':'Mary');
    if(babyName === null) return;
    c.kids = c.kids || [];
    c.kids.push({name:babyName||'Baby', sex, age:0, alive:true, outOfWedlock:true, otherParent:otherName});
    applyFx({happy:8, karma:5});
    miniMsg('👶 You accepted paternity of ' + (babyName||'a child') + '.');
  } else if(mode === 'dna'){
    if(c.money < 800){ toast('Need $800.'); return; }
    c.money -= 800;
    if(Math.random() < 0.65){
      miniMsg('🧬 DNA test positive. You\'re the father.');
      babyDecide('accept', otherName, sex);
    } else {
      miniMsg('🧬 DNA test negative. You\'re off the hook.');
      applyFx({happy:10});
    }
  } else if(mode === 'deny'){
    if(Math.random() < 0.5){
      const arrears = 25000 + Math.floor(Math.random()*40000);
      c.money -= arrears;
      miniMsg('⚖️ Court found you the father. Back support: −' + fmt(arrears));
      applyFx({happy:-12, karma:-8});
    } else {
      miniMsg('⚖️ The case was dropped.');
    }
  }
  updateHud();
  save();
}

  if(c.owned && c.owned.house === 'mansion') list.push({ico:'🏰',label:'Mansion Owner'});
  if(c.owned && c.owned.house === 'estate') list.push({ico:'🏝️',label:'Country Estate'});
  if(c.owned && c.owned.car === 'bugatti') list.push({ico:'🏎️',label:'Bugatti Owner'});
  if(c.placesVisited && c.placesVisited.includes('space')) list.push({ico:'🚀',label:'Went to Space'});
  if(c.placesVisited && c.placesVisited.length >= 5) list.push({ico:'🌍',label:'World Traveler'});
  if(c.karma >= 90) list.push({ico:'😇',label:'Saintly Karma'});
  if(c.karma <= 10) list.push({ico:'😈',label:'Evil Reputation'});
  if(c.pets && c.pets.length >= 3) list.push({ico:'🐾',label:'Pet Lover'});
  if(c.religion && c.faith >= 80) list.push({ico:'🙏',label:'Devout'});
  if(c.job === 'Head of State') list.push({ico:'🏛️',label:'Head of State'});
  if(c.job === 'Doctor') list.push({ico:'⚕️',label:'Medical Professional'});
  if(c.job === 'Lawyer') list.push({ico:'⚖️',label:'Lawyer'});
  if(c.job === 'CEO' || c.job === 'Corporate Exec') list.push({ico:'🏢',label:'Corporate Exec'});
  return list;
}

function openStats(){
  const c = G.char;
  let html = '<p style="font-family:var(--font-m);font-size:11px;letter-spacing:.1em;color:var(--accent2);margin-bottom:10px;text-transform:uppercase;">Stats — ' + c.name + '</p>';
  ['happiness','health','smarts','looks','karma','energy','hunger'].forEach(k => {
    html += '<div style="margin-bottom:6px;"><span style="font-family:var(--font-m);font-size:10px;letter-spacing:.08em;color:var(--t3);text-transform:uppercase;">' + k + '</span>'
      + '<div class="hud-bar" style="width:100%;height:8px;margin-top:3px;"><div class="hud-bar-fill" style="width:' + (c[k]||0) + '%;background:linear-gradient(90deg,var(--accent),var(--accent2));"></div></div></div>';
  });
  openMod('Stats', html);
}
function openCharSheet(){
  const c = G.char;
  let html = '<div style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-family:var(--font-m);font-size:12px;">';
  const rows = [
    ['Name', c.name], ['Age', c.age], ['Sex', c.sex==='m'?'Male':'Female'],
    ['Country', COUNTRIES[c.country].flag + ' ' + COUNTRIES[c.country].name],
    ['Job', c.job || 'Unemployed'],
    ['Salary', c.salary ? fmt(c.salary) + '/yr' : '—'],
    ['Education', c.education + (c.degrees.length ? ' · ' + c.degrees.join(', ') : '')],
    ['Day', c.day], ['Hour', c.hour + ':00'],
    ['Money', fmt(c.money)],
    ['Owned Items', c.ownedItems.length],
  ];
  rows.forEach(([k,v]) => {
    html += '<span style="color:var(--t3);">' + k + '</span><span>' + v + '</span>';
  });
  html += '</div>';
  openMod('Character Sheet', html);
}

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function fmt(n){
  const cur = COUNTRIES[G.char.country].cur;
  if(Math.abs(n) >= 1000000) return (n<0?'−':'') + cur + (Math.abs(n)/1000000).toFixed(1) + 'M';
  if(Math.abs(n) >= 1000)    return (n<0?'−':'') + cur + (Math.abs(n)/1000).toFixed(1) + 'k';
  return (n<0?'−':'') + cur + Math.abs(n).toLocaleString();
}
function applyFx(fx){
  if(!fx) return;
  if(fx.happy)   G.char.happiness = clamp(G.char.happiness + fx.happy, 0, 100);
  if(fx.health)  G.char.health    = clamp(G.char.health + fx.health, 0, 100);
  if(fx.smarts)  G.char.smarts    = clamp(G.char.smarts + fx.smarts, 0, 100);
  if(fx.looks)   G.char.looks     = clamp(G.char.looks + fx.looks, 0, 100);
  if(fx.karma)   G.char.karma     = clamp(G.char.karma + fx.karma, 0, 100);
  if(fx.energy)  G.char.energy    = clamp(G.char.energy + fx.energy, 0, 100);
  if(fx.hunger)  G.char.hunger    = clamp(G.char.hunger + fx.hunger, 0, 100);
  if(fx.money)   G.char.money    += fx.money;
  updateHud();
  save();
}
function renderTopbarActions(){
  const c = G.char;
  const wrap = document.getElementById('topbar-actions');
  if(!wrap) return;
  const a = c.age;
  const btns = [];
  btns.push({lbl:'🏆', fn:'openAchievements()'});
  if(a >= 13) btns.push({lbl:'💞 Prefs', fn:'openDatingPrefs()'});
  if(a >= 16) btns.push({lbl:'💋 Risky', fn:'openAffairMenu()'});
  if(a >= 16) btns.push({lbl:'👶 Drama', fn:'openBabyDrama()'});
  if(a >= 18) btns.push({lbl:'💍 Dowry', fn:'openDowry()'});
  wrap.innerHTML = btns.map(b => '<button class="tb-btn" onclick="' + b.fn + '">' + b.lbl + '</button>').join('');
}

function netWorth(c){
  let n = (c.money||0) + (c.savings||0) + (c.investments||0);
  if(c.owned && c.owned.house){
    const h = (typeof HOUSES!=='undefined') && HOUSES.find(x => x.id === c.owned.house);
    if(h) n += Math.floor(h.price * 0.85);
  }
  if(c.owned && c.owned.car){
    const car = (typeof CARS!=='undefined') && CARS.find(x => x.id === c.owned.car);
    if(car) n += Math.floor(car.price * 0.5);
  }
  return n;
}

function updateHud(){
  const c = G.char;
  renderTopbarActions();
  const nwEl = document.getElementById('hud-networth');
  if(nwEl){ nwEl.textContent = 'Net ' + fmt(netWorth(c)); }
  document.getElementById('hud-age').textContent = 'Age ' + c.age;
  const moneyEl = document.getElementById('hud-money');
  moneyEl.textContent = fmt(c.money);
  moneyEl.className = 'hud-chip money' + (c.money < 0 ? ' neg' : '');
  document.getElementById('hud-time').textContent = 'Day ' + c.day + ' · ' + (c.hour < 12 ? c.hour + ' AM' : (c.hour === 12 ? '12 PM' : (c.hour - 12) + ' PM'));
  ['happiness','health','smarts','energy','hunger'].forEach(k => {
    const v = c[k] || 0;
    const elB = document.getElementById('hud-' + (k==='happiness'?'happy':k));
    if(elB) elB.style.width = v + '%';
    const elV = document.getElementById('hud-' + (k==='happiness'?'happy':k) + '-v');
    if(elV) elV.textContent = Math.round(v);
  });
}

function openMod(title, html){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }

let _toastT;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if(_toastT) clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
// ─── BIRTHDAY CAKE + YEAR-END SUMMARY ───
function showBirthdayCake(age){
  const cake = document.createElement('div');
  cake.className = 'birthday-cake';
  cake.innerHTML = '🎂<div class="bc-age">' + age + '</div>';
  document.body.appendChild(cake);
  setTimeout(() => cake.classList.add('rise'), 30);
  setTimeout(() => cake.remove(), 2400);
}

function showYearSummary(){
  const c = G.char;
  if(!c._yearSnapshot) return;
  const s = c._yearSnapshot;
  const delta = (now, before) => {
    const d = now - before;
    return d === 0 ? '' : (d > 0 ? ' (+' + d + ')' : ' (' + d + ')');
  };
  const moneyD = c.money - s.money;
  let html = '<div style="text-align:center;font-family:var(--font-h);font-size:22px;color:var(--accent2);margin-bottom:14px;">Year ' + c.age + ' · Recap</div>';
  html += '<div style="display:grid;grid-template-columns:auto auto;gap:6px 18px;font-family:var(--font-m);font-size:13px;line-height:1.6;">'
    + '<span style="color:var(--t3);">Happiness</span><b>' + c.happiness + delta(c.happiness, s.happiness) + '</b>'
    + '<span style="color:var(--t3);">Health</span><b>' + c.health + delta(c.health, s.health) + '</b>'
    + '<span style="color:var(--t3);">Smarts</span><b>' + c.smarts + delta(c.smarts, s.smarts) + '</b>'
    + '<span style="color:var(--t3);">Looks</span><b>' + c.looks + delta(c.looks, s.looks) + '</b>'
    + '<span style="color:var(--t3);">Karma</span><b>' + c.karma + delta(c.karma, s.karma) + '</b>'
    + '<span style="color:var(--t3);">Money</span><b style="color:' + (moneyD>=0?'var(--green)':'var(--crimson)') + '">' + fmt(c.money) + (moneyD ? ' (' + (moneyD>0?'+':'') + fmt(moneyD).replace('$','') + ')' : '') + '</b>'
    + '</div>';
  if(c.job) html += '<p style="margin-top:14px;font-size:12px;color:var(--t3);">Job: ' + c.job + ' · ' + fmt(c.salary) + '/yr</p>';
  if(c.relationship && c.relationship.married) html += '<p style="font-size:12px;color:var(--t3);">Married to ' + c.relationship.name + '.</p>';
  if(c.kids && c.kids.length) html += '<p style="font-size:12px;color:var(--t3);">Children: ' + c.kids.length + '</p>';
  html += '<button class="btn green" style="width:100%;margin-top:14px;padding:10px;" onclick="closeModal()">Continue</button>';
  // Only auto-show every 5 years to avoid spam — milestone years
  if(c.age % 5 === 0 || c.age === 1){
    openMod('Year ' + c.age + ' · Recap', html);
  }
}

let _msgT;
function miniMsg(msg){
  const t = document.getElementById('mini-msg');
  t.textContent = msg;
  t.classList.add('show');
  if(_msgT) clearTimeout(_msgT);
  _msgT = setTimeout(() => t.classList.remove('show'), 2800);
}

function confirmRestart(){
  if(!confirm('Start a new life? Current progress will be lost.')) return;
  restartGame();
}
function restartGame(){
  try { localStorage.removeItem('lyfewalk_save'); } catch(e){}
  G = null;
  document.getElementById('death').classList.remove('show');
  document.getElementById('game').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('intro').style.display = 'flex';
}

window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if(!G || !G.char || !G.char.alive) return;
  const k = e.key.toLowerCase();
  G.keys[k] = true;
  if(k === 'e'){
    e.preventDefault();
    if(G.lastInteract){ triggerBuildingAction(G.lastInteract.id); }
  } else if(k === ' '){
    // SPACE: skip a full year. SHIFT+SPACE skips 5 years. Both trigger
    // significant random life events along the way. If standing right next
    // to a building, prioritize interaction instead.
    e.preventDefault();
    if(G.lastInteract){
      triggerBuildingAction(G.lastInteract.id);
    } else {
      skipYears(e.shiftKey ? 5 : 1);
    }
  } else if(k === 'r'){
    e.preventDefault();
    advanceHours(1);
    miniMsg('⏱ +1 hour passed.');
  } else if(k === 'escape'){
    closeModal();
  } else if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  if(!G) return;
  G.keys[e.key.toLowerCase()] = false;
});

window.addEventListener('resize', () => { if(G) centerCameraOnPlayer(); });

renderCC();
if(load() && G && G.char && G.char.alive){
  document.getElementById('intro').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('game').style.display = 'block';
  G.keys = {};
  G._loopStarted = false;
  enterZone(G.zone);
  updateHud();
  updateDayNight();
  startLoop();
}
