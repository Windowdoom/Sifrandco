<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AXON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- fonts load async so being offline never blocks first paint -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
<canvas id="field"></canvas>
<div class="veil" id="veil">
  <div class="veil-mark">AXON</div>
  <div class="bootbar"><i></i></div>
  <div class="bt" id="bootText">initializing</div>
</div>
<div class="frame"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div></div>

<div class="app">
  <header class="status">
    <div class="l">
      <span class="axon">AXON</span>
      <span class="chip"><span class="dot" id="aiDot"></span><span id="aiTxt">offline</span></span>
      <span class="chip bridge" id="bridgeChip"><span class="dot"></span><span class="btxt">no bridge</span></span>
      <span class="spacepill" id="spacePill">◆ General</span>
    </div>
    <div class="r">
      <span class="nav">
        <button data-nav="spaces">Spaces</button>
        <button data-nav="memory">Memory</button>
        <button data-nav="settings">Settings</button>
      </span>
      <span id="clock">--:--</span>
    </div>
  </header>

  <main class="stage">
    <div class="core-wrap">
      <div class="core-glow"></div>
      <svg class="core" viewBox="0 0 230 230">
        <defs>
          <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#5EE6D8" stop-opacity=".9"/>
            <stop offset="55%" stop-color="#2BB3C4" stop-opacity=".25"/>
            <stop offset="100%" stop-color="#0A1828" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle class="ring r-out" cx="115" cy="115" r="106"/>
        <circle class="ring r-out2" cx="115" cy="115" r="98"/>
        <circle class="ring r-mid" cx="115" cy="115" r="86"/>
        <circle class="ring r-in" cx="115" cy="115" r="62"/>
        <circle class="ripple" cx="115" cy="115" r="70"/><circle class="ripple" cx="115" cy="115" r="70"/><circle class="ripple" cx="115" cy="115" r="70"/>
        <line class="tick" x1="115" y1="4" x2="115" y2="16"/><line class="tick" x1="115" y1="214" x2="115" y2="226"/>
        <line class="tick" x1="4" y1="115" x2="16" y2="115"/><line class="tick" x1="214" y1="115" x2="226" y2="115"/>
        <circle class="core-halo" cx="115" cy="115" r="54" fill="url(#coreGrad)"/>
        <circle class="core-disc" cx="115" cy="115" r="46"/>
        <circle class="core-dot" cx="115" cy="115" r="11"/>
      </svg>
    </div>
    <div class="coreState" id="coreState"></div>
    <div class="log" id="log"></div>
  </main>

  <div class="cmdwrap">
    <div style="width:100%;max-width:780px">
      <button class="stopbtn" id="stopBtn">■ stop</button>
      <div class="cmd">
        <input id="cmd" placeholder="Ask AXON anything — math, units, dates work offline too" autocomplete="off">
        <button class="iconbtn convo" id="convo" title="Hands-free conversation" aria-label="Conversation mode">∞</button>
        <button class="iconbtn mic" id="mic" title="Speak" aria-label="Voice">🎙</button>
        <button class="iconbtn send" id="send" title="Send" aria-label="Send">↵</button>
      </div>
      <div class="hints">
        <button class="chip-sug" data-q="briefing">briefing</button>
        <button class="chip-sug" data-q="quiz me on what I fed you">quiz me</button>
        <button class="chip-sug" data-q="summarize this">summarize</button>
        <button class="chip-sug" data-q="what do you know about me">my memory</button>
        <span class="kbd-hint">⌘K to focus · Esc to stop</span>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<script>setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},1000);document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});</script>
<script type="module" src="js/app.js?v=4"></script>
</body>
</html>
