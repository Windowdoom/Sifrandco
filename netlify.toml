[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200

[[redirects]]
  from = "/api/email-plan"
  to = "/.netlify/functions/email-plan"
  status = 200

[functions]
  node_bundler = "esbuild"
